function RestBar({rest, onSkip}){
  const [now,setNow] = useState(()=>Date.now());

  useEffect(()=>{
    if(!rest) return;
    const tick = ()=>setNow(Date.now());
    tick();
    const id = setInterval(tick, 250);
    const onVis = ()=>{ if(document.visibilityState==="visible") tick(); };
    document.addEventListener("visibilitychange", onVis);
    return ()=>{ clearInterval(id); document.removeEventListener("visibilitychange", onVis); };
  },[rest?.endsAt]);

  if(!rest) return null;

  const remaining = Math.max(0, Math.ceil((rest.endsAt - now)/1000));
  const pct  = clamp((remaining / Math.max(1,rest.total)) * 100, 0, 100);
  const done = remaining === 0;
  const urgent = remaining <= 10 && !done;
  const col = done ? C.green : urgent ? C.red : remaining <= 30 ? C.yellow : C.green;
  const m = Math.floor(remaining/60), s = remaining%60;

  return (<div style={{position:"fixed",left:0,right:0,bottom:"calc(66px + env(safe-area-inset-bottom))",
    background:C.surface,borderTop:`2px solid ${col}`,padding:"9px 16px 8px",zIndex:80}}>
    <div style={{maxWidth:620,margin:"0 auto"}}>
      <div style={{height:3,background:C.lineSoft,borderRadius:2,overflow:"hidden",marginBottom:7}}>
        <div style={{height:"100%",width:`${pct}%`,background:col,transition:"width .25s linear"}}/>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:"calc(.55rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".08em"}}>
            {done ? "GO" : "REST"}</div>
          <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,overflow:"hidden",
            textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{rest.label} · {rest.exName}</div>
        </div>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",color:col,lineHeight:1,minWidth:52,
          textAlign:"center",animation:urgent?"pulse .7s infinite":"none"}}>
          {done ? "GO" : m>0 ? `${m}:${String(s).padStart(2,"0")}` : `${s}s`}</div>
        <Btn kind="ghost" size="sm" onClick={onSkip}>{done ? "OK ✓" : "SKIP →"}</Btn>
      </div>
    </div>
  </div>);
}

/* ═══════════════════════════════════════════════════════════════════════════
   ONBOARDING

   OnboardShell MUST stay at module scope. Defined inside Onboarding it would be
   a new function identity on every render, so React would treat each keystroke
   as a change of component type, unmount the whole step, and destroy the focused
   input — which closes the keyboard after a single character on a phone.
   ═══════════════════════════════════════════════════════════════════════════ */

function OnboardShell({children, steps, step, onBack, showBack=true, cta, ctaLabel, disabled, secondary}){
  return (
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>
      <div style={{padding:"18px 18px 0",maxWidth:560,margin:"0 auto",width:"100%"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <Logo h={24}/>
          <div style={{width:1,height:16,background:C.line}}/>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:".9rem",color:C.dim,letterSpacing:".12em"}}>GYM BUDDY</div>
        </div>
        <div style={{display:"flex",gap:4,marginBottom:22}}>
          {steps.map((s,i)=>(<div key={s} style={{flex:1,height:3,borderRadius:2,
            background:i<=step?C.red:C.lineSoft,transition:"background .3s"}}/>))}
        </div>
      </div>
      <div style={{flex:1,padding:"0 18px",maxWidth:560,margin:"0 auto",width:"100%",overflowY:"auto"}}>
        {children}
      </div>
      <div style={{padding:"14px 18px calc(20px + env(safe-area-inset-bottom))",maxWidth:560,margin:"0 auto",width:"100%",
        display:"flex",flexDirection:"column",gap:8,borderTop:`1px solid ${C.lineSoft}`,background:C.bg}}>
        <div style={{display:"flex",gap:8}}>
          {showBack && step>0 && <Btn kind="ghost" size="lg" onClick={onBack} style={{width:56,padding:0}}>←</Btn>}
          <Btn size="lg" full onClick={cta} disabled={disabled}>{ctaLabel}</Btn>
        </div>
        {secondary}
      </div>
    </div>
  );
}

function Onboarding({state, setState, onDone, onRestore, coach}){
  const [step,setStep]   = useState(0);
  const [goal,setGoal]   = useState(state.goal || {type:"build_muscle", targetValue:"", targetDate:"", startValue:"", why:""});
  const [prof,setProf]   = useState({...state.profile});
  const [lim,setLim]     = useState({...state.limits});
  const [equip,setEquip] = useState({...state.equipment});
  const [key,setKey]     = useState(loadKey());
  const [keyState,setKeyState] = useState("idle");
  const [keyMsg,setKeyMsg]     = useState("");
  const [building,setBuilding] = useState(false);
  const [restoreError,setRestoreError] = useState("");
  const [restoring,setRestoring] = useState(false);
  const restoreRef = useRef(null);

  const g = GOAL_BY_ID[goal.type];
  const steps = ["Welcome","Goal","You","Body","Gym","Coach"];

  async function finish(){
    setBuilding(true);
    saveKey(key.trim());
    const seededWeights = prof.experience==="no_experience" ? {} : onboardingWeights(prof);
    const next = {...state, goal, profile:prof, limits:lim, equipment:equip,
      weights:{...state.weights,...seededWeights}, onboarded:true};
    setState(next);
    // Block is built by the caller once state has settled.
    await new Promise(r=>setTimeout(r,60));
    onDone(next);
  }

  async function testKey(){
    const k = key.trim();
    if(!k) return;
    setKeyState("testing"); setKeyMsg("");
    try{ await coach.testKey(k); setKeyState("ok"); setKeyMsg("Key works. Your coach is live."); }
    catch(e){ setKeyState("bad"); setKeyMsg(e.kind==="auth" ? "That key was rejected. Check you copied all of it." : e.message); }
  }

  function loadBackup(e){
    const file=e.target.files?.[0];
    e.target.value="";
    if(!file) return;
    setRestoreError(""); setRestoring(true);
    const reader=new FileReader();
    reader.onerror=()=>{ setRestoring(false); setRestoreError("Couldn't read that file from this device."); };
    reader.onload=ev=>{
      try{
        const parsed=inspectJSON(String(ev.target.result));
        if(!parsed.state.onboarded || !parsed.state.goal)
          throw new Error("That backup does not contain a completed SnapFit setup.");
        onRestore(parsed.state,parsed.apiKey);
      }catch(err){
        setRestoreError(err.message||"That backup could not be restored.");
        setRestoring(false);
      }
    };
    reader.readAsText(file);
  }

  // Stable props for the module-scope shell.
  const shell = { steps, step, onBack:()=>setStep(s=>s-1) };

  /* 0 — Welcome */
  if(step===0) return (<OnboardShell {...shell} cta={()=>setStep(1)} ctaLabel="LET'S GO →" showBack={false}
    secondary={<div>
      <Btn kind="solid" size="md" full onClick={()=>restoreRef.current?.click()} disabled={restoring}>
        {restoring?<><Spinner size={12}/> Loading backup…</>:"LOAD FROM JSON BACKUP"}</Btn>
      <input ref={restoreRef} type="file" accept=".json,application/json" onChange={loadBackup} style={{display:"none"}}/>
      <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,textAlign:"center",lineHeight:1.5,marginTop:6}}>
        Restores your goal, plan, history, settings and saved API key, then skips setup.</div>
      {restoreError && <ErrLine text={restoreError}/>}
    </div>}>
    <h1 style={{fontSize:"2.7rem",color:C.text,lineHeight:1.05,marginBottom:14}}>
      NOT JUST A<br/><span style={{color:C.red}}>TRACKER</span>
    </h1>
    <div style={{fontSize:"calc(.88rem * var(--ts, 1))",color:C.dim,lineHeight:1.75,marginBottom:22}}>
      V1 told you what to lift. This one tells you <strong style={{color:C.text}}>why</strong>, shows you <strong style={{color:C.text}}>how</strong>,
      and builds a real plan toward something you actually want.
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:20}}>
      {[
        ["🎯","One goal, one plan","You set the target. The app builds a multi-week block toward it and tells you where you are in it."],
        ["📖","It teaches as you go","Setup cues, common mistakes, and why each exercise earns its place — right on the card, at the rack."],
        ["💬","Ask it anything","A coach that can see your actual logged history and answer specifically."],
        ["🔁","Check in, debrief, adjust","How you slept changes today's session. What you lifted changes next week's."],
      ].map(([icon,t,b])=>(
        <div key={t} style={{display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{fontSize:"calc(1.1rem * var(--ts, 1))",width:26,flexShrink:0,textAlign:"center"}}>{icon}</div>
          <div style={{minWidth:0}}>
            <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:2}}>{t}</div>
            <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.faint,lineHeight:1.6}}>{b}</div>
          </div>
        </div>))}
    </div>
    <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.ghost,lineHeight:1.6,borderTop:`1px solid ${C.lineSoft}`,paddingTop:14}}>
      Takes about a minute to set up. Everything stays on this device.
    </div>
  </OnboardShell>);

  /* 1 — Goal */
  if(step===1) return (<OnboardShell {...shell} cta={()=>setStep(2)} ctaLabel="NEXT →" disabled={!goal.type}>
    <SectionTitle sub="Everything else is built backwards from this.">WHAT ARE YOU AFTER?</SectionTitle>
    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
      {GOAL_TYPES.map(gt=>{
        const on = goal.type===gt.id;
        return (<button key={gt.id} onClick={()=>setGoal(x=>({...x,type:gt.id}))} style={{
          padding:"14px 15px",borderRadius:13,cursor:"pointer",textAlign:"left",
          border:`1.5px solid ${on?C.red:C.line}`, background:on?`${tint(C.red,0x0f)}`:C.card}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4}}>
            <span style={{fontSize:"calc(1.1rem * var(--ts, 1))"}}>{gt.icon}</span>
            <span style={{fontSize:"calc(.92rem * var(--ts, 1))",fontWeight:700,color:on?C.text:C.dim}}>{gt.label}</span>
          </div>
          <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,lineHeight:1.55}}>{gt.blurb}</div>
        </button>);
      })}
    </div>

    <div style={{background:C.card,border:`1px solid ${C.lineSoft}`,borderRadius:14,padding:16}}>
      <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.dim,marginBottom:14,lineHeight:1.6}}>
        Give it a target and a date if you can. A goal with a number attached is one the coach can actually measure you against — but you can leave these blank and set them later.
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="Target">
          <Input type="number" inputMode="decimal" placeholder={g?.id==="get_stronger"?"e.g. 140":"e.g. 78"}
            value={goal.targetValue} onChange={e=>setGoal(x=>({...x,targetValue:e.target.value}))}/>
        </Field>
        <Field label="By when">
          <Input type="date" value={goal.targetDate} onChange={e=>setGoal(x=>({...x,targetDate:e.target.value}))}/>
        </Field>
      </div>
      <Field label="Starting point" hint={`Measured as ${g?.metric||"your main metric"}.`}>
        <Input type="number" inputMode="decimal" placeholder="Where you are today"
          value={goal.startValue} onChange={e=>setGoal(x=>({...x,startValue:e.target.value}))}/>
      </Field>
      <Field label="Why does this matter to you?" hint="Optional, but the coach will use it when the sessions get hard.">
        <TextArea placeholder="e.g. I want to keep up with my kids without getting winded" value={goal.why}
          onChange={e=>setGoal(x=>({...x,why:e.target.value}))}/>
      </Field>
    </div>
  </OnboardShell>);

  /* 2 — Profile */
  if(step===2) return (<OnboardShell {...shell} cta={()=>setStep(3)} ctaLabel="NEXT →">
    <SectionTitle sub="Shapes how hard the plan pushes and how fast it climbs.">ABOUT YOU</SectionTitle>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
      <Field label="Age"><Input type="number" inputMode="numeric" placeholder="35" value={prof.age}
        onChange={e=>setProf(p=>({...p,age:e.target.value}))}/></Field>
      <Field label="Height (cm)"><Input type="number" inputMode="numeric" placeholder="178" value={prof.heightCm}
        onChange={e=>setProf(p=>({...p,heightCm:e.target.value}))}/></Field>
    </div>
    <Field label="Sex" hint="Used only to calibrate starting loads and rates of progress.">
      <Choice cols={3} value={prof.sex} onChange={v=>setProf(p=>({...p,sex:v}))}
        options={[{value:"male",label:"Male"},{value:"female",label:"Female"},{value:"",label:"Rather not"}]}/>
    </Field>
    <Field label="Experience">
      <Choice cols={1} value={prof.experience} onChange={v=>setProf(p=>({...p,experience:v}))}
        options={[
          {value:"no_experience",label:"No lifting experience", sub:"I haven't trained with weights before"},
          {value:"beginner",     label:"Some experience", sub:"Under 6 months of consistent lifting"},
          {value:"intermediate", label:"Been around", sub:"6 months to 2 years, know the machines"},
          {value:"advanced",     label:"Experienced", sub:"2+ years, know what a hard set feels like"},
        ]}/>
    </Field>
    {prof.experience!=="no_experience" && (<Card accent={C.blue} style={{marginBottom:14}}>
      <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:4}}>Your recent working weights</div>
      <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,lineHeight:1.55,marginBottom:12}}>
        Optional. Enter a weight you could lift for about 6–12 clean reps. This gives the first plan a safer, more useful starting point.</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:10}}>
        {[["leg_press","Leg press"],["chest_press_mach","Chest press"],["lat_pulldown","Lat pulldown"],["seated_row","Seated row"]].map(([id,label])=>(
          <Field key={id} label={`${label} (kg)`}>
            <Input type="number" inputMode="decimal" min="0" step="0.5" placeholder="Not sure"
              value={prof.baselineWeights?.[id]||""}
              onChange={e=>setProf(p=>({...p,baselineWeights:{...(p.baselineWeights||{}),[id]:e.target.value}}))}/>
          </Field>
        ))}
      </div>
    </Card>)}
    <Field label={`Days per week — ${prof.daysPerWeek}`} hint="Pick the number you'll actually hit, not the number you'd like to hit. Three consistent days beats five you skip.">
      <Slider min={2} max={5} value={prof.daysPerWeek} onChange={v=>setProf(p=>({...p,daysPerWeek:v}))}
        format={v=>`${v} days`}/>
      <div style={{fontSize:"calc(.65rem * var(--ts, 1))",color:C.faint,marginTop:8}}>
        Split: {(SPLITS[prof.daysPerWeek]||SPLITS[3]).map(d=>d.name).join(" · ")}
      </div>
    </Field>
    <Field label="Session length" hint={durationShape(prof.sessionMinutes).note}>
      <Slider min={20} max={90} step={5} value={prof.sessionMinutes}
        onChange={v=>setProf(p=>({...p,sessionMinutes:v}))} format={v=>`${v} min`}/>
    </Field>
    <Toggle on={prof.useSupersets!==false} label="Accessory supersets"
      sub="Pairs compatible smaller exercises to save time. Main compound lifts and deloads stay separate."
      onChange={v=>setProf(p=>({...p,useSupersets:v}))}/>
    <Field label="Dumbbell rack increments" hint="Watagan Park is seeded as 2kg jumps. Change this if your rack uses 2.5kg commercial dumbbells.">
      <Choice cols={2} value={Number(prof.dumbbellStep)||2} onChange={v=>setProf(p=>({...p,dumbbellStep:v}))}
        options={[{value:2,label:"2 kg"},{value:2.5,label:"2.5 kg"}]}/>
    </Field>
    <Field label="Free weights vs machines" hint="Machines are easier to learn and safer to push alone. Free weights build more control and carry over better. Most people do well somewhere in between.">
      <Slider min={0} max={100} step={10} value={prof.freeWeightPct}
        onChange={v=>setProf(p=>({...p,freeWeightPct:v}))}
        format={v=>v===0?"All machines":v===100?"All free weights":`${v}% free weights`}/>
    </Field>
  </OnboardShell>);

  /* 3 — Limits */
  if(step===3) return (<OnboardShell {...shell} cta={()=>setStep(4)} ctaLabel="NEXT →">
    <SectionTitle sub="Anything flagged here gets programmed around, not through.">ANYTHING SORE?</SectionTitle>
    <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
      {[["knees","Knees","Skips leg press, extensions and squats"],
        ["shoulders","Shoulders","Skips overhead pressing and lateral raises"],
        ["back","Lower back","Skips rows, back extensions and loaded hinges"],
        ["ankles","Ankles","Skips calf work and single-leg balance"],
        ["elbows","Elbows","Eases off direct arm work"]].map(([k,label,sub])=>(
        <Toggle key={k} on={lim[k]} onChange={v=>setLim(l=>({...l,[k]:v}))} label={label} sub={sub}/>
      ))}
    </div>
    <Field label="Anything else worth knowing?" hint="Old injuries, exercises you hate, things a physio told you.">
      <TextArea placeholder="e.g. Left shoulder clicks on overhead press — fine on machines"
        value={lim.note} onChange={e=>setLim(l=>({...l,note:e.target.value}))}/>
    </Field>
    <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.ghost,lineHeight:1.65,background:C.card,border:`1px solid ${C.lineSoft}`,
      borderRadius:12,padding:14,marginTop:6}}>
      This app gives general training guidance, not medical advice. Sharp pain, pain in a joint,
      pain on one side only, or anything that doesn't settle — see a physio or doctor. The coach will
      work around it in the meantime, but it can't diagnose anything.
    </div>
  </OnboardShell>);

  /* 4 — Equipment */
  if(step===4){
    const allStations = [...SEED_STATIONS, ...(equip.custom||[])];
    const on = new Set(equip.enabled);
    const toggle = num => setEquip(e=>({...e, enabled: on.has(num) ? e.enabled.filter(n=>n!==num) : [...e.enabled, num]}));
    return (<OnboardShell {...shell} cta={()=>setStep(5)} ctaLabel="NEXT →" disabled={!equip.enabled.length}>
      <SectionTitle sub="Pre-loaded with Snap Fitness Watagan Park. Untick anything that isn't there.">YOUR GYM</SectionTitle>
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <Btn kind="ghost" size="sm" onClick={()=>setEquip(e=>({...e,enabled:allStations.map(s=>s.num)}))}>Select all</Btn>
        <Btn kind="ghost" size="sm" onClick={()=>setEquip(e=>({...e,enabled:[]}))}>Clear</Btn>
        <div style={{marginLeft:"auto",fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,alignSelf:"center"}}>{equip.enabled.length} of {allStations.length}</div>
      </div>
      <div className="equipment-grid" style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:6,marginBottom:16,width:"100%",minWidth:0}}>
        {allStations.map(s=>{
          const active = on.has(s.num);
          return (<button key={s.num} onClick={()=>toggle(s.num)} style={{
            width:"100%",minWidth:0,maxWidth:"100%",minHeight:54,padding:"9px 10px",borderRadius:9,cursor:"pointer",textAlign:"left",display:"flex",gap:7,alignItems:"center",
            border:`1px solid ${active?tint(C.red,0x55):C.line}`, background:active?`${tint(C.red,0x0d)}`:C.raised}}>
            <div style={{width:14,height:14,borderRadius:4,flexShrink:0,
              background:active?C.red:"transparent",border:`1.5px solid ${active?C.red:C.ghost}`,
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:"calc(.55rem * var(--ts, 1))",color:"#fff"}}>{active?"✓":""}</div>
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:active?C.text:C.faint,fontWeight:active?600:400,
                lineHeight:1.25,overflowWrap:"anywhere"}}>{s.name}</div>
              <div style={{fontSize:"calc(.55rem * var(--ts, 1))",color:C.ghost}}>#{s.num}</div>
            </div>
          </button>);
        })}
      </div>
      <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.ghost,lineHeight:1.6}}>
        You can edit this any time in Settings, including adding your own equipment.
      </div>
    </OnboardShell>);
  }

  /* 5 — Key */
  return (<OnboardShell {...shell} cta={finish} ctaLabel={building?"BUILDING YOUR PLAN…":"BUILD MY PLAN →"} disabled={building}>
    <SectionTitle sub="Optional. The app is fully usable without it.">TURN ON THE COACH</SectionTitle>

    <Card style={{marginBottom:14}} accent={C.green}>
      <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:8}}>Without a key you still get</div>
      <div style={{fontSize:"calc(.73rem * var(--ts, 1))",color:C.faint,lineHeight:1.75}}>
        Your full training block, every session generated and progressed, all the form coaching and
        the Learn library, plus tracking and history. It works offline, in a gym dead-spot, forever.
      </div>
    </Card>

    <Card style={{marginBottom:16}} accent={C.red}>
      <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:8}}>A key adds</div>
      <div style={{fontSize:"calc(.73rem * var(--ts, 1))",color:C.faint,lineHeight:1.75}}>
        A plan written for you rather than picked from a template, sessions that adapt to how you're
        recovering, coaching written around your actual numbers, session debriefs and weekly reviews,
        and the chat tab where you can ask it anything.
      </div>
    </Card>

    <Field label="Anthropic API key" hint="Starts with sk-ant-. Get one at console.anthropic.com → API Keys.">
      <Input type="password" placeholder="sk-ant-..." value={key} autoComplete="off"
        onChange={e=>{setKey(e.target.value); setKeyState("idle"); setKeyMsg("");}}
        style={{fontFamily:"monospace",fontSize:"calc(.78rem * var(--ts, 1))"}}/>
    </Field>

    {key.trim() && (<div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12}}>
      <Btn kind="solid" size="sm" onClick={testKey} disabled={keyState==="testing"}>
        {keyState==="testing" ? <><Spinner size={12}/> Testing</> : "Test key"}
      </Btn>
      {keyMsg && <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:keyState==="ok"?C.green:C.red,lineHeight:1.5}}>{keyMsg}</div>}
    </div>)}

    <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.ghost,lineHeight:1.7,background:C.card,
      border:`1px solid ${C.lineSoft}`,borderRadius:12,padding:14}}>
      <strong style={{color:C.yellow}}>Worth knowing:</strong> the key is stored in this browser, unencrypted.
      Anything else running on this device can read it. Use a key with a spend limit, and don't do this on a
      shared computer. Calls go straight from your browser to Anthropic — nothing passes through a server of ours,
      because there isn't one.
      <div style={{marginTop:8,color:C.faint}}>
        Typical cost is a fraction of a cent per session on the cheaper models. You can switch models in Settings.
      </div>
    </div>
  </OnboardShell>);
}

/* ═══════════════════════════════════════════════════════════════════════════
   CHECK-IN
   ═══════════════════════════════════════════════════════════════════════════ */

const SCALE = {
  sleep:   {label:"Sleep",    icon:"😴", low:"Awful",  high:"Great",  invert:false, hint:"Last night"},
  energy:  {label:"Energy",   icon:"⚡", low:"Empty",  high:"Buzzing",invert:false, hint:"Right now"},
  soreness:{label:"Soreness", icon:"🦵", low:"None",   high:"Wrecked",invert:true,  hint:"From last session"},
  stress:  {label:"Stress",   icon:"🌀", low:"Calm",   high:"Fried",  invert:true,  hint:"Life in general"},
};

function CheckIn({onSubmit, onSkip, bonus=false, onCancel, defaultMinutes=45, regenerationReason=""}){
  const [v,setV] = useState({sleep:3, energy:3, soreness:2, stress:2,
    availableMinutes:Number(defaultMinutes)||45, note:""});
  const adj = readinessAdjustment(v);
  return (<div className="rise" style={{paddingTop:8,paddingBottom:24}}>
    <SectionTitle sub={bonus
      ? "The next workout in your current block, added outside your weekly target."
      : "Thirty seconds. It changes what today looks like."}>
      {bonus ? "EXTRA SESSION" : "HOW ARE YOU TODAY?"}
    </SectionTitle>

    {bonus && (<Card accent={C.green} style={{marginBottom:14}}>
      <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:5}}>
        Extra day. Same plan.
      </div>
      <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,lineHeight:1.65}}>
        The coach will build the next workout in your current split using the same phase, sets,
        rep range and progression. It advances the block, but your usual weekly target does not change.
      </div>
    </Card>)}

    {regenerationReason && <Card accent={C.orange} style={{marginBottom:14}}>
      <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.orange,fontWeight:700,letterSpacing:".08em",marginBottom:5}}>
        REBUILDING TODAY
      </div>
      <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.faint,lineHeight:1.6}}>
        The previous draft was rejected because: <strong style={{color:C.text}}>{regenerationReason}</strong>.
        Update the check-in below and the coach will build a different session without advancing the plan.
      </div>
    </Card>}

    <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:18}}>
      {Object.entries(SCALE).map(([k,cfg])=>(
        <Card key={k} style={{padding:14}}>
          <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:10}}>
            <span style={{fontSize:"calc(1rem * var(--ts, 1))"}}>{cfg.icon}</span>
            <span style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:600}}>{cfg.label}</span>
            <span style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,marginLeft:"auto"}}>{cfg.hint}</span>
          </div>
          <div style={{display:"flex",gap:5}}>
            {[1,2,3,4,5].map(n=>{
              const on = v[k]===n;
              const good = cfg.invert ? n<=2 : n>=4;
              const bad  = cfg.invert ? n>=4 : n<=2;
              const col  = on ? (good?C.green:bad?C.orange:C.yellow) : C.line;
              return (<button key={n} onClick={()=>setV(x=>({...x,[k]:n}))} style={{
                flex:1, height:38, borderRadius:9, cursor:"pointer",
                border:`1.5px solid ${col}`, background:on?`${tint(col,0x1a)}`:C.raised,
                color:on?col:C.ghost, fontSize:"calc(.8rem * var(--ts, 1))", fontWeight:700}}>{n}</button>);
            })}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:5}}>
            <span style={{fontSize:"calc(.56rem * var(--ts, 1))",color:C.ghost}}>{cfg.low}</span>
            <span style={{fontSize:"calc(.56rem * var(--ts, 1))",color:C.ghost}}>{cfg.high}</span>
          </div>
        </Card>))}
    </div>

    <Card style={{marginBottom:12}}>
      <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:9}}>⏱ Time available today</div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
        {[20,30,45,60,90].map(n=><button key={n} onClick={()=>setV(x=>({...x,availableMinutes:n}))} style={{
          flex:"1 1 48px",height:38,borderRadius:9,cursor:"pointer",fontWeight:700,
          border:`1.5px solid ${v.availableMinutes===n?C.blue:C.line}`,
          background:v.availableMinutes===n?tint(C.blue,0x15):C.raised,
          color:v.availableMinutes===n?C.blue:C.ghost}}>{n}m</button>)}
      </div>
    </Card>
    <Card style={{marginBottom:16}}>
      <Field label="Anything the coach should know?" hint="Optional — equipment, a time constraint, or something unusual about the last workout.">
        <TextArea value={v.note} onChange={e=>setV(x=>({...x,note:e.target.value.slice(0,300)}))}
          placeholder="Example: My shoulder feels fine now, but keep pressing conservative."/>
      </Field>
    </Card>

    <Card accent={adj.color} style={{marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:adj.color}}/>
        <div style={{fontSize:"calc(.8rem * var(--ts, 1))",color:adj.color,fontWeight:700}}>{adj.label}</div>
      </div>
      <div style={{fontSize:"calc(.73rem * var(--ts, 1))",color:C.faint,lineHeight:1.65}}>{adj.note}</div>
    </Card>

    <Btn size="lg" full onClick={()=>onSubmit(v)}>{bonus?"BUILD EXTRA SESSION →":"BUILD TODAY'S SESSION →"}</Btn>
    <button onClick={onSkip} style={{width:"100%",marginTop:10,background:"transparent",border:"none",
      color:C.ghost,fontSize:"calc(.72rem * var(--ts, 1))",cursor:"pointer",padding:8}}>Skip — just give me the session</button>
    {bonus && <button onClick={onCancel} style={{width:"100%",background:"transparent",border:"none",
      color:C.faint,fontSize:"calc(.7rem * var(--ts, 1))",cursor:"pointer",padding:8}}>Cancel extra session</button>}
  </div>);
}

/* ═══════════════════════════════════════════════════════════════════════════
   EXERCISE CARD
   ═══════════════════════════════════════════════════════════════════════════ */

function ExerciseCard({ex, idx, logs, onLogSet, onExplain, explanation, explaining, aiOn,
                       showWhy=true, showHow=true, onAskCoach, onSwap, onViewHistory}){
  const [open,setOpen] = useState(null);   // "why" | "how" | null
  const [expanded,setExpanded] = useState(false);
  const done  = logs.filter(l=>l&&l.reps!=null).length;
  const all   = done >= ex.sets;
  const avg   = done ? Math.round((logs.filter(l=>l&&l.reps!=null).reduce((n,l)=>n+l.reps,0)/done)*10)/10 : null;
  const videoURL = `https://www.youtube.com/results?search_query=${encodeURIComponent(`${ex.name} exercise technique shorts`)}`;

  useEffect(()=>{
    if(all){ setExpanded(false); setOpen(null); }
  },[all]);
  useEffect(()=>{
    if((open==="why"&&!showWhy)||(open==="how"&&!showHow)) setOpen(null);
  },[showWhy,showHow]);

  // Big number = what you're actually lifting. The prescription row below keeps
  // the coach's number visible regardless.
  const loggedSets  = logs.filter(l=>l && l.reps!=null);
  const shownWeight = loggedSets.length ? loggedSets[loggedSets.length-1].weight : ex.weight;
  const offPlan     = shownWeight !== ex.weight;

  return (<Card style={{marginBottom:10, borderColor: all?`${tint(C.green,0x55)}`:C.lineSoft,
    background:all?tint(C.green,0x18):C.card}}
    accent={all?C.green:undefined}>

    <button onClick={()=>setExpanded(v=>!v)} aria-expanded={expanded}
      aria-label={`${expanded?"Close":"Open"} ${ex.name} exercise details`} style={{
      width:"100%",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,
      marginBottom:expanded?10:0,padding:0,background:"transparent",border:"none",cursor:"pointer",textAlign:"left"}}>
      <div style={{minWidth:0,flex:1}}>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3,flexWrap:"wrap"}}>
          <span style={{fontSize:"calc(.56rem * var(--ts, 1))",color:C.ghost,fontWeight:700}}>{String(idx+1).padStart(2,"0")}</span>
          <span style={{fontSize:"calc(.95rem * var(--ts, 1))",color:C.text,fontWeight:700,lineHeight:1.2}}>{ex.name}</span>
          {all && <span style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.green}}>✓</span>}
        </div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",alignItems:"center"}}>
          {ex.stations.map(s=><Chip key={s} color={C.blue}>#{s}</Chip>)}
          <Chip color={C.faint}>{ex.primary}</Chip>
          {ex.compound && <Chip color={C.purple}>compound</Chip>}
          {ex.superset && <Chip color={C.purple}>SUPERSET {ex.superset.group}{ex.superset.position}</Chip>}
          {ex.swapInfo && <Chip color={C.orange}>SWAPPED · {SWAP_REASON_BY_KEY[ex.swapInfo.reason]?.short||ex.swapInfo.reason}</Chip>}
        </div>
      </div>
      <div style={{textAlign:"right",flexShrink:0}}>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.7rem",
          color:offPlan?C.yellow:C.text,lineHeight:1}}>
          {shownWeight}<span style={{fontSize:"calc(0.8rem * var(--ts, 1))",color:C.faint}}>kg</span></div>
        <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,marginTop:2}}>
          {offPlan ? "you're lifting" : `${ex.sets} × ${ex.targetReps}`}</div>
        <div style={{fontSize:"calc(.56rem * var(--ts, 1))",color:all?C.green:C.ghost,marginTop:5,fontWeight:700,
          letterSpacing:".04em"}}>{expanded?"HIDE ▴":all?"COMPLETE · VIEW ▾":"OPEN ▾"}</div>
      </div>
    </button>

    {onViewHistory && <button onClick={onViewHistory} style={{width:"100%",marginTop:8,padding:"7px 10px",borderRadius:8,
      cursor:"pointer",fontSize:"calc(.64rem * var(--ts, 1))",fontWeight:700,textAlign:"left",
      border:`1px solid ${C.line}`,background:C.raised,color:C.blue}}>
      VIEW PREVIOUS {ex.name.toUpperCase()} LOGS →
    </button>}

    {expanded && (<>

    {/* The prescription. Never changes as you log, so the target is always on
        screen even after you've overridden the weight. */}
    <div style={{background:C.raised,borderRadius:9,padding:"8px 10px",marginBottom:10}}>
      <div style={{display:"flex",alignItems:"baseline",gap:7,flexWrap:"wrap"}}>
        <span style={{fontSize:"calc(.55rem * var(--ts, 1))",color:C.blue,fontWeight:700,letterSpacing:".08em",flexShrink:0}}>COACH SAYS</span>
        <span style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.text,fontWeight:600}}>
          {ex.weight}kg · {ex.sets} × {ex.targetReps}{ex.rpe?` · RPE ${ex.rpe}`:""}</span>
      </div>
      {ex.tempo && <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.faint,marginTop:4}}>
        <strong style={{color:C.purple}}>TEMPO</strong> · {ex.tempo}</div>}
      {ex.decisionLabel && (
        <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:ex.decisionColor,marginTop:3}}>{ex.decisionLabel}</div>)}
      {ex.plateLoad && <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.blue,marginTop:4,lineHeight:1.55}}>
        LOAD EACH SIDE: <strong>{ex.plateLoad.perSide}kg</strong>
        {ex.plateLoad.plates?.length?` · ${ex.plateLoad.plates.map(p=>`${p.count}×${p.kg}`).join(" + ")}kg plates`:" · machine resistance only"}
        {` · ${ex.plateLoad.total}kg total including machine`}
      </div>}
      {offPlan && (
        <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.yellow,marginTop:3}}>
          You're {Math.abs(round25(shownWeight-ex.weight))}kg {shownWeight<ex.weight?"under":"over"} that.</div>)}
    </div>

    {/* set buttons */}
    <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
      {Array.from({length:ex.sets}).map((_,i)=>{
        const l = logs[i];
        const filled = l && l.reps!=null;
        const eff = filled ? EFFORT_BY_KEY[l.effort] : null;
        const col = filled ? (eff?.color||C.green) : C.line;
        return (<button key={i} onClick={()=>onLogSet(i)} style={{
          flex:"1 1 60px", minWidth:58, height:52, borderRadius:11, cursor:"pointer",
          border:`1.5px solid ${col}`, background:filled?`${tint(col,0x14)}`:C.raised,
          display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:1}}>
          {filled ? (<>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.15rem",color:col,lineHeight:1}}>{l.reps}</div>
            <div style={{fontSize:"calc(.52rem * var(--ts, 1))",color:C.faint}}>{l.weight}kg {eff?.emoji}</div>
          </>) : (<>
            <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,fontWeight:700}}>SET {i+1}</div>
            <div style={{fontSize:"calc(.54rem * var(--ts, 1))",color:C.ghost}}>tap to log</div>
          </>)}
        </button>);
      })}
    </div>

    {done>0 && <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,marginBottom:10}}>
      {done}/{ex.sets} sets · averaging {avg} reps{avg>=ex.targetReps?" — at target":avg>=ex.targetReps-2?" — close":""}
    </div>}

    {/* Optional help controls can be hidden in Settings to keep cards lean. */}
    {(showWhy||showHow||aiOn||onSwap) && <div style={{display:"flex",gap:6,borderTop:`1px solid ${C.lineSoft}`,paddingTop:10,flexWrap:"wrap"}}>
      {showWhy && <button onClick={()=>setOpen(o=>o==="why"?null:"why")} style={{
        flex:1,padding:"8px 10px",borderRadius:9,cursor:"pointer",fontSize:"calc(.68rem * var(--ts, 1))",fontWeight:600,
        border:`1px solid ${open==="why"?tint(C.yellow,0x55):C.line}`,
        background:open==="why"?`${tint(C.yellow,0x0d)}`:"transparent", color:open==="why"?C.yellow:C.dim}}>
        Why this? {open==="why"?"▴":"▾"}
      </button>}
      {showHow && <button onClick={()=>{ setOpen(o=>o==="how"?null:"how"); if(!explanation) onExplain(); }} style={{
        flex:1,padding:"8px 10px",borderRadius:9,cursor:"pointer",fontSize:"calc(.68rem * var(--ts, 1))",fontWeight:600,
        border:`1px solid ${open==="how"?tint(C.blue,0x55):C.line}`,
        background:open==="how"?`${tint(C.blue,0x0d)}`:"transparent", color:open==="how"?C.blue:C.dim}}>
        How to do it {open==="how"?"▴":"▾"}
      </button>}
      {onSwap && done===0 && <button onClick={onSwap} style={{
        flex:"1 1 100%",padding:"8px 10px",borderRadius:9,cursor:"pointer",fontSize:"calc(.68rem * var(--ts, 1))",fontWeight:600,
        border:`1px solid ${tint(C.orange,0x45)}`,background:`${tint(C.orange,0x0d)}`,color:C.orange}}>
        Swap exercise / flag discomfort ↔
      </button>}
      {aiOn && <button onClick={onAskCoach} style={{
        flex:"1 1 100%",padding:"8px 10px",borderRadius:9,cursor:"pointer",fontSize:"calc(.68rem * var(--ts, 1))",fontWeight:600,
        border:`1px solid ${tint(C.green,0x45)}`,background:`${tint(C.green,0x0d)}`,color:C.green}}>
        Ask coach about this set →
      </button>}
    </div>}

    {showWhy && open==="why" && (<div className="fade" style={{marginTop:10,fontSize:"calc(.74rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,
      background:C.raised,borderRadius:10,padding:"11px 12px"}}>{ex.why}</div>)}

    {showHow && open==="how" && (<div className="fade" style={{marginTop:10,background:C.raised,borderRadius:10,padding:"12px 13px"}}>
      <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:11}}>
        <a href={videoURL} target="_blank" rel="noopener noreferrer"
          aria-label={`Search YouTube Shorts for ${ex.name}`} style={{
          flex:"1 1 170px",display:"flex",alignItems:"center",justifyContent:"center",minHeight:38,
          padding:"8px 10px",borderRadius:9,border:`1px solid ${tint(C.red,0x66)}`,
          background:tint(C.red,0x12),color:C.red,textDecoration:"none",fontWeight:700,
          fontSize:"calc(.65rem * var(--ts, 1))",letterSpacing:".04em",textAlign:"center"}}>
          WATCH A YOUTUBE SHORT ↗
        </a>
      </div>
      {explaining && !explanation && <div style={{display:"flex",gap:8,alignItems:"center",color:C.faint,fontSize:"calc(.72rem * var(--ts, 1))"}}>
        <Spinner size={13}/> Getting the coaching notes…</div>}
      {explanation && (<div style={{display:"flex",flexDirection:"column",gap:11}}>
        {[["Set up",explanation.setup,C.blue],["The rep",explanation.execution,C.green]].map(([t,body,col])=>(
          <div key={t}>
            <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:col,fontWeight:700,letterSpacing:".08em",marginBottom:3,textTransform:"uppercase"}}>{t}</div>
            <div style={{fontSize:"calc(.73rem * var(--ts, 1))",color:C.dim,lineHeight:1.65}}>{body}</div>
          </div>))}
        <div>
          <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.red,fontWeight:700,letterSpacing:".08em",marginBottom:4,textTransform:"uppercase"}}>Common mistakes</div>
          <div style={{display:"flex",flexDirection:"column",gap:3}}>
            {(explanation.mistakes||[]).map((m,i)=>(
              <div key={i} style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.dim,lineHeight:1.6,display:"flex",gap:7}}>
                <span style={{color:C.red,flexShrink:0}}>✕</span><span>{m}</span></div>))}
          </div>
        </div>
        <div>
          <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.yellow,fontWeight:700,letterSpacing:".08em",marginBottom:3,textTransform:"uppercase"}}>What it should feel like</div>
          <div style={{fontSize:"calc(.73rem * var(--ts, 1))",color:C.dim,lineHeight:1.65}}>{explanation.feel}</div>
        </div>
        {explanation.source==="ai" && <Chip color={C.green} style={{alignSelf:"flex-start"}}>coached for you</Chip>}
      </div>)}
    </div>)}
    </>)}
  </Card>);
}

function WarmupRoutine({session}){
  const [open,setOpen]=useState(false);
  const drills=recommendedWarmups(session), ramps=rampSetsFor(session);
  const first=session?.exercises?.[0];
  if(!drills.length&&!ramps.length) return null;
  return (<Card accent={C.blue} style={{marginBottom:12}}>
    <button onClick={()=>setOpen(v=>!v)} aria-expanded={open} style={{width:"100%",display:"flex",alignItems:"center",
      justifyContent:"space-between",gap:10,padding:0,border:"none",background:"transparent",cursor:"pointer",textAlign:"left"}}>
      <div>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.blue,fontWeight:700,letterSpacing:".08em"}}>MATCHED WARM-UP</div>
        <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.dim,marginTop:4}}>4–6 minutes · dynamic · built for today's movements</div>
      </div>
      <span style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,fontWeight:700}}>{open?"HIDE ▴":"OPEN ▾"}</span>
    </button>
    {open&&<div className="fade" style={{marginTop:13,paddingTop:12,borderTop:`1px solid ${C.lineSoft}`}}>
      <div style={{display:"flex",gap:10,marginBottom:12}}>
        <div style={{width:24,height:24,borderRadius:"50%",background:tint(C.blue,0x20),color:C.blue,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:"calc(.65rem * var(--ts, 1))",fontWeight:700,flexShrink:0}}>1</div>
        <div><div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.text,fontWeight:600}}>Raise your temperature</div>
          <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,lineHeight:1.6,marginTop:2}}>2 minutes of easy bike, rower or brisk walking. Warm, not tired.</div></div>
      </div>
      {drills.map((drill,i)=><div key={drill.id} style={{display:"flex",gap:10,marginBottom:12}}>
        <div style={{width:24,height:24,borderRadius:"50%",background:tint(C.blue,0x20),color:C.blue,
          display:"flex",alignItems:"center",justifyContent:"center",fontSize:"calc(.65rem * var(--ts, 1))",fontWeight:700,flexShrink:0}}>{i+2}</div>
        <div><div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.text,fontWeight:600}}>{drill.name} · {drill.dose}</div>
          <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,lineHeight:1.6,marginTop:2}}>{drill.instruction}</div></div>
      </div>)}
      {!!ramps.length&&<div style={{background:C.raised,borderRadius:10,padding:"10px 11px",marginTop:4}}>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.yellow,fontWeight:700,letterSpacing:".07em",marginBottom:6}}>
          RAMP INTO {first?.name?.toUpperCase()}</div>
        {ramps.map((r,i)=><div key={i} style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.dim,lineHeight:1.7}}>
          {i+1}. {r.weight}kg × {r.reps} · {r.label}</div>)}
        <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,lineHeight:1.5,marginTop:5}}>Warm-up sets are rehearsal and are not logged as working sets.</div>
      </div>}
      <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,lineHeight:1.55,marginTop:10}}>Move smoothly and stay pain-free. Save long static holds for the cool-down.</div>
    </div>}
  </Card>);
}

function StretchRoutine({session,stretches:provided,defaultOpen=false}){
  const [open,setOpen]=useState(defaultOpen);
  const stretches=provided||recommendedStretches(session);
  if(!stretches?.length) return null;
  const seconds=stretches.reduce((n,s)=>n+s.seconds*(s.sides?2:1),0);
  const mins=Math.max(1,Math.ceil(seconds/60));
  return (<Card accent={C.green} style={{marginBottom:14}}>
    <button onClick={()=>setOpen(v=>!v)} aria-expanded={open} style={{width:"100%",display:"flex",alignItems:"center",
      justifyContent:"space-between",gap:10,padding:0,border:"none",background:"transparent",cursor:"pointer",textAlign:"left"}}>
      <div>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.green,fontWeight:700,letterSpacing:".08em"}}>MATCHED COOL-DOWN</div>
        <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.dim,marginTop:4}}>{stretches.length} stretches · about {mins} minutes · matched to today's work</div>
      </div>
      <span style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,fontWeight:700}}>{open?"HIDE ▴":"OPEN ▾"}</span>
    </button>
    {open&&<div className="fade" style={{marginTop:13,paddingTop:12,borderTop:`1px solid ${C.lineSoft}`}}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {stretches.map((stretch,i)=><div key={stretch.id} style={{display:"flex",gap:10}}>
          <div style={{width:26,height:26,borderRadius:"50%",background:tint(C.green,0x20),color:C.green,
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:"calc(.65rem * var(--ts, 1))",fontWeight:700,flexShrink:0}}>{i+1}</div>
          <div>
            <div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.text,fontWeight:600}}>{stretch.name}</div>
            <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.green,marginTop:2}}>{stretch.seconds} seconds{stretch.sides?" each side":""}</div>
            <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,lineHeight:1.6,marginTop:3}}>{stretch.instruction}</div>
            <div style={{fontSize:"calc(.63rem * var(--ts, 1))",color:C.ghost,lineHeight:1.5,marginTop:3}}>Feel: {stretch.feel}</div>
          </div>
        </div>)}
      </div>
      <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,lineHeight:1.55,marginTop:12,paddingTop:10,borderTop:`1px solid ${C.lineSoft}`}}>
        Breathe normally and use gentle tension — no bouncing. Stop any stretch that causes sharp pain, tingling or numbness.</div>
    </div>}
  </Card>);
}

function DiscomfortNotice({flags,onResolve,compact=false}){
  const active=(flags||[]).filter(x=>x?.active!==false && DISCOMFORT_BY_KEY[x.area]);
  if(!active.length) return null;
  return (<Card accent={C.yellow} style={{marginBottom:12,padding:compact?12:14}}>
    <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.yellow,fontWeight:700,letterSpacing:".08em",marginBottom:5}}>
      ACTIVE DISCOMFORT WORKAROUND{active.length===1?"":"S"}</div>
    <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.dim,lineHeight:1.6,marginBottom:9}}>
      The next session avoids exercises tagged for {active.map(x=>DISCOMFORT_BY_KEY[x.area].label.toLowerCase()).join(", ")}.
      {active.some(x=>x.area==="other") && " ‘Other area’ is carried to the coach but cannot safely filter exercises by itself."}
    </div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      {active.map(flag=><button key={flag.id||flag.area} onClick={()=>onResolve?.(flag.area)} style={{
        border:`1px solid ${tint(C.green,0x40)}`,background:tint(C.green,0x0d),color:C.green,
        borderRadius:999,padding:"6px 9px",fontSize:"calc(.61rem * var(--ts, 1))",fontWeight:700,cursor:"pointer"}}>
        {DISCOMFORT_BY_KEY[flag.area].label}: MARK RESOLVED</button>)}
    </div>
    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,lineHeight:1.5,marginTop:9}}>
      This is a training workaround, not a diagnosis. Stop sharp or worsening pain and seek an appropriately qualified health professional.</div>
  </Card>);
}

function SupersetGuide({session,cue,onDisable}){
  const pairs=supersetPairs(session);
  if(!pairs.length) return null;
  return (<Card accent={C.purple} style={{marginBottom:12,padding:13}}>
    <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.purple,fontWeight:700,letterSpacing:".08em",marginBottom:5}}>
      ACCESSORY SUPERSET{pairs.length===1?"":"S"}</div>
    <div style={{fontSize:"calc(.67rem * var(--ts, 1))",color:C.faint,lineHeight:1.55,marginBottom:8}}>
      Alternate the two exercises. No rest after the first; take the normal timer after the second. If either station is busy, do them as normal straight sets.</div>
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {pairs.map(pair=><div key={pair.group} style={{fontSize:"calc(.71rem * var(--ts, 1))",color:C.dim,lineHeight:1.5}}>
        <strong style={{color:C.purple}}>{pair.group}1</strong> {pair.items[0].ex.name}
        <span style={{color:C.ghost}}> → </span>
        <strong style={{color:C.purple}}>{pair.group}2</strong> {pair.items[1].ex.name}
      </div>)}
    </div>
    {cue && <div className="fade" style={{marginTop:9,padding:"8px 9px",borderRadius:9,
      background:tint(C.purple,0x12),border:`1px solid ${tint(C.purple,0x45)}`,
      fontSize:"calc(.68rem * var(--ts, 1))",color:C.purple,fontWeight:700}}>
      NEXT: {cue.group}2 {cue.name.toUpperCase()} · GO STRAIGHT THERE</div>}
    <button onClick={onDisable} style={{marginTop:8,padding:0,border:"none",background:"transparent",color:C.ghost,
      fontSize:"calc(.61rem * var(--ts, 1))",textDecoration:"underline",cursor:"pointer"}}>Equipment busy? Use straight sets today</button>
  </Card>);
}

function WakeLockNotice({status,onRetry}){
  if(!["unsupported","denied","released"].includes(status)) return null;
  const unsupported=status==="unsupported";
  return (<Card accent={C.yellow} style={{marginBottom:12,padding:12}}>
    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.yellow,fontWeight:700,letterSpacing:".07em",marginBottom:4}}>
      SCREEN-AWAKE LOCK {unsupported?"NOT AVAILABLE":"NEEDS ATTENTION"}</div>
    <div style={{fontSize:"calc(.67rem * var(--ts, 1))",color:C.faint,lineHeight:1.55}}>
      {unsupported
        ? "This browser does not expose the screen wake-lock feature. On iPhone, update iOS and run SnapFit from its Home Screen icon; otherwise set Auto-Lock to Never for the workout."
        : "The phone released or rejected the screen-awake request. Low Power Mode can cause this on iPhone. Turn it off, then tap Try again."}
    </div>
    {!unsupported && <Btn kind="solid" size="sm" onClick={onRetry} style={{marginTop:9}}>TRY SCREEN LOCK AGAIN</Btn>}
  </Card>);
}

function TodayView({state, session, setSession, generating, onGenerate, onFinish, coach, aiOn, onViewHistory,
                    rest, startRest, skipRest, apiKey, setTravel, clearTravel, forgetTravel,
                    bonusPending=false, onCancelBonus, onRecordDiscomfort, onResolveDiscomfort,
                    wakeStatus="off", onRetryWake, onRegenerate, onRetryAI, regenerationReason=""}){
  const [picker,setPicker]   = useState(null);   // {exIdx,setIdx}
  const [explain,setExplain] = useState({});     // exId -> explanation
  const [explaining,setExplaining] = useState({});
  const [confirmEnd,setConfirmEnd] = useState(false);
  const [venue,setVenue]     = useState(false);  // away-gym sheet open
  const [setCoach,setSetCoach] = useState(null); // {exIdx,setIdx}
  const [swap,setSwap] = useState(null);         // {exIdx}
  const [supersetCue,setSupersetCue] = useState(null);
  const [regen,setRegen] = useState(false);
  const [regenNote,setRegenNote] = useState("");
  const prog = blockProgress(state);

  useEffect(()=>setSupersetCue(null),[session?.id]);

  const gymSheet = venue ? (<GymSheet state={state} coach={coach} apiKey={apiKey}
    onApply={t=>{ setTravel(t); setVenue(false); }}
    onClear={()=>{ clearTravel(); setVenue(false); }}
    onForget={()=>{ forgetTravel(); setVenue(false); }}
    onClose={()=>setVenue(false)}/>) : null;

  async function doExplain(exId){
    if(explain[exId] || explaining[exId]) return;
    setExplaining(e=>({...e,[exId]:true}));
    try{ const r = await coach.explain(exId); setExplain(e=>({...e,[exId]:r})); }
    finally{ setExplaining(e=>({...e,[exId]:false})); }
  }

  function saveSet(exIdx, setIdx, data){
    setSession(s=>{
      const exs = s.exercises.map((e,i)=>{
        if(i!==exIdx) return e;
        const log = [...(e.log||Array(e.sets).fill(null))];
        log[setIdx] = data;
        return {...e, log};
      });
      return {...s, exercises:exs};
    });
    const ex = session.exercises[exIdx];
    const doneAfter = (ex.log||[]).filter((l,i)=>i!==setIdx && l && l.reps!=null).length + 1;
    const pair=ex.superset ? supersetPairs(session).find(p=>p.group===ex.superset.group) : null;
    if(pair && ex.superset.position===1){
      const partner=pair.items[1].ex;
      setSupersetCue({group:ex.superset.group,name:partner.name,round:doneAfter});
      return;
    }
    if(pair && ex.superset.position===2){
      setSupersetCue(null);
      if(doneAfter < ex.sets){
        const first=pair.items[0].ex;
        startRest({exName:first.name,seconds:Math.max(...pair.items.map(x=>x.ex.rest||60)),
          label:`Superset ${ex.superset.group} · round ${doneAfter+1}`});
      } else {
        const lastIdx=Math.max(...pair.items.map(x=>x.index));
        const next=session.exercises[lastIdx+1];
        if(next) startRest({exName:next.name,seconds:Math.max(...pair.items.map(x=>x.ex.rest||60)),label:"Next exercise"});
      }
      return;
    }
    setSupersetCue(null);
    if(doneAfter < ex.sets){
      startRest({exName:ex.name, seconds:ex.rest, label:`Set ${doneAfter+1} of ${ex.sets}`});
    } else {
      const next = session.exercises[exIdx+1];
      if(next) startRest({exName:next.name, seconds:Math.round(ex.rest*1.1), label:"Next exercise"});
    }
  }

  /* The weight actually used on the most recent logged set of an exercise, so
     set 2 offers what you really lifted rather than what was planned. */
  function lastLoggedWeight(ex){
    const logged = (ex.log||[]).filter(l=>l && l.reps!=null);
    return logged.length ? logged[logged.length-1].weight : null;
  }

  function applyExerciseSwap(exIdx,replacement,reason,discomfortArea=null){
    const current=session.exercises[exIdx];
    const ww=workingWeight(replacement,state,prog.phase);
    const loadMult=session.readiness?.loadMult||1;
    const reasonMeta=SWAP_REASON_BY_KEY[reason]||SWAP_REASON_BY_KEY.preference;
    const newWeight=availableWeight(replacement,capForVenue(replacement,ww.weight*loadMult,state),state);
    const newPlateLoad=plateHintForExercise({...replacement,weight:newWeight},state);
    const event={id:uid(),at:new Date().toISOString(),fromExId:current.exId,fromName:current.name,
      toExId:replacement.id,toName:replacement.name,reason:reasonMeta.key,discomfortArea};
    setSession(s=>({...s,
      swaps:[...(s.swaps||[]),event],
      exercises:s.exercises.map((old,i)=>i!==exIdx?old:{
        ...old, exId:replacement.id, name:replacement.name,
        stations:stationsForExercise(replacement,state), pattern:replacement.pattern,
        primary:replacement.primary, compound:replacement.compound,kind:replacement.kind,
        weight:newWeight, plateLoad:newPlateLoad, inc:exerciseIncrement(replacement,state),
        tempo:tempoPrescription(replacement,prog.phase),
        why:replacement.why,
        decisionLabel:`${reasonMeta.label} swap · ${ww.decision?.label||"same plan, different tool"}`,
        decisionColor:C.orange, log:Array(old.sets).fill(null),
        swapInfo:{fromExId:current.exId,fromName:current.name,reason:reasonMeta.key,discomfortArea},
      })}));
    setSwap(null);
  }

  const loggedSets = session ? session.exercises.reduce((n,e)=>n+(e.log||[]).filter(l=>l&&l.reps!=null).length,0) : 0;
  const totalSets  = session ? session.exercises.reduce((n,e)=>n+e.sets,0) : 0;

  /* ── no block yet ─────────────────────────────────────────────────────── */
  if(!state.block) return (<Empty icon="🧭" title="No plan yet"
    body="Set a goal and the coach will build you a training block to work through."/>);

  /* ── block finished ───────────────────────────────────────────────────── */
  if(prog?.complete && !session) return (<div className="fade" style={{paddingTop:10}}>
    <SectionTitle sub={state.block.name}>BLOCK COMPLETE</SectionTitle>
    <Card accent={C.green} style={{marginBottom:14}}>
      <div style={{fontSize:"calc(2rem * var(--ts, 1))",marginBottom:8}}>🏁</div>
      <div style={{fontSize:"calc(.88rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:8}}>
        You finished all {prog.total} weeks.
      </div>
      <div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.faint,lineHeight:1.7}}>
        That's {prog.done} sessions. Time to build the next block — the coach will use everything
        you've logged to set the starting point, so it picks up where this one left off rather than starting over.
      </div>
    </Card>
    <Btn size="lg" full onClick={onGenerate}>BUILD THE NEXT BLOCK →</Btn>
  </div>);

  /* ── generating ───────────────────────────────────────────────────────── */
  if(generating) return (<div style={{paddingTop:80,textAlign:"center"}}>
    <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",gap:14}}>
      <Spinner size={28}/>
      <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.2rem",color:C.dim,letterSpacing:".08em"}}>
        {bonusPending
          ? (aiOn ? "YOUR COACH IS WRITING AN EXTRA SESSION" : "BUILDING EXTRA SESSION")
          : (aiOn ? "YOUR COACH IS WRITING TODAY'S SESSION" : "BUILDING TODAY'S SESSION")}
      </div>
      <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.ghost,maxWidth:260,lineHeight:1.6}}>
        {bonusPending
          ? "Using the next workout and current phase from your existing block."
          : (aiOn ? "Reading your last few sessions and today's check-in." : "Working from your block targets and logged weights.")}
      </div>
    </div>
  </div>);

  /* ── check-in gate ────────────────────────────────────────────────────── */
  /* The venue goes here, above the check-in, because it has to be settled
     BEFORE the session is built — it decides which exercises exist. */
  if(!session) return (<>
    <VenueRow state={state} onOpen={()=>setVenue(true)}/>
    <DiscomfortNotice flags={activeDiscomforts(state)} onResolve={onResolveDiscomfort} compact/>
    <CheckIn bonus={bonusPending} onCancel={onCancelBonus} defaultMinutes={state.profile.sessionMinutes}
      regenerationReason={regenerationReason}
      onSubmit={ci=>onGenerate(ci)} onSkip={()=>onGenerate(null)}/>
    {gymSheet}
  </>);

  /* ── the session ──────────────────────────────────────────────────────── */
  const readiness = session.readiness;
  const briefOpen = !session.briefCollapsed;
  return (<div className="fade" style={{paddingTop:6,paddingBottom:20}}>

    {/* header */}
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:6,flexWrap:"wrap"}}>
        {session.bonus && <Chip color={C.green}>BONUS SESSION</Chip>}
        <Chip color={C.red}>WEEK {session.week} / {prog.total}</Chip>
        <Chip color={C.purple}>{session.phaseName}</Chip>
        {readiness && <Chip color={readiness.color}>{readiness.label}</Chip>}
        {session.venue && <Chip color={C.orange}>📍 {session.venue}</Chip>}
        {session.source==="ai" ? <Chip color={C.green}>🤖 coached</Chip> : <Chip color={C.faint}>built-in plan</Chip>}
      </div>
      <h1 style={{fontSize:"2.2rem",color:C.text,lineHeight:1,marginBottom:6}}>{session.dayName.toUpperCase()}</h1>
      <button onClick={()=>setRegen(true)} style={{border:"none",background:"transparent",padding:0,
        color:C.orange,fontSize:"calc(.62rem * var(--ts, 1))",fontWeight:700,textDecoration:"underline",cursor:"pointer"}}>
        Regenerate this session
      </button>
    </div>

    <DiscomfortNotice flags={activeDiscomforts(state)} onResolve={onResolveDiscomfort} compact/>
    <WakeLockNotice status={wakeStatus} onRetry={onRetryWake}/>

    {aiOn && session.source!=="ai" && <Card accent={C.yellow} style={{marginBottom:12,padding:14}}>
      <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.yellow,fontWeight:800,letterSpacing:".08em",marginBottom:5}}>
        THIS SESSION IS NOT AI-GENERATED
      </div>
      <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,lineHeight:1.62,marginBottom:10}}>
        The coach request failed, so Snap used its safe built-in session. It still follows your current block,
        logged working weights, readiness and restrictions, but it does not contain an AI interpretation of your journey.
      </div>
      <Btn kind="solid" size="sm" onClick={()=>onRetryAI?.(session)} disabled={generating||loggedSets>0}>
        RETRY AI GENERATION
      </Btn>
      {loggedSets>0 && <div style={{fontSize:"calc(.61rem * var(--ts, 1))",color:C.ghost,lineHeight:1.5,marginTop:7}}>
        Retry is locked after logging begins so no completed sets can be discarded.
      </div>}
    </Card>}

    {/* The brief — what today is for and what's being asked of you. */}
    {session.brief && (<Card accent={C.blue} style={{marginBottom:12,padding:briefOpen?16:"10px 13px"}}>
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:8}}>
        <span style={{fontSize:"calc(.85rem * var(--ts, 1))"}}>🎧</span>
        <span style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.blue,fontWeight:700,letterSpacing:".08em"}}>TODAY'S BRIEF</span>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:7}}>
          {session.source==="ai" && briefOpen && <Chip color={C.green}>coached</Chip>}
          <button onClick={()=>setSession(s=>({...s,briefCollapsed:briefOpen}))}
            aria-expanded={briefOpen} aria-label={`${briefOpen?"Fold":"Open"} today's brief`} style={{border:"none",background:"transparent",
            color:C.blue,fontSize:"calc(.56rem * var(--ts, 1))",fontWeight:800,letterSpacing:".06em",cursor:"pointer",padding:"5px 2px"}}>
            {briefOpen?"FOLD":"OPEN"}</button>
        </div>
      </div>
      {briefOpen && <Markdown text={session.brief} style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.dim}}/>}
      {/* The one-line cue belongs with the brief, not in a card of its own —
          three stacked notes before the first exercise is too much to read. */}
      {session.focusTip && briefOpen && (<div style={{display:"flex",gap:9,alignItems:"flex-start",marginTop:11,
        paddingTop:11,borderTop:`1px solid ${C.lineSoft}`}}>
        <span style={{fontSize:"calc(.85rem * var(--ts, 1))",flexShrink:0}}>💡</span>
        <div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.yellow,lineHeight:1.55}}>{session.focusTip}</div>
      </div>)}
    </Card>)}

    {session.adaptationNote && (<Card accent={readiness?.color||C.blue} style={{marginBottom:12,padding:13}}>
      <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:readiness?.color||C.blue,fontWeight:700,letterSpacing:".08em",marginBottom:4}}>ADJUSTED FOR TODAY</div>
      <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.dim,lineHeight:1.6}}>{session.adaptationNote}</div>
    </Card>)}

    {/* If there's no brief to fold it into, the cue still gets its own card. */}
    {session.focusTip && (!session.brief || !briefOpen) && (<div style={{background:`${tint(C.yellow,0x0d)}`,
      border:`1px solid ${tint(C.yellow,0x30)}`,borderRadius:11,
      padding:"10px 13px",marginBottom:14,display:"flex",gap:9,alignItems:"flex-start"}}>
      <span style={{fontSize:"calc(.85rem * var(--ts, 1))",flexShrink:0}}>💡</span>
      <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.yellow,lineHeight:1.55}}>{session.focusTip}</div>
    </div>)}

    <WarmupRoutine session={session}/>
    <SupersetGuide session={session} cue={supersetCue} onDisable={()=>{
      setSupersetCue(null);
      setSession(s=>({...s,exercises:s.exercises.map(ex=>{ const {superset,...rest}=ex; return rest; })}));
    }}/>

    {/* progress */}
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
        <span style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint}}>{loggedSets} of {totalSets} sets logged</span>
        <span style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint}}>{Math.round((loggedSets/totalSets)*100)||0}%</span>
      </div>
      <div style={{height:4,background:C.lineSoft,borderRadius:2,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${(loggedSets/totalSets)*100||0}%`,background:C.red,
          borderRadius:2,transition:"width .3s"}}/>
      </div>
    </div>

    {session.exercises.map((ex,i)=>(
      <ExerciseCard key={ex.exId+i} ex={ex} idx={i} logs={ex.log||Array(ex.sets).fill(null)}
        onLogSet={si=>{ cues.preload(); setPicker({exIdx:i,setIdx:si}); }}
        onExplain={()=>doExplain(ex.exId)}
        explanation={explain[ex.exId]} explaining={explaining[ex.exId]} aiOn={aiOn}
        showWhy={state.uiPrefs?.showExerciseWhy??true}
        showHow={state.uiPrefs?.showExerciseHow??true}
        onSwap={()=>setSwap({exIdx:i,reason:null,area:null})}
        onViewHistory={()=>onViewHistory?.(ex.exId)}
        onAskCoach={()=>setSetCoach({exIdx:i,setIdx:Math.min((ex.log||[]).filter(x=>x&&x.reps!=null).length,ex.sets-1)})}/>
    ))}

    <StretchRoutine session={session}/>

    <div style={{display:"flex",gap:8,marginTop:16}}>
      <Btn kind="ghost" size="lg" onClick={()=>setConfirmEnd(true)} style={{flex:1}}>ABANDON</Btn>
      <Btn kind={loggedSets?"green":"ghost"} size="lg" onClick={()=>onFinish(session)}
        disabled={!loggedSets} style={{flex:2}}>FINISH SESSION ✓</Btn>
    </div>
    {!loggedSets && <div style={{textAlign:"center",fontSize:"calc(.64rem * var(--ts, 1))",color:C.ghost,marginTop:8}}>
      Log at least one set to finish.</div>}

    {/* The rest bar is fixed above the nav — keep it off the buttons. */}
    {rest && <div style={{height:74}}/>}

    {picker && (()=>{
      const ex = session.exercises[picker.exIdx];
      return <RepPicker exercise={ex} setIndex={picker.setIdx}
        initial={(ex.log||[])[picker.setIdx]}
        lastWeight={lastLoggedWeight(ex)}
        onSave={d=>saveSet(picker.exIdx,picker.setIdx,d)}
        onClose={()=>setPicker(null)}/>;
    })()}

    {setCoach && (()=>{
      const ex=session.exercises[setCoach.exIdx];
      return <SetCoachSheet exercise={ex} logs={ex.log||[]} setIndex={setCoach.setIdx}
        coach={coach} onClose={()=>setSetCoach(null)}/>;
    })()}

    {swap && (()=>{
      const current=session.exercises[swap.exIdx];
      const ready=!!swap.reason && (swap.reason!=="discomfort"||!!swap.area);
      const optionState=swap.reason==="discomfort"&&swap.area ? stateWithDiscomfort(state,swap.area) : state;
      const options=ready ? exerciseSwapOptions(current,optionState,session) : [];
      return <Sheet title="SWAP EXERCISE" sub={`Replace ${current.name} without changing the plan`} onClose={()=>setSwap(null)}>
        <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.faint,lineHeight:1.65,marginBottom:12}}>
          Tell the coach why. Sets, reps, rest and today's phase stay the same; the replacement load comes from its own history.</div>

        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".08em",marginBottom:7}}>WHY ARE YOU SWAPPING?</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}}>
          {SWAP_REASONS.map(reason=><button key={reason.key} onClick={()=>setSwap(s=>({...s,reason:reason.key,area:reason.key==="discomfort"?s.area:null}))} style={{
            minHeight:52,padding:"7px 5px",borderRadius:9,cursor:"pointer",fontSize:"calc(.62rem * var(--ts, 1))",fontWeight:700,lineHeight:1.3,
            border:`1px solid ${swap.reason===reason.key?tint(reason.key==="discomfort"?C.red:C.orange,0x70):C.line}`,
            background:swap.reason===reason.key?tint(reason.key==="discomfort"?C.red:C.orange,0x12):C.raised,
            color:swap.reason===reason.key?(reason.key==="discomfort"?C.red:C.orange):C.dim}}>{reason.label}</button>)}
        </div>

        {swap.reason==="discomfort" && <div className="fade" style={{marginBottom:13}}>
          <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.red,fontWeight:700,letterSpacing:".08em",marginBottom:7}}>WHERE DO YOU FEEL IT?</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {DISCOMFORT_AREAS.map(area=><button key={area.key} onClick={()=>{
              setSwap(s=>({...s,area:area.key}));
              onRecordDiscomfort?.({area:area.key,exerciseId:current.exId,exerciseName:current.name});
            }} style={{padding:"7px 9px",borderRadius:999,cursor:"pointer",fontSize:"calc(.62rem * var(--ts, 1))",fontWeight:700,
              border:`1px solid ${swap.area===area.key?tint(C.red,0x70):C.line}`,
              background:swap.area===area.key?tint(C.red,0x12):C.raised,color:swap.area===area.key?C.red:C.dim}}>{area.label}</button>)}
          </div>
          {swap.area && <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.yellow,lineHeight:1.55,marginTop:9}}>
            Flag saved. Future suggestions will work around this until you mark it resolved. Sharp, worsening or joint-centred pain means stop — this app cannot diagnose it.</div>}
        </div>}

        {ready && <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".08em",marginBottom:7}}>
          {options.length?"SAFE ALTERNATIVES":"NO SUITABLE ALTERNATIVE"}</div>}
        {ready && options.length===0 && <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.yellow,lineHeight:1.65,
          background:tint(C.yellow,0x0d),border:`1px solid ${tint(C.yellow,0x35)}`,borderRadius:10,padding:"10px 11px"}}>
          Nothing in the available equipment safely preserves this movement pattern. Skip it today rather than forcing a bad substitution.</div>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {options.map(alt=><button key={alt.id} onClick={()=>applyExerciseSwap(swap.exIdx,alt,swap.reason,swap.area)} style={{
            background:C.card,border:`1px solid ${C.line}`,borderRadius:12,padding:"12px 13px",cursor:"pointer",textAlign:"left"}}>
            <div style={{display:"flex",justifyContent:"space-between",gap:10,alignItems:"center"}}>
              <div>
                <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:700}}>{alt.name}</div>
                <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,marginTop:4}}>
                  {stationsForExercise(alt,state).map(s=>`#${s}`).join(" · ")} · {alt.primary}</div>
              </div>
              <span style={{color:C.orange,fontSize:"calc(.75rem * var(--ts, 1))"}}>USE →</span>
            </div>
          </button>)}
        </div>
      </Sheet>;
    })()}

    {confirmEnd && <Confirm message="Abandon this session?" danger confirmLabel="Abandon"
      sub="Nothing logged will be saved and your weights won't move."
      onCancel={()=>setConfirmEnd(false)}
      onConfirm={()=>{ setConfirmEnd(false); skipRest(); setSession(null); }}/>}

    {regen && <Sheet title="Regenerate today's session" sub={loggedSets
      ? `${loggedSets} logged set${loggedSets===1?"":"s"} will be discarded. The plan itself will not advance.`
      : "Tell the coach what was wrong with this draft. The plan itself will not advance."}
      onClose={()=>setRegen(false)}>
      <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:12}}>
        {["Equipment is unavailable","Too hard for today","Too easy for today","Not enough time","Pain or discomfort","I want different exercises"].map(reason=><button
          key={reason} onClick={()=>setRegenNote(reason)} style={{padding:"10px 11px",borderRadius:10,textAlign:"left",cursor:"pointer",
          border:`1px solid ${regenNote===reason?C.orange:C.line}`,background:regenNote===reason?tint(C.orange,0x12):C.raised,
          color:regenNote===reason?C.orange:C.dim,fontWeight:regenNote===reason?700:500}}>{reason}</button>)}
      </div>
      <Field label="More detail" hint="Optional, but useful when equipment or discomfort is the reason.">
        <TextArea value={regenNote} onChange={e=>setRegenNote(e.target.value.slice(0,300))}
          placeholder="What should the next draft do differently?"/>
      </Field>
      <Btn kind="solid" size="lg" full disabled={!regenNote.trim()} onClick={()=>{
        const reason=regenNote.trim(); setRegen(false); setRegenNote(""); skipRest(); onRegenerate?.(reason);
      }}>REBUILD SESSION</Btn>
    </Sheet>}
  </div>);
}
