  </div>);
}

function LogView({state, setState, onRestore, apiKey, initialExerciseId, onInitialExerciseOpened}){
  const [detail,setDetail] = useState(null);   // exId
  const [session,setSession] = useState(null);
  const [tab,setTab] = useState("sessions");
  const [msg,setMsg] = useState("");
  const [err,setErr] = useState("");
  const [pending,setPending] = useState(null);  // parsed JSON awaiting confirmation
  const [moveWeek,setMoveWeek] = useState(null);
  const fileRef = useRef(null);
  const jsonRef = useRef(null);

  useEffect(()=>setMoveWeek(session?planWeekForSession(session):null),[session?.id]);
  useEffect(()=>{
    if(!initialExerciseId) return;
    setTab("exercises");
    setDetail(initialExerciseId);
    onInitialExerciseOpened?.();
  },[initialExerciseId]);

  const exIds = Object.keys(state.exerciseHistory||{})
    .filter(id=>(state.exerciseHistory[id]||[]).length)
    .sort((a,b)=>(EX_NAME[a]||a).localeCompare(EX_NAME[b]||b));

  function readFile(e, handler){
    const f = e.target.files?.[0];
    e.target.value = "";
    if(!f) return;
    setMsg(""); setErr("");
    const r = new FileReader();
    r.onerror = ()=>setErr("Couldn't read that file off disk.");
    r.onload = ev => handler(String(ev.target.result));
    r.readAsText(f);
  }

  function onCSV(e){
    readFile(e, text=>{
      try{
        const {hist,weights,imported,skipped} = importCSV(text, state);
        setState(s=>({...s, exerciseHistory:hist, weights:{...s.weights, ...weights}}));
        setMsg(`Imported ${imported} rows${skipped?`, skipped ${skipped}`:""}. Your working weights have been updated to match.`);
      }catch(e2){ setErr(`Import failed: ${e2.message}`); }
    });
  }

  /* JSON is a full restore, so nothing happens until you've seen what's in the
     file and confirmed. Validation failures leave existing data untouched. */
  function onJSON(e){
    readFile(e, text=>{
      try{ setPending(inspectJSON(text)); }
      catch(e2){ setErr(e2.message); }
    });
  }

  return (<div className="fade" style={{paddingTop:8,paddingBottom:20}}>
    <SectionTitle sub={`${state.sessions.length} sessions · ${exIds.length} exercises tracked`}>LOG</SectionTitle>

    <div style={{display:"flex",gap:6,marginBottom:14}}>
      {[["sessions","Sessions"],["exercises","Exercises"],["equipment","Loads"],["data","Data"]].map(([k,l])=>(
        <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"9px 8px",borderRadius:10,cursor:"pointer",
          border:`1px solid ${tab===k?tint(C.red,0x55):C.line}`, background:tab===k?`${tint(C.red,0x0f)}`:C.raised,
          color:tab===k?C.text:C.dim, fontSize:"calc(.72rem * var(--ts, 1))", fontWeight:tab===k?700:400}}>{l}</button>))}
    </div>

    {tab==="sessions" && (state.sessions.length===0
      ? <Empty icon="📋" title="No sessions yet" body="Finish a session and it'll show up here with everything you logged."/>
      : <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {state.sessions.map(s=>{
            const sets = s.exercises.reduce((n,e)=>n+(e.log||[]).filter(l=>l&&l.reps!=null).length,0);
            const vol  = s.exercises.reduce((n,e)=>n+(e.log||[]).filter(l=>l&&l.reps!=null)
                          .reduce((m,l)=>m+l.reps*l.weight,0),0);
            return (<Card key={s.id} onClick={()=>setSession(s)} style={{padding:"13px 14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                <div style={{minWidth:0}}>
                  <div style={{fontSize:"calc(.85rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:3}}>{s.dayName}</div>
                  <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                    <Chip color={C.faint}>{s.date}</Chip>
                    <Chip color={C.purple}>wk {planWeekForSession(s)}</Chip>
                    {s.planWeek!=null && Number(s.planWeek)!==Number(s.week) && <Chip color={C.orange}>MOVED</Chip>}
                    {s.bonus && <Chip color={C.green}>BONUS</Chip>}
                    {!!s.swaps?.length && <Chip color={C.orange}>{s.swaps.length} SWAP{s.swaps.length===1?"":"S"}</Chip>}
                    {s.readiness && <Chip color={s.readiness.color}>{s.readiness.label}</Chip>}
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.3rem",color:C.red,lineHeight:1}}>
                    {(vol/1000).toFixed(1)}t</div>
                  <div style={{fontSize:"calc(.55rem * var(--ts, 1))",color:C.ghost}}>{sets} SETS</div>
                </div>
              </div>
            </Card>);
          })}
        </div>)}

    {tab==="exercises" && (exIds.length===0
      ? <Empty icon="🏋️" title="Nothing tracked yet" body="Log some sets and each exercise builds its own history here."/>
      : <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {exIds.map(id=>{
            const h = state.exerciseHistory[id];
            const last = h[h.length-1], first = h[0];
            const delta = h.length>1 ? Math.round((last.weight-first.weight)*10)/10 : 0;
            return (<Card key={id} onClick={()=>setDetail(id)} style={{padding:"12px 14px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                <div style={{minWidth:0,flex:1}}>
                  <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:600,overflow:"hidden",
                    textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{EX_NAME[id]||id}</div>
                  <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,marginTop:2}}>{h.length} sessions · now {last.weight}kg</div>
                </div>
                {delta!==0 && <Chip color={delta>0?C.green:C.orange}>{delta>0?"+":""}{delta}kg</Chip>}
              </div>
            </Card>);
          })}
        </div>)}

    {tab==="equipment" && <EquipmentLoadsView state={state} setState={setState}/>}

    {tab==="data" && (<div>
      <Card style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:6}}>Coming from v1?</div>
        <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,marginBottom:12}}>
          Export your history from the old app and import the CSV here. Same format — your exercise
          history and working weights come straight across, so the coach picks up where you left off
          instead of starting you from scratch.
        </div>
        <Btn kind="solid" size="md" full onClick={()=>fileRef.current?.click()}>IMPORT CSV</Btn>
        <input ref={fileRef} type="file" accept=".csv,text/csv" onChange={onCSV} style={{display:"none"}}/>
      </Card>

      <Card style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:6}}>Backup and restore</div>
        <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,marginBottom:12}}>
          A JSON backup holds everything — goal, plan, history, settings and your API key.
          The key is stored in the file as plain text, so keep the backup private. Restoring one
          replaces what's on this device, and you'll be asked to confirm first.
        </div>
        <div style={{display:"flex",gap:8}}>
          <Btn kind="solid" size="md" full onClick={()=>exportJSON(state,apiKey)}>EXPORT JSON</Btn>
          <Btn kind="solid" size="md" full onClick={()=>jsonRef.current?.click()}>RESTORE JSON</Btn>
        </div>
        <input ref={jsonRef} type="file" accept=".json,application/json" onChange={onJSON} style={{display:"none"}}/>
      </Card>

      <Card style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:6}}>Spreadsheet export</div>
        <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,marginBottom:12}}>
          Every logged set as CSV, in the same shape v1 used.
        </div>
        <Btn kind="solid" size="md" full onClick={()=>exportCSV(state)}>EXPORT CSV</Btn>
      </Card>

      {msg && <Card accent={C.green} style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.dim,lineHeight:1.6}}>{msg}</div></Card>}
      {err && <Card accent={C.red} style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.red,lineHeight:1.6}}>{err}</div>
        <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.ghost,lineHeight:1.6,marginTop:6}}>
          Nothing on this device has been changed.</div></Card>}
    </div>)}

    {pending && (<Sheet title="Restore this backup?" sub="Everything currently on this device will be replaced."
      onClose={()=>setPending(null)}>
      <Card style={{marginBottom:14}}>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.blue,fontWeight:700,letterSpacing:".08em",marginBottom:8}}>WHAT'S IN THE FILE</div>
        {[["Goal", pending.summary.goal],
          ["Block", pending.summary.block],
          ["Sessions", String(pending.summary.sessions)],
          ["Exercises tracked", String(pending.summary.exercises)],
          ["API key", pending.summary.apiKey],
          ["Date range", pending.summary.from ? `${pending.summary.from} → ${pending.summary.to}` : "no dated sessions"],
        ].map(([k,v])=>(
          <div key={k} style={{display:"flex",justifyContent:"space-between",gap:12,padding:"6px 0",
            borderBottom:`1px solid ${C.lineSoft}`}}>
            <span style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.faint}}>{k}</span>
            <span style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.text,fontWeight:600,textAlign:"right"}}>{v}</span>
          </div>))}
      </Card>
      <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,marginBottom:16}}>
        Your current {state.sessions.length} session{state.sessions.length===1?"":"s"} and everything
        else on this device will be gone. If you haven't exported a backup of what's here now, cancel
        and do that first — this can't be undone.
      </div>
      <div style={{display:"flex",gap:8}}>
        <Btn kind="ghost" size="lg" onClick={()=>setPending(null)} full>Cancel</Btn>
        <Btn kind="danger" size="lg" full onClick={()=>{
          const s = pending.state;
          setPending(null);
          onRestore(s,pending.apiKey);
          setMsg(`Restored ${(s.sessions||[]).length} sessions, ${Object.keys(s.exerciseHistory||{}).length} exercises${pending.apiKey?" and the API key":""}.`);
        }}>Replace everything</Btn>
      </div>
    </Sheet>)}

    {detail && (()=>{
      const h = (state.exerciseHistory[detail]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
      const ex = EX_BY_ID[detail];
      return (<Sheet title={EX_NAME[detail]||detail} sub={`${h.length} sessions tracked`} onClose={()=>setDetail(null)}>
        {h.length>=2 && (<div style={{marginBottom:16}}>
          <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".08em",marginBottom:8}}>WEIGHT OVER TIME</div>
          <Sparkline points={h.map(x=>({v:x.weight}))} color={C.red} height={56}/>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,marginTop:5}}>
            <span>{h[0].weight}kg</span><span>{h[h.length-1].weight}kg</span>
          </div>
        </div>)}
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".08em",marginBottom:8}}>EVERY SESSION</div>
        <div style={{display:"flex",flexDirection:"column",gap:1}}>
          {h.slice().reverse().map((e,i,arr)=>{
            const prev = arr[i+1];
            const up = prev && e.weight>prev.weight, dn = prev && e.weight<prev.weight;
            return (<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",
              borderBottom:`1px solid ${C.lineSoft}`}}>
              <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,width:80,flexShrink:0}}>{e.date}</div>
              <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:up?C.green:dn?C.orange:C.text,fontWeight:600,width:66}}>
                {e.weight}kg{up?" ↑":dn?" ↓":""}</div>
              <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.dim,flex:1}}>
                {e.setsLogged}×{e.avgReps!=null?e.avgReps.toFixed(1):"?"}
                <span style={{color:C.ghost}}> / {e.targetReps}</span></div>
            </div>);
          })}
        </div>
        {ex && (<div style={{marginTop:16,fontSize:"calc(.74rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,
          background:C.card,borderRadius:12,padding:14}}>{ex.why}</div>)}
      </Sheet>);
    })()}

    {session && (<Sheet title={session.dayName} sub={`${session.date} · plan week ${planWeekForSession(session)} · ${session.phaseName}`}
      onClose={()=>setSession(null)}>
      <Card accent={session.planWeek!=null&&Number(session.planWeek)!==Number(session.week)?C.orange:C.blue} style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.blue,fontWeight:700,letterSpacing:".08em",marginBottom:5}}>
          PLAN-WEEK PLACEMENT
        </div>
        <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,lineHeight:1.55,marginBottom:9}}>
          Correct which week this session belongs to without changing its real date, exercises, sets or loads.
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <select value={moveWeek??planWeekForSession(session)} onChange={e=>setMoveWeek(Number(e.target.value))}
            style={{...inputStyle,appearance:"auto",flex:1}}>
            {Array.from({length:state.block?.totalWeeks||1},(_,i)=><option key={i+1} value={i+1}>Plan week {i+1}</option>)}
          </select>
          <Btn size="md" disabled={Number(moveWeek)===planWeekForSession(session)} onClick={()=>{
            const destination=clamp(Number(moveWeek)||planWeekForSession(session),1,state.block?.totalWeeks||1);
            const updated={...session,planWeek:destination};
            setState(s=>({...s,sessions:s.sessions.map(x=>x.id===session.id?updated:x)}));
            setSession(updated);
            setMsg(`Moved ${session.dayName} to plan week ${destination}. Its workout date and logged sets were not changed.`);
          }}>MOVE</Btn>
        </div>
        {session.planWeek!=null && Number(session.planWeek)!==Number(session.week) && <button onClick={()=>{
          const updated={...session}; delete updated.planWeek;
          setState(s=>({...s,sessions:s.sessions.map(x=>x.id===session.id?updated:x)}));
          setSession(updated); setMoveWeek(Number(session.week));
        }} style={{marginTop:8,padding:0,border:"none",background:"transparent",color:C.orange,textDecoration:"underline",cursor:"pointer",fontSize:"calc(.62rem * var(--ts, 1))"}}>
          Restore original week {session.week}
        </button>}
      </Card>
      {session.debrief && (<Card style={{marginBottom:14}}>
        <div style={{fontSize:"calc(.84rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:8}}>{session.debrief.headline}</div>
        <Markdown text={session.debrief.body}/>
      </Card>)}
      {!!session.swaps?.length && <Card accent={C.orange} style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.orange,fontWeight:700,letterSpacing:".08em",marginBottom:7}}>RECORDED SWAPS</div>
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {session.swaps.map(sw=><div key={sw.id||`${sw.fromExId}-${sw.toExId}`} style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.dim,lineHeight:1.55}}>
            <strong style={{color:C.text}}>{sw.fromName} → {sw.toName}</strong><br/>
            {SWAP_REASON_BY_KEY[sw.reason]?.label||sw.reason}{sw.discomfortArea?` · ${DISCOMFORT_BY_KEY[sw.discomfortArea]?.label||sw.discomfortArea}`:""}
          </div>)}
        </div>
      </Card>}
      {session.exercises.map((e,i)=>{
        const logged = (e.log||[]).filter(l=>l&&l.reps!=null);
        return (<div key={i} style={{padding:"11px 0",borderBottom:`1px solid ${C.lineSoft}`}}>
          <div style={{display:"flex",justifyContent:"space-between",gap:10,marginBottom:6}}>
            <div style={{fontSize:"calc(.8rem * var(--ts, 1))",color:C.text,fontWeight:600}}>{e.name}</div>
            <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.faint,flexShrink:0}}>{e.weight}kg</div>
          </div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {logged.length ? logged.map((l,j)=>(
              <Chip key={j} color={EFFORT_BY_KEY[l.effort]?.color||C.faint}>
                {l.reps} @ {l.weight}kg {EFFORT_BY_KEY[l.effort]?.emoji}</Chip>
            )) : <span style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.ghost}}>not logged</span>}
          </div>
        </div>);
      })}
    </Sheet>)}
  </div>);
}

/* ═══════════════════════════════════════════════════════════════════════════
   SETTINGS
   ═══════════════════════════════════════════════════════════════════════════ */

function SettingsView({state, setState, apiKey, setApiKey, model, setModel, coach, onReset, clearTravel, apiStatus,apiChecking}){
  const [draftKey,setDraftKey] = useState(apiKey);
  const [keyState,setKeyState] = useState("idle");
  const [keyMsg,setKeyMsg]     = useState("");
  const [showKey,setShowKey]   = useState(false);
  const [confirmReset,setConfirmReset] = useState(false);
  const [newStation,setNewStation] = useState({num:"",name:""});
  const [scaleId,setScaleId]   = useState(loadScaleId);
  const [themeId,setThemeId]   = useState(loadThemeId);
  const [resolved,setResolved] = useState(()=>resolveTheme(loadThemeId()));

  /* On "System" the hint names which way the phone is currently set, so keep it
     honest if the phone flips while this screen is open. */
  useEffect(()=>{
    let mq;
    try{ mq = window.matchMedia("(prefers-color-scheme: dark)"); }catch{ return; }
    const sync = ()=>setResolved(resolveTheme(loadThemeId()));
    mq.addEventListener ? mq.addEventListener("change", sync) : mq.addListener(sync);
    return ()=>{ mq.removeEventListener ? mq.removeEventListener("change", sync) : mq.removeListener(sync); };
  },[]);
  const [sound,setSound]       = useState(()=>cues.enabled());
  const [soundVolume,setSoundVolume] = useState(()=>cues.volume());
  const [wake,setWake]         = useState(()=>wakeLock.enabled());

  const allStations = [...SEED_STATIONS, ...(state.equipment.custom||[])];
  const on = new Set(state.equipment.enabled);

  function toggleStation(num){
    setState(s=>({...s, equipment:{...s.equipment,
      enabled: new Set(s.equipment.enabled).has(num)
        ? s.equipment.enabled.filter(n=>n!==num)
        : [...s.equipment.enabled, num]}}));
  }
  function addStation(){
    const num = newStation.num.trim(), name = newStation.name.trim();
    if(!num || !name) return;
    if(allStations.some(s=>s.num===num)){ return; }
    setState(s=>({...s, equipment:{...s.equipment,
      custom:[...(s.equipment.custom||[]), {num,name,kind:"custom"}],
      enabled:[...s.equipment.enabled, num]}}));
    setNewStation({num:"",name:""});
  }
  function removeStation(num){
    setState(s=>({...s, equipment:{...s.equipment,
      custom:(s.equipment.custom||[]).filter(c=>c.num!==num),
      enabled:s.equipment.enabled.filter(n=>n!==num)}}));
  }

  async function testKey(){
    const k = draftKey.trim();
    if(!k) return;
    setKeyState("testing"); setKeyMsg("");
    try{ await coach.testKey(k); setApiKey(k); saveKey(k); setKeyState("ok"); setKeyMsg("Connected and saved. You will not need to test it again when reopening the app."); }
    catch(e){ setKeyState("bad"); setKeyMsg(e.kind==="auth" ? "Rejected — check you copied the whole key." : e.message); }
  }
  function saveKeyNow(){
    const k = draftKey.trim();
    setApiKey(k); saveKey(k);
    if(k) saveApiStatus(false,"saved");
    else try{ localStorage.removeItem(API_STATUS_KEY); }catch{}
    setKeyState(k?"saved":"idle");
    setKeyMsg(k ? "Saved. The app will verify it automatically without generating content or spending message tokens." : "Key removed. The built-in coach takes over.");
  }

  const p = state.profile, l = state.limits;
  const connection=coachConnectionMeta(apiKey,apiStatus,apiChecking);
  const discomforts = activeDiscomforts(state);
  const coachStyle = {...DEFAULT_COACH_STYLE, ...(state.coachStyle||{})};
  const uiPrefs = {...DEFAULT_UI_PREFS, ...(state.uiPrefs||{})};
  const setP = (k,v) => setState(s=>({...s, profile:{...s.profile,[k]:v}}));
  const setDaysPerWeek = v => setState(s=>changeTrainingDays(s,v));
  const setL = (k,v) => setState(s=>({...s, limits:{...s.limits,[k]:v}}));
  const resolveDiscomfort = area => setState(s=>({...s,
    discomfortFlags:(s.discomfortFlags||[]).map(x=>x.area===area?{...x,active:false,resolvedAt:todayISO()}:x)}));
  const setCoachStyle = (k,v) => setState(s=>({...s,
    coachStyle:{...DEFAULT_COACH_STYLE, ...(s.coachStyle||{}), [k]:v}}));
  const setUiPref = (k,v) => setState(s=>({...s,
    uiPrefs:{...DEFAULT_UI_PREFS, ...(s.uiPrefs||{}), [k]:v}}));

  return (<div className="fade" style={{paddingTop:8,paddingBottom:20}}>
    <SectionTitle sub="Everything lives on this device.">SETTINGS</SectionTitle>

    {/* ── API key ─────────────────────────────────────────────────────── */}
    <Card accent={connection.color} style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div>
          <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:700}}>
            {connection.title}
          </div>
          <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.faint,marginTop:2}}>
            {connection.sub}
          </div>
        </div>
        {apiKey && <Chip color={connection.color}>{connection.label}</Chip>}
      </div>

      <Field label="Anthropic API key">
        <div style={{display:"flex",gap:6}}>
          <Input type={showKey?"text":"password"} placeholder="sk-ant-..." value={draftKey} autoComplete="off"
            onChange={e=>{setDraftKey(e.target.value); setKeyState("idle"); setKeyMsg("");}}
            style={{fontFamily:"monospace",fontSize:"calc(.76rem * var(--ts, 1))",flex:1}}/>
          <Btn kind="ghost" size="md" onClick={()=>setShowKey(v=>!v)} style={{width:46,padding:0}}>
            {showKey?"🙈":"👁"}</Btn>
        </div>
      </Field>

      <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:keyMsg?10:0}}>
        <Btn kind="solid" size="sm" onClick={testKey} disabled={!draftKey.trim()||keyState==="testing"}>
          {keyState==="testing" ? <><Spinner size={11}/> Connecting</> : "Test & save"}</Btn>
        <Btn size="sm" onClick={saveKeyNow} disabled={draftKey.trim()===apiKey}>Save</Btn>
        {apiKey && <Btn kind="danger" size="sm" onClick={()=>{ setDraftKey(""); setApiKey(""); saveKey(""); try{localStorage.removeItem(API_STATUS_KEY);}catch{}
          setKeyState("idle"); setKeyMsg("Key removed. The built-in coach takes over."); }}>Remove</Btn>}
      </div>
      {keyMsg && <div style={{fontSize:"calc(.68rem * var(--ts, 1))",lineHeight:1.5,
        color:keyState==="bad"?C.red:C.green}}>{keyMsg}</div>}

      <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.ghost,lineHeight:1.7,marginTop:12,
        borderTop:`1px solid ${C.lineSoft}`,paddingTop:11}}>
        <strong style={{color:C.yellow}}>Stored unencrypted in this browser.</strong> Any script running on this
        device can read it — that's a limitation of an app with no server, not a bug. Use a key with a spend
        limit set, and don't do this on a shared machine. Requests go directly from your browser to Anthropic.
      </div>
    </Card>

    {apiKey && (<Card style={{marginBottom:14}}>
      <Field label="Model" hint="All three work. Cheaper models write shorter, blunter coaching; Opus reasons more carefully about your history.">
        <Choice cols={1} value={model} onChange={m=>{setModel(m); saveModel(m);}}
          options={MODELS.map(m=>({value:m.id,label:m.label,sub:m.note}))}/>
      </Field>
    </Card>)}

    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:9}}>COACH PERSONALITY</div>
    <Card accent={C.orange} style={{marginBottom:14}}>
      <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,lineHeight:1.65,marginBottom:16}}>
        These settings shape every AI-written plan, session brief, debrief, weekly review and chat reply.
        They do not loosen the coach's safety rules.
      </div>
      <Field label={`Sass — ${SASS_LEVELS[coachStyle.sass].label}`}
        hint={SASS_LEVELS[coachStyle.sass].note}>
        <Slider min={1} max={5} value={coachStyle.sass}
          onChange={v=>setCoachStyle("sass",v)} format={v=>`${v} / 5`}/>
      </Field>
      <Field label={`Hard truth — ${HARD_TRUTH_LEVELS[coachStyle.hardTruth].label}`}
        hint={HARD_TRUTH_LEVELS[coachStyle.hardTruth].note}>
        <Slider min={1} max={5} value={coachStyle.hardTruth}
          onChange={v=>setCoachStyle("hardTruth",v)} format={v=>`${v} / 5`}/>
      </Field>
      <div style={{background:C.raised,border:`1px solid ${C.lineSoft}`,borderRadius:11,padding:"12px 13px"}}>
        <div style={{fontSize:"calc(.56rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".09em",marginBottom:6}}>HOW THAT SOUNDS</div>
        <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.dim,lineHeight:1.65}}>
          {coachStylePreview(coachStyle)}
        </div>
      </div>
      <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.ghost,lineHeight:1.65,marginTop:12}}>
        On supported phones, session debriefs and weekly reviews include a Listen button. The AI writes a short spoken recap;
        your phone reads it with its best available English voice, so no second API key or audio upload is needed.
      </div>
    </Card>

    {/* ── this device ─────────────────────────────────────────────────── */}
    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:9}}>THIS DEVICE</div>
    <Card style={{marginBottom:14}}>
      <Field label="Theme"
        hint={themeId==="system"
          ? `Following your phone, which is currently set to ${resolved}.`
          : "Set here, regardless of what your phone is doing."}>
        <Choice cols={3} value={themeId}
          onChange={id=>{ setThemeId(id); setResolved(saveThemeId(id)); }}
          options={THEMES.map(t=>({value:t.id,label:t.label,sub:t.note}))}/>
      </Field>
      {/* The preview below serves both settings — the whole card recolours. */}
      <div style={{height:1,background:C.lineSoft,margin:"4px 0 16px"}}/>
      <Field label="Text size" hint="Applies to everything except the big headings.">
        <div style={{display:"flex",gap:5,marginBottom:12}}>
          {TEXT_STEPS.map(s=>{
            const on = s.id===scaleId;
            return (<button key={s.id} onClick={()=>{ setScaleId(s.id); saveScaleId(s.id); }} style={{
              flex:1,padding:"9px 4px",borderRadius:9,cursor:"pointer",
              border:`1.5px solid ${on?C.red:C.line}`, background:on?`${tint(C.red,0x12)}`:C.raised,
              color:on?C.text:C.faint, fontWeight:on?700:400,
              fontSize:`calc(${0.5 + (s.v-0.92)*0.5}rem)`}}>A</button>);
          })}
        </div>
        <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.dim,marginBottom:8}}>
          <strong style={{color:C.text}}>{(TEXT_STEPS.find(s=>s.id===scaleId)||{}).label}</strong>
          {" — "}{(TEXT_STEPS.find(s=>s.id===scaleId)||{}).note}
        </div>
        <div style={{background:C.raised,borderRadius:10,padding:"11px 12px"}}>
          <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".08em",marginBottom:5}}>PREVIEW</div>
          <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.dim,lineHeight:1.7}}>
            Lower for a slow 2–3 seconds until your knees reach about 90°. Drive back through the
            whole foot, mostly the heel. Stop just short of locking out.
          </div>
        </div>
      </Field>
    </Card>

    <Card style={{marginBottom:14}}>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
        <Toggle on={sound} label="Rest timer sounds"
          sub="Short whistle at 20 seconds, the same whistle every second from 10 to 1, then a long whistle"
          onChange={v=>{ setSound(v); cues.setEnabled(v); }}/>
        <Field label={`Timer volume — ${soundVolume}%`}
          hint="Controls only SnapFit's timer cues, not your music app.">
          <Slider min={0} max={100} step={5} value={soundVolume}
            onChange={v=>{ setSoundVolume(v); cues.setVolume(v); }} format={v=>`${v}%`}/>
        </Field>
        <Toggle on={wake} label="Keep the screen awake during a session"
          sub={wakeLock.supported()
            ? "Stops the phone sleeping mid-workout — and a screen that stays on is what makes the sounds reliable"
            : "This browser doesn't support it. On iPhone you'll need Safari 16.4 or newer."}
          onChange={v=>{ setWake(v); wakeLock.setEnabled(v); }}/>
      </div>
      <Btn kind="solid" size="sm" onClick={()=>cues.test()} disabled={!sound || !cues.supported()}>

      </Btn>
      <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.ghost,lineHeight:1.7,marginTop:11,
        borderTop:`1px solid ${C.lineSoft}`,paddingTop:11}}>
        Cues are scheduled on the audio clock the moment rest starts. They may briefly mix with or
        duck music when they sound, but the countdown itself leaves other audio alone. A locked phone
        may suspend the cues; keeping the screen awake is the way to make them reliable.
      </div>
    </Card>

    {/* ── training ────────────────────────────────────────────────────── */}
    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:9}}>TRAINING</div>
    <Card style={{marginBottom:14}}>
      <Field label={`Days per week — ${p.daysPerWeek}`}

      <Field label="Dumbbell rack increments" hint="Stops impossible loads such as 14.5kg. The seeded Snap rack uses 2kg jumps; many commercial racks use 2.5kg.">

      <Field label="Training week starts"
        hint="Used by weekly reviews and by the coach when it names your current week. This does not reset or move your training block.">

      <Field label="Free weights vs machines">

      </Field>
      <Field label="Experience">
        <Choice cols={3} value={p.experience} onChange={v=>setP("experience",v)}
          options={[{value:"beginner",label:"New"},{value:"intermediate",label:"Some"},{value:"advanced",label:"Lots"}]}/>
      </Field>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
        <Toggle on={uiPrefs.showExerciseWhy} label='Show "Why this?" in workouts'
          sub="Lets you open the plan-specific reason for each exercise."
          onChange={v=>setUiPref("showExerciseWhy",v)}/>
        <Toggle on={uiPrefs.showExerciseHow} label='Show "How to do it" in workouts'
          sub="Includes the YouTube search shortcut and coaching notes, loaded only when opened."
          onChange={v=>setUiPref("showExerciseHow",v)}/>
        <Toggle on={uiPrefs.showLearnHub} label="Show Learning Hub"
          sub="Turn the entire Learn tab on or off. Your reading progress is kept when hidden."
          onChange={v=>setUiPref("showLearnHub",v)}/>
        <Toggle on={uiPrefs.showAdvancedLearn} label="Show advanced Learning Hub topics"
          sub="Adds autoregulation, fatigue management, exercise selection and trend interpretation."
          onChange={v=>setUiPref("showAdvancedLearn",v)}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="Age"><Input type="number" inputMode="numeric" value={p.age}
          onChange={e=>setP("age",e.target.value)}/></Field>
        <Field label="Height (cm)"><Input type="number" inputMode="numeric" value={p.heightCm}
          onChange={e=>setP("heightCm",e.target.value)}/></Field>
      </div>
    </Card>

    {/* ── limits ──────────────────────────────────────────────────────── */}
    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:9}}>WORK AROUND</div>
    <Card style={{marginBottom:14}}>
      {discomforts.length>0 && <div style={{marginBottom:13,paddingBottom:12,borderBottom:`1px solid ${C.lineSoft}`}}>
        <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.yellow,fontWeight:700,letterSpacing:".07em",marginBottom:6}}>ACTIVE DISCOMFORT FLAGS</div>
        <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.faint,lineHeight:1.6,marginBottom:8}}>
          Added during exercise swaps. Tagged exercises stay out of future suggestions until resolved.</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {discomforts.map(flag=><button key={flag.id||flag.area} onClick={()=>resolveDiscomfort(flag.area)} style={{
            border:`1px solid ${tint(C.green,0x40)}`,background:tint(C.green,0x0d),color:C.green,borderRadius:999,
            padding:"6px 9px",fontSize:"calc(.61rem * var(--ts, 1))",fontWeight:700,cursor:"pointer"}}>
            {DISCOMFORT_BY_KEY[flag.area].label}: MARK RESOLVED</button>)}
        </div>
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:12}}>
        {[["knees","Knees"],["shoulders","Shoulders"],["back","Lower back"],["ankles","Ankles"],["elbows","Elbows"]].map(([k,label])=>(
          <Toggle key={k} on={l[k]} onChange={v=>setL(k,v)} label={label}/>))}
      </div>
      <Field label="Notes for the coach">
        <TextArea value={l.note} onChange={e=>setL("note",e.target.value)}
          placeholder="Injuries, exercises you hate, anything a physio said"/>
      </Field>
      <div style={{fontSize:"calc(.61rem * var(--ts, 1))",color:C.ghost,lineHeight:1.55,marginTop:9}}>
        The switches above are long-term workarounds you control manually. Discomfort flags are temporary session feedback and can be cleared separately.</div>
    </Card>

    {/* ── away gym ────────────────────────────────────────────────────── */}
    {state.travel && (<>
      <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:9}}>
        AWAY GYM</div>
      <Card accent={travelOn(state)?C.orange:C.faint} style={{marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,fontWeight:700}}>
            📍 {state.travel.name}</div>
          <Chip color={travelOn(state)?C.orange:C.faint} style={{marginLeft:"auto"}}>
            {travelOn(state)?"ACTIVE TODAY":"OFF"}</Chip>
        </div>
        <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,lineHeight:1.6}}>
          {state.travel.stations.length} stations
          {state.travel.dumbbellMax?` · dumbbells to ${state.travel.dumbbellMax}kg`:""}
          {" · set up "}{state.travel.date}.
          {travelOn(state)
            ? " Today's sessions are built from this instead of your usual gym. It switches itself off tomorrow."
            : " Switched off — you're back on your usual gym. Change the venue on the Today screen to use it again."}
        </div>
        {/* Same handler the Today screen uses, so coming home here also drops a
            session built for the other gym rather than leaving you holding it. */}
        {travelOn(state) && <Btn kind="solid" full style={{marginTop:11}}
          onClick={clearTravel}>BACK TO MY USUAL GYM</Btn>}
      </Card>
    </>)}

    {/* ── equipment ───────────────────────────────────────────────────── */}
    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:9}}>
      YOUR GYM · {state.equipment.enabled.length} of {allStations.length}</div>
    <Card style={{marginBottom:14}}>
      <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,lineHeight:1.6,marginBottom:12}}>
        Only ticked equipment gets programmed. Untick what your gym doesn't have, or add your own below.
        {travelOn(state) && " This is your real gym — the away gym above is what today is actually using."}
      </div>
      <div className="equipment-grid" style={{display:"grid",gridTemplateColumns:"repeat(2,minmax(0,1fr))",gap:5,marginBottom:14,width:"100%",minWidth:0}}>
        {allStations.map(s=>{
          const active = on.has(s.num);
          const custom = s.kind==="custom";
          return (<div key={s.num} style={{position:"relative",minWidth:0}}>
            <button onClick={()=>toggleStation(s.num)} style={{width:"100%",minWidth:0,maxWidth:"100%",minHeight:54,
              padding:"8px 9px",borderRadius:9,cursor:"pointer",textAlign:"left",display:"flex",gap:6,alignItems:"center",
              border:`1px solid ${active?tint(C.red,0x55):C.line}`, background:active?`${tint(C.red,0x0d)}`:C.raised}}>
              <div style={{width:13,height:13,borderRadius:4,flexShrink:0,
                background:active?C.red:"transparent",border:`1.5px solid ${active?C.red:C.ghost}`,
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:"calc(.5rem * var(--ts, 1))",color:"#fff"}}>{active?"✓":""}</div>
              <div style={{minWidth:0,flex:1}}>
                <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:active?C.text:C.faint,
                  lineHeight:1.25,overflowWrap:"anywhere"}}>{s.name}</div>
                <div style={{fontSize:"calc(.54rem * var(--ts, 1))",color:C.ghost}}>#{s.num}{custom?" · yours":""}</div>
              </div>
            </button>
            {custom && <button onClick={()=>removeStation(s.num)} style={{position:"absolute",top:-5,right:-5,
              width:18,height:18,borderRadius:"50%",border:"none",background:C.red,color:"#fff",
              fontSize:"calc(.6rem * var(--ts, 1))",cursor:"pointer",lineHeight:1}}>✕</button>}
          </div>);
        })}
      </div>
      <div style={{display:"flex",gap:6}}>
        <Input placeholder="#" value={newStation.num} onChange={e=>setNewStation(s=>({...s,num:e.target.value}))}
          style={{width:64,textAlign:"center"}}/>
        <Input placeholder="Equipment name" value={newStation.name}
          onChange={e=>setNewStation(s=>({...s,name:e.target.value}))} style={{flex:1}}/>
        <Btn size="md" onClick={addStation} disabled={!newStation.num.trim()||!newStation.name.trim()}
          style={{width:52,padding:0}}>+</Btn>
      </div>
      <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.ghost,lineHeight:1.6,marginTop:9}}>
        Custom equipment is passed to the coach by name, but only exercises in the built-in catalogue
        get full form coaching.
      </div>
    </Card>

    {/* ── danger ──────────────────────────────────────────────────────── */}
    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:9}}>DANGER ZONE</div>
    <Card style={{marginBottom:14}}>
      <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,marginBottom:12}}>
        Wipes your goal, plan, history and settings from this device. Export a JSON backup from the
        Log tab first if there's anything you want to keep.
      </div>
      <Btn kind="danger" size="md" full onClick={()=>setConfirmReset(true)}>RESET EVERYTHING</Btn>
    </Card>

    <div style={{textAlign:"center",fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,lineHeight:1.8,paddingTop:6}}>
      SnapFit v2 · Gym Buddy<br/>
      General training guidance, not medical advice.
    </div>

    {confirmReset && <Confirm message="Erase everything?" danger confirmLabel="Erase it all"
      sub="Your goal, block, session history, working weights and settings all go. This cannot be undone."
      onCancel={()=>setConfirmReset(false)} onConfirm={()=>{ setConfirmReset(false); onReset(); }}/>}
  </div>);
}

/* ═══════════════════════════════════════════════════════════════════════════
   APP
   ═══════════════════════════════════════════════════════════════════════════ */

const ACTIVE_KEY = "snapfit_v2_active";

const NAV = [
  {id:"plan",  label:"Plan",  icon:"🗓"},
  {id:"today", label:"Today", icon:"⚡"},
  {id:"goal",  label:"Goal",  icon:"🎯"},
  {id:"coach", label:"Coach", icon:"💬"},
  {id:"learn", label:"Learn", icon:"📖"},
  {id:"log",   label:"Log",   icon:"📋"},
];

function App(){
  const [state,setStateRaw] = useState(loadState);
  const [apiKey,setApiKey]  = useState(loadKey);
  const [model,setModel]    = useState(loadModel);
  const [view,setView]      = useState("today");
  const [logExerciseId,setLogExerciseId] = useState(null);
  const [session,setSessionRaw] = useState(()=>{
    try{ const r = localStorage.getItem(ACTIVE_KEY); return r ? JSON.parse(r) : null; }catch{ return null; }
  });
  const [generating,setGenerating] = useState(false);
  const [replanning,setReplanning] = useState(false);
  const [debrief,setDebrief]       = useState(null);
  const [debriefSession,setDebriefSession] = useState(null);
  const [debriefLoading,setDebriefLoading] = useState(false);
  const [review,setReview]         = useState(null);
  const [reviewLoading,setReviewLoading]   = useState(false);
  const [offline,setOffline]       = useState(null);
  const [bonusPending,setBonusPending] = useState(false);
  const [regenerationReason,setRegenerationReason] = useState("");
  const [updateWorker,setUpdateWorker] = useState(()=>window.__snapfitUpdateWorker||null);
  const [updatingApp,setUpdatingApp] = useState(false);
  const [wakeStatus,setWakeStatus] = useState(()=>wakeLock.status());
  const [apiStatus,setApiStatus] = useState(loadApiStatus);
  const [apiChecking,setApiChecking] = useState(false);

  /* Rest timer lives here, not in TodayView, so it survives tab changes.
     Persisted so a reload mid-workout resumes it rather than losing it. */
  const [rest,setRestRaw] = useState(()=>{
    try{
      const r = JSON.parse(localStorage.getItem(REST_KEY) || "null");
      return (r && r.endsAt > Date.now()) ? r : null;
    }catch{ return null; }
  });

  const stateRef = useRef(state); stateRef.current = state;
  const keyRef   = useRef(apiKey); keyRef.current   = apiKey;
  const modelRef = useRef(model);  modelRef.current = model;

  useEffect(()=>{
    const ready=()=>setUpdateWorker(window.__snapfitUpdateWorker||null);
    window.addEventListener("snapfit-update-ready",ready);
    ready();
    return ()=>window.removeEventListener("snapfit-update-ready",ready);
  },[]);
  useEffect(()=>wakeLock.subscribe(setWakeStatus),[]);
  useEffect(()=>{
    const sync=e=>setApiStatus(e.detail||loadApiStatus());
    window.addEventListener("snapfit-api-status",sync);
    return ()=>window.removeEventListener("snapfit-api-status",sync);
  },[]);
  /* Keep the credential durable even when it arrived through backup restore or
     another state path rather than the Settings Save button. */
  useEffect(()=>{ saveKey(apiKey); },[apiKey]);

  function applyAppUpdate(){
    if(updatingApp) return;
    setUpdatingApp(true);
    window.__snapfitReloadForUpdate=true;
    const worker=updateWorker||window.__snapfitUpdateWorker;
    if(worker && worker.state!=="activated") worker.postMessage({type:"SKIP_WAITING"});
    else window.location.reload();
    /* Controller change normally reloads immediately. This fallback covers
       older iOS builds that activate the worker but miss that event. */
    setTimeout(()=>window.location.reload(),2500);
  }

  const setState = useCallback(updater=>{
    setStateRaw(prev=>{
      const next = typeof updater==="function" ? updater(prev) : updater;
      persist(next); stateRef.current = next; return next;
    });
  },[]);

  const setSession = useCallback(updater=>{
    setSessionRaw(prev=>{
      const next = typeof updater==="function" ? updater(prev) : updater;
      try{ next ? localStorage.setItem(ACTIVE_KEY, JSON.stringify(next)) : localStorage.removeItem(ACTIVE_KEY); }catch{}
      return next;
    });
  },[]);

  const setRest = useCallback(r=>{
    try{ r ? localStorage.setItem(REST_KEY, JSON.stringify(r)) : localStorage.removeItem(REST_KEY); }catch{}
    setRestRaw(r);
  },[]);

  /* Called from a tap, which is the only place iOS lets us resume the audio
     context — so the cues are scheduled here and nowhere else. */
  const startRest = useCallback(({exName, label, seconds})=>{
    const endsAt = Date.now() + seconds*1000;
    setRest({endsAt, total:seconds, exName, label});
    cues.schedule(endsAt);
  },[setRest]);

  const skipRest = useCallback(()=>{ cues.cancel(); setRest(null); },[setRest]);

  // Clear the bar a beat after it hits zero, so "GO" is readable first.
  useEffect(()=>{
    if(!rest) return;
    const id = setInterval(()=>{
      if(Date.now() > rest.endsAt + 2500) setRest(null);
    }, 500);
    return ()=>clearInterval(id);
  },[rest, setRest]);

  // Hold the screen awake only while a session is actually in progress.
  useEffect(()=>{ wakeLock.setWanted(!!session); },[!!session]);

  const flagOffline = useCallback((kind, err)=>{
    const detail=String(err?.message||"").replace(/\s+/g," ").trim().slice(0,120);
    setOffline({kind, msg: err?.kind==="auth" ? "API key rejected — this result is built-in, not AI-generated."
                        : err?.kind==="rate" ? "Rate limited — this result is built-in, not AI-generated."
                        : err?.kind==="timeout" ? "The coach timed out — this result is built-in, not AI-generated."
                        : `Couldn't reach the coach${detail?` (${detail})`:""} — this result is built-in, not AI-generated.`});
    setTimeout(()=>setOffline(null), 6000);
  },[]);

  const coach = useMemo(()=>makeCoach(
    ()=>stateRef.current, ()=>keyRef.current, ()=>modelRef.current, flagOffline
  ),[flagOffline]);

  /* A saved key should stay hands-off. Verify it on launch, every 12 hours
     while healthy, and every two minutes after a failure. The models endpoint
     authenticates the key without generating content or spending tokens. */
  useEffect(()=>{
    if(!apiKey){ setApiChecking(false); return; }
    let cancelled=false;
    const id=setTimeout(async()=>{
      if(cancelled) return;
      setApiChecking(true);
      try{ await coach.testKey(apiKey); }catch{}
      finally{ if(!cancelled) setApiChecking(false); }
    },nextApiCheckDelay(apiStatus));
    return ()=>{ cancelled=true; clearTimeout(id); };
  },[apiKey,apiStatus?.at,coach]);

  const aiOn = !!apiKey;
  const connection=coachConnectionMeta(apiKey,apiStatus,apiChecking);
  const prog = blockProgress(state);

  /* ── block ──────────────────────────────────────────────────────────── */
  async function buildBlock(baseState){
    setReplanning(true);
    try{
      if(baseState) stateRef.current = baseState;
      const previous=stateRef.current.block;
      const block = await coach.buildBlock();
      /* With a saved key, an explicit AI retry must be transactional. A second
         connection failure returns the rules fallback, but replacing an
         existing block with it would silently reset the user's week and block
         id. Keep the current block unless the AI actually answered. */
      if(previous && keyRef.current && block?.source!=="ai") return false;
      setState(s=>({...s, block}));
      return true;
    } finally { setReplanning(false); }
  }

  /* ── session ────────────────────────────────────────────────────────── */
  async function generate(checkin, {bonus=false,regenerateReason=""}={}){
    setGenerating(true);
    wakeLock.setWanted(true); // this call still sits inside the user's tap on iOS
    let built=false;
    try{
      if(checkin) setState(s=>({...s, checkins:[{date:todayISO(), ...checkin}, ...s.checkins].slice(0,60)}));
      const sess = await coach.todaysSession(checkin, {bonus,regenerateReason});
      if(sess){
        setSession({...sess, exercises: sess.exercises.map(e=>({...e,
          plateLoad:plateHintForExercise(e,stateRef.current),log:Array(e.sets).fill(null)}))});
        built=true;
        if(bonus) setBonusPending(false);
        setRegenerationReason("");
      }
    } finally {
      if(!built) wakeLock.setWanted(false);
      setGenerating(false);
    }
  }

  function regenerateSession(reason){
    setSession(null);
    setRegenerationReason(String(reason||"I want a different session").slice(0,300));
    setView("today");
  }

  async function retryAiSession(current){
    if(!current || generating) return;
    const saved=(stateRef.current.checkins||[]).find(c=>c.date===todayISO());
    const checkin=saved ? (({date,...answers})=>answers)(saved) : null;
    await generate(checkin,{bonus:!!current.bonus,
      regenerateReason:"Retrying because the previous AI coach request failed."});
  }

  async function finishSession(sess){
    const weights = {...stateRef.current.weights};
    const hist    = {...stateRef.current.exerciseHistory};

    sess.exercises.forEach(e=>{
      const logged = (e.log||[]).filter(l=>l&&l.reps!=null);
      if(!logged.length) return;
      const perf = performanceSummary(logged, e.repRange || [Math.max(1,e.targetReps-2),e.targetReps]);
      weights[e.exId] = { weight:perf.weight, lastAvgReps:perf.avgReps, lastTargetReps:e.targetReps,
        lastEffort:perf.effort, inc:e.inc||2.5, updated:sess.date };
      hist[e.exId] = [...(hist[e.exId]||[]), { date:sess.date, station:e.stations?.[0]||null,
        setsLogged:logged.length, workingSets:perf.sets, totalSets:e.sets, avgReps:perf.avgReps, targetReps:e.targetReps,
        weight:perf.weight, effort:perf.effort, sets:logged.map(x=>({weight:x.weight,reps:x.reps,effort:x.effort})),
        dayName:sess.dayName, sessionId:sess.id }];
    });

    const stored = {...sess, finishedAt:new Date().toISOString()};
    setState(s=>({...s, weights, exerciseHistory:hist, sessions:[stored, ...s.sessions].slice(0,300)}));
    setDebriefSession(stored);
    setSession(null);
    setView("today");
    setDebriefLoading(true);
    try{
      const d = await coach.debrief(stored);
      setDebrief(d);
      setDebriefSession(x=>x?{...x,coachNote:d?.note||""}:x);
      if(d?.note){
        setState(s=>({...s, coachNotes:[...(s.coachNotes||[]), d.note].slice(-20),
          sessions: s.sessions.map(x=>x.id===stored.id ? {...x, debrief:{headline:d.headline, body:d.body},coachNote:d.note} : x)}));
      } else {
        setState(s=>({...s, sessions: s.sessions.map(x=>x.id===stored.id
          ? {...x, debrief:{headline:d.headline, body:d.body}} : x)}));
      }
    } finally { setDebriefLoading(false); }
  }

  async function runReview(){
    setReviewLoading(true);
    try{
      const r = await coach.weeklyReview();
      setReview(r);
      if(r?.note) setState(s=>({...s, coachNotes:[...(s.coachNotes||[]), r.note].slice(-20)}));
    } finally { setReviewLoading(false); }
  }

  function resetAll(){
    try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem(ACTIVE_KEY); localStorage.removeItem(API_STATUS_KEY); }catch{}
    skipRest(); setSession(null); setDebrief(null); setReview(null);
    setBonusPending(false); setRegenerationReason("");
    setStateRaw(defaultState()); stateRef.current = defaultState();
    setView("today");
  }

  /* Restoring a backup swaps the whole state out, so anything derived from the
     old one — the in-progress session, a running rest, a stale debrief — has to
     go with it. */
  function restoreState(next, restoredApiKey=null){
    skipRest(); setSession(null); setDebrief(null); setReview(null);
    setBonusPending(false); setRegenerationReason("");
    if(restoredApiKey !== null){
      setApiKey(restoredApiKey);
      saveKey(restoredApiKey);
    }
    setState(next);
    setView("today");
    setDebriefSession(null);
  }

  /* ── away gym ───────────────────────────────────────────────────────────
     Changing venue changes which exercises exist, so any session already built
     for the old venue is discarded. It hasn't been logged against yet — the
     venue row only appears before a session starts — so nothing is lost, and
     silently keeping a session built for the wrong gym would be worse. */
  function setTravel(t){
    setState(s=>({...s, travel:normaliseTravel(t)}));
    setSession(null);
  }
  function clearTravel(){
    setState(s=>({...s, travel: s.travel ? {...s.travel, active:false} : null}));
    setSession(null);
  }
  /* Distinct from clearTravel: that comes home but keeps the venue on file so a
     multi-night stay is one tap a day. This throws the record away, so it stops
     offering itself back. */
  function forgetTravel(){
    setState(s=>({...s, travel:null}));
    setSession(null);
  }

  function recordDiscomfort({area,exerciseId,exerciseName}){
    if(!DISCOMFORT_BY_KEY[area]) return;
    setState(s=>({...s,discomfortFlags:[
      {id:uid(),area,active:true,date:todayISO(),exerciseId,exerciseName},
      ...(s.discomfortFlags||[]).filter(x=>x.area!==area),
    ].slice(0,30)}));
  }

  function resolveDiscomfort(area){
    setState(s=>({...s,discomfortFlags:(s.discomfortFlags||[]).map(x=>x.area===area?{...x,active:false,resolvedAt:todayISO()}:x)}));
  }

  /* ── onboarding ─────────────────────────────────────────────────────── */
  if(!state.onboarded){
    return (<><style>{APP_CSS}</style>
      <Onboarding state={state} setState={setState} coach={coach}
        onRestore={restoreState}
        onDone={async next=>{ await buildBlock(next); }}/>
    </>);
  }

  /* ── first block still building ─────────────────────────────────────── */
  if(!state.block && replanning){
    return (<><style>{APP_CSS}</style>
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:24}}>
        <div style={{textAlign:"center"}}>
          <Spinner size={30}/>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.3rem",color:C.dim,
            letterSpacing:".08em",marginTop:16}}>BUILDING YOUR BLOCK</div>
          <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.ghost,marginTop:8,maxWidth:280,lineHeight:1.6}}>
            {aiOn ? "Your coach is designing a plan around your goal, schedule and gym."
                  : "Putting together a plan from your goal and schedule."}
          </div>
        </div>
      </div>
    </>);
  }

  const goalMeta = state.goal ? GOAL_BY_ID[state.goal.type] : null;

  return (<>
    <style>{APP_CSS}</style>
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column"}}>

      {/* header */}
      <div style={{background:C.bg,borderBottom:`1px solid ${C.lineSoft}`,position:"sticky",top:0,zIndex:60}}>
        {/* minHeight, not height — at the larger text sizes the goal line wraps
            and the header needs to grow with it rather than spill out. */}
        <div style={{maxWidth:620,margin:"0 auto",padding:"6px 16px",minHeight:54,
          display:"flex",alignItems:"center",gap:10}}>
          <Logo h={22}/>
          <div style={{width:1,height:16,background:C.line,flexShrink:0}}/>
          <div style={{minWidth:0,flex:1}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:".85rem",color:C.dim,
              letterSpacing:".1em",lineHeight:1.1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
              {goalMeta ? goalMeta.label.toUpperCase() : "GYM BUDDY"}</div>
            {prog && <div style={{fontSize:"calc(.55rem * var(--ts, 1))",color:C.ghost,marginTop:1}}>
              Week {prog.week}/{prog.total} · {prog.phase.name}</div>}
          </div>
          <Chip color={connection.color} onClick={()=>setView("settings")}
            style={{cursor:"pointer"}}>{connection.label}</Chip>
          <button onClick={()=>setView("settings")} style={{background:"transparent",border:"none",
            color:view==="settings"?C.red:C.faint,fontSize:"calc(1.05rem * var(--ts, 1))",cursor:"pointer",padding:"4px 2px",flexShrink:0}}>⚙</button>
        </div>
        {offline && (<div className="fade" style={{background:`${tint(C.yellow,0x12)}`,borderTop:`1px solid ${tint(C.yellow,0x30)}`,
          padding:"6px 16px"}}>
          <div style={{maxWidth:620,margin:"0 auto",fontSize:"calc(.64rem * var(--ts, 1))",color:C.yellow}}>⚠ {offline.msg}</div>
        </div>)}
        {updateWorker && (<div className="fade" style={{background:tint(C.green,0x12),borderTop:`1px solid ${tint(C.green,0x35)}`,
          padding:"7px 16px"}}>
          <div style={{maxWidth:620,margin:"0 auto",display:"flex",alignItems:"center",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.green,fontWeight:700}}>UPDATE AVAILABLE</div>
              <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.faint,marginTop:1}}>Your active workout is saved. Reload when you're ready.</div>
            </div>
            <button onClick={applyAppUpdate} disabled={updatingApp} style={{border:"none",borderRadius:8,background:C.green,color:C.onGreen,
              padding:"7px 10px",fontSize:"calc(.61rem * var(--ts, 1))",fontWeight:800,cursor:"pointer",flexShrink:0}}>
              {updatingApp?"UPDATING…":"UPDATE & RELOAD"}</button>
          </div>
        </div>)}
      </div>

      {/* body */}
      <div style={{flex:1,minHeight:0,display:"flex",flexDirection:"column"}}>
        <div style={{maxWidth:620,margin:"0 auto",padding:"0 16px",width:"100%",flex:1,
          display:"flex",flexDirection:"column",paddingBottom:"calc(74px + env(safe-area-inset-bottom))"}}>

          {debrief || debriefLoading
            ? <DebriefView debrief={debrief} loading={debriefLoading} aiOn={aiOn} session={debriefSession} coach={coach}
                onClarified={(user,reply)=>setState(s=>{
                  const note=`Session ${debriefSession?.date||todayISO()} clarification: ${user}. Coach response: ${plainCoachText(reply).slice(0,260)}`;
                  return {...s,coachNotes:[...(s.coachNotes||[]).filter(x=>!debriefSession?.coachNote||x!==debriefSession.coachNote),note].slice(-20),
                    sessions:s.sessions.map(x=>x.id===debriefSession?.id?{...x,clarifications:[...(x.clarifications||[]),{at:new Date().toISOString(),user,reply}]}:x)};
                })}
                onExclude={()=>{
                  const ids=new Set((debriefSession?.exercises||[]).map(e=>e.exId));
                  setState(s=>{
                    const weights={...s.weights}, exerciseHistory={...s.exerciseHistory};
                    ids.forEach(id=>{
                      const hist=(exerciseHistory[id]||[]).filter(x=>x.sessionId!==debriefSession?.id);
                      exerciseHistory[id]=hist;
                      const last=hist[hist.length-1];
                      if(last) weights[id]={...weights[id],weight:last.weight,lastAvgReps:last.avgReps,lastTargetReps:last.targetReps,lastEffort:last.effort||weights[id]?.lastEffort,updated:last.date};
                      else delete weights[id];
                    });
                    return {...s,weights,exerciseHistory,sessions:s.sessions.map(x=>x.id===debriefSession?.id?{...x,excludedFromProgression:true}:x)};
                  });
                  setDebriefSession(x=>({...x,excludedFromProgression:true}));
                }}
                onDone={()=>{ setDebrief(null); setDebriefSession(null); setReview(null); }}/>
            : view==="today"    ? <TodayView state={state} session={session} setSession={setSession}
                                    generating={generating} onGenerate={ci=>{
                                      if(prog?.complete && !bonusPending) buildBlock();
                                      else generate(ci,{bonus:bonusPending,regenerateReason:regenerationReason});
                                    }}
                                    onFinish={finishSession} coach={coach} aiOn={aiOn}
                                    rest={rest} startRest={startRest} skipRest={skipRest}
                                    apiKey={apiKey} setTravel={setTravel} clearTravel={clearTravel}
                                    forgetTravel={forgetTravel} bonusPending={bonusPending}
                                    onCancelBonus={()=>setBonusPending(false)}
                                    onRecordDiscomfort={recordDiscomfort} onResolveDiscomfort={resolveDiscomfort}
                                    wakeStatus={wakeStatus} onRetryWake={()=>wakeLock.retry()}
                                    regenerationReason={regenerationReason} onRegenerate={regenerateSession}
                                    onViewHistory={exId=>{setLogExerciseId(exId);setView("log");}}
                                    onRetryAI={retryAiSession}/>
            : view==="plan"     ? <PlanView state={state} onReplan={()=>buildBlock()} replanning={replanning} aiOn={aiOn}
                                    onSetWeekTarget={v=>setState(s=>{
                                      const current=blockProgress(s);
                                      return setPlanWeekTarget(s,current?.week||1,v);
                                    })}
                                    onSetCurrentWeek={week=>setState(s=>setCurrentPlanWeek(s,week))}
                                    onClearCurrentWeek={()=>setState(clearCurrentPlanWeek)}
                                    currentSession={session} onAddBonus={()=>{
                                      if(!session) setBonusPending(true);
                                      setView("today");
                                    }}/>
            : view==="goal"     ? <GoalView state={state} setState={setState} review={review}
                                    reviewLoading={reviewLoading} onReview={runReview} aiOn={aiOn}/>
            : view==="coach"    ? <ChatView state={state} setState={setState} coach={coach} aiOn={aiOn}
                                    onGoSettings={()=>setView("settings")}/>
            : view==="learn"    ? <LearnView state={state} setState={setState} onHide={()=>{
                                      setState(s=>({...s,uiPrefs:{...DEFAULT_UI_PREFS,...(s.uiPrefs||{}),showLearnHub:false}}));
                                      setView("today");
                                    }}/>
            : view==="log"      ? <LogView state={state} setState={setState} onRestore={restoreState} apiKey={apiKey}
                                    initialExerciseId={logExerciseId} onInitialExerciseOpened={()=>setLogExerciseId(null)}/>
            : <SettingsView state={state} setState={setState} apiKey={apiKey} setApiKey={setApiKey} apiStatus={apiStatus}
                apiChecking={apiChecking}
                model={model} setModel={setModel} coach={coach} onReset={resetAll}
                clearTravel={clearTravel}/>}
        </div>
      </div>

      {/* Rest bar sits above the nav and shows on every tab, so you can read
          Learn or check the Plan while you wait without losing the countdown. */}
      <RestBar rest={rest} onSkip={skipRest}/>

      {/* nav */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,background:C.surface,
        borderTop:`1px solid ${C.line}`,zIndex:70,paddingBottom:"env(safe-area-inset-bottom)"}}>
        <div style={{maxWidth:620,margin:"0 auto",display:"flex"}}>
          {NAV.filter(n=>n.id!=="learn" || (state.uiPrefs?.showLearnHub??true)).map(n=>{
            const active = view===n.id;
            const badge = n.id==="today" && session && !debrief;
            return (<button key={n.id} onClick={()=>{ setView(n.id); setDebrief(null); }} style={{
              flex:1,border:"none",background:"transparent",cursor:"pointer",padding:"9px 2px 11px",
              position:"relative",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
              <div style={{position:"absolute",top:0,left:"18%",right:"18%",height:2,borderRadius:"0 0 2px 2px",
                background:active?C.red:"transparent"}}/>
              <span style={{fontSize:"calc(.85rem * var(--ts, 1))",lineHeight:1,opacity:active?1:.42}}>{n.icon}</span>
              <span style={{fontSize:"calc(.52rem * var(--ts, 1))",fontWeight:active?700:500,color:active?C.text:C.faint,
                letterSpacing:".03em"}}>{n.label.toUpperCase()}</span>
              {badge && !active && <div style={{position:"absolute",top:7,right:"24%",width:5,height:5,
                borderRadius:"50%",background:C.red}}/>}
            </button>);
          })}
        </div>
      </div>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
/* Bootstrap.
   Babel's `react` preset now defaults to the automatic JSX runtime, which emits
   `import {jsx} from "react/jsx-runtime"` — an ESM import, in a page with no
   bundler and no module graph. A plain <script type="text/babel"> gives you no
   way to pass preset options, so we hold the source as text/plain and run the
   transform ourselves with the classic runtime pinned. Still no build step. */
(function(){
  var el = document.getElementById("app-source");
  function fail(msg, detail){
    document.getElementById("root").innerHTML =
      // The palette lives in the <head>, so even the failure screen follows the
      // user's theme rather than being dark on a light phone.
      '<div style="font-family:system-ui,sans-serif;color:var(--c-text);padding:32px;max-width:520px;margin:0 auto">' +
      '<div style="font-size:1.4rem;font-weight:700;margin-bottom:10px">SnapFit couldn\'t start</div>' +
      '<div style="color:var(--c-dim);line-height:1.7;font-size:.9rem">' + msg + '</div>' +
      (detail ? '<pre style="color:var(--c-red);background:var(--c-card);padding:12px;border-radius:8px;margin-top:14px;' +
                'font-size:.72rem;overflow:auto;white-space:pre-wrap">' + detail + '</pre>' : '') + '</div>';
  }
  if(typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined"){
    return fail("The libraries it needs didn't load. Check your connection and reload — once they're cached the app works offline.");
  }
  try{
    var out = Babel.transform(el.textContent, {
      presets: [["react", {runtime:"classic"}]],
      sourceType: "script",
      filename: "snapfit.jsx",
    }).code;
    var s = document.createElement("script");
    s.textContent = out;
    document.body.appendChild(s);
  }catch(err){
    fail("Something went wrong compiling the app.", err && err.message);
  }
})();
</script>
</body>
</html>
