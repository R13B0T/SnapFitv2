function PostSessionChat({session,debrief,coach,onClarified,onExclude}){
  const [open,setOpen]=useState(false), [messages,setMessages]=useState([]), [input,setInput]=useState("");
  const [busy,setBusy]=useState(false), [stream,setStream]=useState(""), [error,setError]=useState("");
  const abortRef=useRef(null), endRef=useRef(null);
  useEffect(()=>()=>abortRef.current?.abort(),[]);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[messages.length,stream]);
  async function send(){
    const content=input.trim(); if(!content||busy) return;
    const next=[...messages,{role:"user",content}];
    setInput(""); setError(""); setStream(""); setMessages(next); setBusy(true);
    const ctrl=new AbortController(); abortRef.current=ctrl;
    try{
      const full=await coach.postSessionChatStream({session,debrief,messages:next,onDelta:(_d,acc)=>setStream(acc),signal:ctrl.signal});
      setMessages([...next,{role:"assistant",content:full}]);
      onClarified?.(content,full);
    }catch(e){ if(e.name!=="AbortError") setError(e.kind==="auth"?"The saved key was rejected. Check it once in Settings.":e.message||"Couldn't reach the coach."); }
    finally{ setBusy(false);setStream("");abortRef.current=null; }
  }
  return (<Card accent={C.blue} style={{marginBottom:12}}>
    <button onClick={()=>setOpen(v=>!v)} aria-expanded={open} style={{width:"100%",border:"none",background:"transparent",padding:0,
      color:C.text,cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",gap:10}}>
      <div><div style={{fontSize:"calc(.78rem * var(--ts, 1))",fontWeight:700}}>Question or correct this review</div>
        <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.faint,marginTop:3,lineHeight:1.5}}>Explain an abnormal set before it becomes a coaching assumption.</div></div>
      <span style={{color:C.blue}}>{open?"HIDE ▴":"OPEN ▾"}</span>
    </button>
    {open&&<div style={{marginTop:12,borderTop:`1px solid ${C.lineSoft}`,paddingTop:10}}>
      {!messages.length&&<div style={{fontSize:"calc(.69rem * var(--ts, 1))",color:C.faint,lineHeight:1.6,marginBottom:10}}>
        For example: “The last set was low because the machine was occupied, not because the weight was too heavy.” This sends only this workout, its review and the last six messages.</div>}
      <div style={{maxHeight:300,overflowY:"auto"}}>
        {messages.map((m,i)=><div key={i} style={{marginBottom:8,padding:"8px 10px",borderRadius:9,background:m.role==="user"?tint(C.red,0x14):C.raised}}>
          {m.role==="user"?<div style={{fontSize:"calc(.72rem * var(--ts, 1))",whiteSpace:"pre-wrap"}}>{m.content}</div>:<Markdown text={m.content}/>}</div>)}
        {stream&&<div style={{padding:"8px 10px",borderRadius:9,background:C.raised}}><Markdown text={stream}/></div>}
        {busy&&!stream&&<div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.ghost}}><Spinner size={12}/> Thinking…</div>}
        {error&&<div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.red,marginTop:7}}>{error}</div>}
        <div ref={endRef}/>
      </div>
      <ChatComposer value={input} onChange={e=>setInput(e.target.value)} onSend={send} busy={busy}
        onStop={()=>abortRef.current?.abort()} placeholder="Clarify what happened…" layer={180}/>
      <div style={{borderTop:`1px solid ${C.lineSoft}`,marginTop:10,paddingTop:10}}>
        <Btn kind={session.excludedFromProgression?"green":"ghost"} size="sm" full disabled={session.excludedFromProgression} onClick={onExclude}>
          {session.excludedFromProgression?"✓ LOAD CHANGES IGNORED":"KEEP LOG, IGNORE LOAD CHANGES"}</Btn>
        <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,lineHeight:1.5,marginTop:6}}>Use this only when the session was abnormal or logged incorrectly. The workout stays in your history, but its weights will not drive the next prescription.</div>
      </div>
    </div>}
  </Card>);
}

function DebriefView({debrief, loading, onDone, aiOn, session, coach, onClarified,onExclude}){
  if(loading) return (<div style={{paddingTop:80,textAlign:"center"}}>
    <div style={{display:"inline-flex",flexDirection:"column",alignItems:"center",gap:14}}>
      <Spinner size={28}/>
      <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.2rem",color:C.dim,letterSpacing:".08em"}}>
        {aiOn?"YOUR COACH IS REVIEWING IT":"CRUNCHING THE NUMBERS"}</div>
    </div></div>);
  if(!debrief) return null;

  return (<div className="fade" style={{paddingTop:8,paddingBottom:20}}>
    <div style={{textAlign:"center",marginBottom:20}}>
      <div style={{fontSize:"calc(2.4rem * var(--ts, 1))",marginBottom:8}}>✅</div>
      <h1 style={{fontSize:"2rem",color:C.text,lineHeight:1.1,marginBottom:8}}>SESSION DONE</h1>
      <div style={{fontSize:"calc(.84rem * var(--ts, 1))",color:C.dim,lineHeight:1.6,maxWidth:400,margin:"0 auto"}}>{debrief.headline}</div>
    </div>

    {debrief.stats && (<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:16}}>
      {[["Volume",`${(debrief.stats.volume/1000).toFixed(1)}t`,C.red],
        ["Exercises",debrief.stats.exercises,C.blue],
        ["Sets",debrief.stats.sets,C.green]].map(([l,v,col])=>(
        <Card key={l} style={{padding:"13px 10px",textAlign:"center"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.6rem",color:col,lineHeight:1}}>{v}</div>
          <div style={{fontSize:"calc(.57rem * var(--ts, 1))",color:C.ghost,marginTop:3,letterSpacing:".06em"}}>{l.toUpperCase()}</div>
        </Card>))}
    </div>)}

    <Card style={{marginBottom:12}}>
      <Markdown text={debrief.body}/>
      <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
        {debrief.source==="ai" && <Chip color={C.green}>🤖 written for you</Chip>}
        <SpeakButton text={debrief.voiceSummary || `${debrief.headline}. ${debrief.body}. Next session: ${debrief.nextFocus||""}`}/>
      </div>
    </Card>

    {debrief.nextFocus && (<Card accent={C.yellow} style={{marginBottom:12}}>
      <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.yellow,fontWeight:700,letterSpacing:".08em",marginBottom:5}}>NEXT SESSION</div>
      <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.dim,lineHeight:1.65}}>{debrief.nextFocus}</div>
    </Card>)}

    {aiOn&&session&&<PostSessionChat session={session} debrief={debrief} coach={coach} onClarified={onClarified} onExclude={onExclude}/>}

    <StretchRoutine stretches={debrief.stretches} defaultOpen/>

    {debrief.rows?.length>0 && (<Card style={{marginBottom:16,padding:0,overflow:"hidden"}}>
      <div style={{padding:"12px 14px 8px",fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".08em"}}>
        WHAT MOVES NEXT TIME</div>
      {debrief.rows.map((r,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 14px",
          borderTop:`1px solid ${C.lineSoft}`}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</div>
            <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,marginTop:1}}>
              working {r.weight}kg · {r.workingSets||r.sets} top-load set{(r.workingSets||r.sets)===1?"":"s"} · avg {r.avg} reps</div>
          </div>
          <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:r.dec.color,textAlign:"right",flexShrink:0,maxWidth:130,lineHeight:1.4}}>
            {r.weight}kg → {r.nextWeight}kg
          </div>
        </div>))}
    </Card>)}

    <Btn size="lg" full onClick={onDone}>DONE</Btn>
  </div>);
}

function PlanView({state, onReplan, replanning, aiOn, onAddBonus, currentSession, onSetWeekTarget,
                   onSetCurrentWeek,onClearCurrentWeek}){
  const b = state.block;
  const prog = blockProgress(state);
  const [confirm,setConfirm] = useState(false);
  const [weekDraft,setWeekDraft] = useState(prog?.week||1);
  useEffect(()=>setWeekDraft(prog?.week||1),[b?.id,prog?.week]);

  if(!b) return (<Empty icon="🧭" title="No block yet"
    body="Your training block is the multi-week plan that turns your goal into sessions. Set a goal to get one."/>);

  const split = SPLITS[prog.dpw] || SPLITS[3];
  const normalTarget=clamp(Number(state.profile.daysPerWeek)||3,2,5);
  const weekIsCustom=prog.dpw!==normalTarget;
  let weekCursor = 0;

  return (<div className="fade" style={{paddingTop:8,paddingBottom:20}}>
    <SectionTitle sub={`${prog.done} block sessions done${prog.bonusDone?` · ${prog.bonusDone} added extra`:""} · ${prog.dpw} per week`}>YOUR BLOCK</SectionTitle>

    {aiOn && b.source!=="ai" && <Card accent={C.yellow} style={{marginBottom:14}}>
      <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.yellow,fontWeight:800,letterSpacing:".08em",marginBottom:5}}>
        THIS BLOCK IS NOT AI-GENERATED
      </div>
      <div style={{fontSize:"calc(.71rem * var(--ts, 1))",color:C.faint,lineHeight:1.65,marginBottom:10}}>
        It is the safe built-in template. It still uses your goal, schedule and logged working weights,
        but an AI coach did not interpret your journey when this block was created. Reconnect, then retry
        to build an AI block from your whole-journey summary and recent sessions.
      </div>
      <Btn kind="solid" size="sm" onClick={()=>setConfirm(true)} disabled={replanning}>
        {replanning?"RETRYING…":"RETRY WITH AI"}
      </Btn>
    </Card>}

    <Card accent={C.red} style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:10}}>
        <div style={{minWidth:0}}>
          <div style={{fontSize:"calc(.95rem * var(--ts, 1))",color:C.text,fontWeight:700,lineHeight:1.3}}>{b.name}</div>
          <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,marginTop:3}}>
            Started {b.startedAt} · {b.source==="ai"?"written for you":"built-in template"}
          </div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.9rem",color:C.red,lineHeight:1}}>{prog.pct}%</div>
          <div style={{fontSize:"calc(.55rem * var(--ts, 1))",color:C.ghost}}>COMPLETE</div>
        </div>
      </div>
      <div style={{height:5,background:C.lineSoft,borderRadius:3,overflow:"hidden",marginBottom:10}}>
        <div style={{height:"100%",width:`${prog.pct}%`,background:`linear-gradient(90deg,${C.red},${C.redSoft})`,borderRadius:3}}/>
      </div>
      {b.rationale && <div style={{fontSize:"calc(.75rem * var(--ts, 1))",color:C.faint,lineHeight:1.7}}>{b.rationale}</div>}
    </Card>

    <Card accent={C.purple} style={{marginBottom:16}}>
      <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.purple,fontWeight:700,letterSpacing:".08em",marginBottom:6}}>RIGHT NOW</div>
      <div style={{fontSize:"calc(1rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:4}}>
        Week {prog.week} of {prog.total} · {prog.phase.name}
      </div>
      <div style={{fontSize:"calc(.75rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,marginBottom:10}}>{prog.phase.intent}</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <Chip color={C.blue}>{prog.phase.sets} sets</Chip>
        <Chip color={C.green}>{prog.phase.repRange[0]}–{prog.phase.repRange[1]} reps</Chip>
        <Chip color={C.yellow}>RPE ~{prog.phase.rpe}</Chip>
        <Chip color={C.faint}>{prog.phase.restMult>=1.2?"long rests":prog.phase.restMult<=0.85?"short rests":"normal rests"}</Chip>
      </div>
    </Card>

    <Card accent={weekIsCustom?C.orange:C.blue} style={{marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7,flexWrap:"wrap"}}>
        <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:weekIsCustom?C.orange:C.blue,fontWeight:700,letterSpacing:".08em"}}>
          CUSTOMISE WEEK {prog.week}
        </div>
        {weekIsCustom && <Chip color={C.orange}>ONE-WEEK OVERRIDE</Chip>}
      </div>
      <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.faint,lineHeight:1.65,marginBottom:11}}>
        Change only this block week's number of sessions. Your usual {normalTarget}-session schedule,
        phase, history and following weeks stay unchanged.
      </div>
      <Choice cols={4} className="week-session-choice" value={prog.dpw} onChange={onSetWeekTarget}
        options={[2,3,4,5].map(n=>({value:n,label:`${n} sessions`}))}/>
      {weekIsCustom && <Btn kind="ghost" size="sm" full style={{marginTop:9}} onClick={()=>onSetWeekTarget(normalTarget)}>
        RESET WEEK {prog.week} TO {normalTarget} SESSIONS
      </Btn>}
      <div style={{borderTop:`1px solid ${C.lineSoft}`,marginTop:13,paddingTop:12}}>
        <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:6,flexWrap:"wrap"}}>
          <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.orange,fontWeight:700,letterSpacing:".08em"}}>
            CURRENT BLOCK WEEK FAILSAFE
          </div>
          {b.weekFloor!=null && <Chip color={C.orange}>WEEK {b.weekFloor} LOCKED</Chip>}
        </div>
        <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,lineHeight:1.55,marginBottom:9}}>
          Choose the week you are actually in, then lock it in. The lock survives reloads and prevents
          earlier incomplete weeks pulling the plan backwards. It does not invent workouts or change logged dates;
          completing this week's target still advances the plan normally.
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <select value={weekDraft} onChange={e=>setWeekDraft(Number(e.target.value))}
            style={{...inputStyle,appearance:"auto",flex:1}}>
            {Array.from({length:b.totalWeeks||1},(_,i)=><option key={i+1} value={i+1}>Week {i+1}</option>)}
          </select>
          <Btn kind="solid" size="sm" disabled={Number(b.weekFloor)===Number(weekDraft)}
            onClick={()=>onSetCurrentWeek(Number(weekDraft))}>
            {Number(b.weekFloor)===Number(weekDraft)?`WEEK ${weekDraft} LOCKED`:`LOCK IN WEEK ${weekDraft}`}
          </Btn>
          {b.weekFloor!=null && <Btn kind="ghost" size="sm" onClick={onClearCurrentWeek}>UNLOCK</Btn>}
        </div>
      </div>
    </Card>

    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:10}}>THE WHOLE BLOCK</div>
    <div style={{marginBottom:18}}>
      {b.phases.map((p,i)=>{
        const from = weekCursor+1, to = weekCursor+p.weeks;
        weekCursor = to;
        const current = prog.week>=from && prog.week<=to;
        const past = prog.week>to;
        const isDeload = /deload/i.test(p.name);
        return (<div key={i} style={{display:"flex",gap:11,marginBottom:2}}>

    <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:10}}>YOUR WEEKLY SPLIT</div>

          <div style={{display:"flex",alignItems:"center",gap:9}}>

              <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>

      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7,flexWrap:"wrap"}}>
        <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.green,fontWeight:700,letterSpacing:".09em"}}>

        targets and progression and moves the <strong style={{color:C.text}}>NEXT</strong> marker normally,
        without changing this week's {prog.dpw}-session target.

      <Btn kind={currentSession?"solid":"green"} size="md" full onClick={onAddBonus}>

function Sparkline({points, color=C.red, height=48}){
  if(!points || points.length<2) return null;
  const vals = points.map(p=>p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1;
  const W = 300, H = height;
  const d = points.map((p,i)=>{
    const x = (i/(points.length-1))*W;
    const y = H - ((p.v-min)/span)*(H-8) - 4;
    return `${i?"L":"M"}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return (<svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:"100%",height,display:"block"}}>
    <path d={`${d} L${W},${H} L0,${H} Z`} fill={`${tint(color,0x18)}`}/>
    <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
  </svg>);
}

function GoalView({state, setState, review, reviewLoading, onReview, aiOn}){
  const [wt,setWt] = useState("");
  const [editing,setEditing] = useState(false);
  const [draft,setDraft] = useState(state.goal||{});
  const g = state.goal;
  const meta = g ? GOAL_BY_ID[g.type] : null;

  const body = state.bodyLog.slice().sort((a,b)=>a.date<b.date?-1:1);
  const latest = body[body.length-1];
  const start = g?.startValue ? Number(g.startValue) : (body[0]?.weightKg);
  const target = g?.targetValue ? Number(g.targetValue) : null;
  const current = latest?.weightKg ?? start;

  let pct = null, delta = null;
  if(start!=null && target!=null && current!=null && target!==start){
    delta = Math.round((current-start)*10)/10;
    pct = clamp(Math.round(((current-start)/(target-start))*100), 0, 100);
  }
  const daysLeft = g?.targetDate ? daysBetween(todayISO(), g.targetDate) : null;
  let paceDaysLeft = null, paceDate = null;
  if(pct===100){
    paceDaysLeft = 0;
    paceDate = todayISO();
  } else if(pct>0 && body.length>=2){
    const elapsed = daysBetween(body[0].date, latest.date);
    if(elapsed>0){
      paceDaysLeft = Math.max(1, Math.round(elapsed * (100-pct) / pct));
      paceDate = addLocalDays(todayISO(), paceDaysLeft);
    }
  }

  function addWeight(){
    const v = parseFloat(wt);
    if(!v || v<=0) return;
    setState(s=>({...s, bodyLog:[...s.bodyLog.filter(b=>b.date!==todayISO()), {date:todayISO(), weightKg:v}]}));
    setWt("");
  }

  if(!g) return (<Empty icon="🎯" title="No goal set"
    body="A goal is what everything else hangs off. Set one in Settings and the coach will build a block toward it."/>);

  return (<div className="fade" style={{paddingTop:8,paddingBottom:20}}>
    <SectionTitle sub={g.why ? `"${g.why}"` : "Everything in the plan serves this."}
      right={<Btn kind="ghost" size="sm" onClick={()=>{setDraft(g); setEditing(true);}}>Edit</Btn>}>
      YOUR GOAL
    </SectionTitle>

    <Card accent={C.red} style={{marginBottom:14}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <div style={{fontSize:"calc(1.6rem * var(--ts, 1))"}}>{meta?.icon}</div>
        <div style={{minWidth:0,flex:1}}>
          <div style={{fontSize:"calc(1.05rem * var(--ts, 1))",color:C.text,fontWeight:700}}>{meta?.label}</div>
          {target!=null && <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,marginTop:2}}>
            {start!=null?`${start} → `:""}{target} · {meta?.metric}
          </div>}
        </div>
        {daysLeft!=null && (<div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.5rem",
            color:daysLeft<0?C.red:daysLeft<14?C.yellow:C.text,lineHeight:1}}>
            {daysLeft<0?"—":daysLeft}</div>
          <div style={{fontSize:"calc(.54rem * var(--ts, 1))",color:C.ghost}}>{daysLeft<0?"PAST DUE":"DAYS LEFT"}</div>
        </div>)}
      </div>

      {pct!=null ? (<>
        <div style={{height:6,background:C.lineSoft,borderRadius:3,overflow:"hidden",marginBottom:7}}>
          <div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${C.red},${C.green})`,borderRadius:3,transition:"width .4s"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:"calc(.66rem * var(--ts, 1))",color:C.faint}}>
          <span>{pct}% of the way there</span>
          <span style={{color:delta>0?C.green:delta<0?C.blue:C.faint}}>
            {delta>0?"+":""}{delta} so far</span>
        </div>
        <div style={{marginTop:12,paddingTop:11,borderTop:`1px solid ${C.lineSoft}`,
          display:"flex",justifyContent:"space-between",gap:12,alignItems:"center"}}>
          <div>
            <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".07em"}}>
              ESTIMATE AT CURRENT PACE</div>
            <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,marginTop:3,lineHeight:1.5}}>
              {paceDaysLeft!=null
                ? (paceDaysLeft===0 ? "Target reached from the current log." : `Around ${paceDate}, if the logged trend continues.`)
                : "Needs at least two dated logs and some movement toward the target."}
            </div>
          </div>
          {paceDaysLeft!=null && <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.45rem",color:paceDaysLeft===0?C.green:C.blue,lineHeight:1}}>
              {paceDaysLeft}</div>
            <div style={{fontSize:"calc(.52rem * var(--ts, 1))",color:C.ghost}}>DAYS EST.</div>
          </div>}
        </div>
      </>) : (
        <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.ghost,lineHeight:1.6}}>
          Add a target and a starting point to track progress against it. Log your weight below and the
          chart fills in as you go.
        </div>)}
    </Card>

    {/* body weight */}
    <Card style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".08em"}}>BODY WEIGHT</div>
        {latest && <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.faint}}>last logged {latest.date}</div>}
      </div>
      {body.length>=2
        ? <Sparkline points={body.map(b=>({v:b.weightKg}))} color={C.blue}/>
        : <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.ghost,lineHeight:1.6,marginBottom:10}}>
            Log it once a week, same time of day. Day-to-day swings are mostly water — the trend over
            weeks is the only bit that means anything.
          </div>}
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <Input type="number" inputMode="decimal" step="0.1" placeholder={latest?`${latest.weightKg} kg`:"Weight in kg"}
          value={wt} onChange={e=>setWt(e.target.value)} style={{flex:1}}/>
        <Btn size="md" onClick={addWeight} disabled={!wt}>LOG</Btn>
      </div>
      {body.length>=2 && (<div style={{display:"flex",justifyContent:"space-between",marginTop:9,fontSize:"calc(.64rem * var(--ts, 1))",color:C.faint}}>
        <span>{body[0].weightKg} kg on {body[0].date}</span>
        <span style={{color:C.text,fontWeight:600}}>{latest.weightKg} kg now</span>
      </div>)}
    </Card>

    {/* weekly review */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em"}}>WEEKLY REVIEW</div>
      <Btn kind="ghost" size="sm" onClick={onReview} disabled={reviewLoading}>
        {reviewLoading ? <><Spinner size={11}/> Writing</> : review ? "Refresh" : "Get it"}
      </Btn>
    </div>
    {review ? (<Card style={{marginBottom:14}}>
      <div style={{fontSize:"calc(.88rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:8}}>{review.headline}</div>
      {review.adherence!=null && (<div style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,marginBottom:4}}>
          <span>{review.sessions} of {review.target} sessions this week</span><span>{review.adherence}%</span>
        </div>
        <div style={{height:4,background:C.lineSoft,borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${review.adherence}%`,
            background:review.adherence>=80?C.green:review.adherence>=50?C.yellow:C.orange,borderRadius:2}}/>
        </div>
      </div>)}
      <Markdown text={review.body}/>
      <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10,flexWrap:"wrap"}}>
        {review.source==="ai" && <Chip color={C.green}>🤖 written for you</Chip>}
        <SpeakButton text={review.voiceSummary || `${review.headline}. ${review.body}`}/>
      </div>
    </Card>) : (
      <Card style={{marginBottom:14,padding:16}}>
        <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.ghost,lineHeight:1.7}}>
          A read on your week — attendance, which lifts are climbing, which have stalled, and the one
          thing worth changing. {aiOn?"":"Add an API key in Settings for a written review; the built-in one still gives you the numbers."}
        </div>
      </Card>)}

    {editing && <Sheet title="Edit your goal" onClose={()=>setEditing(false)}>
      <Field label="Goal">
        <Choice cols={1} value={draft.type} onChange={v=>setDraft(d=>({...d,type:v}))}
          options={GOAL_TYPES.map(gt=>({value:gt.id,label:gt.label,icon:gt.icon,sub:gt.blurb}))}/>
      </Field>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <Field label="Starting point"><Input type="number" inputMode="decimal" value={draft.startValue||""}
          onChange={e=>setDraft(d=>({...d,startValue:e.target.value}))}/></Field>
        <Field label="Target"><Input type="number" inputMode="decimal" value={draft.targetValue||""}
          onChange={e=>setDraft(d=>({...d,targetValue:e.target.value}))}/></Field>
      </div>
      <Field label="By when"><Input type="date" value={draft.targetDate||""}
        onChange={e=>setDraft(d=>({...d,targetDate:e.target.value}))}/></Field>
      <Field label="Why it matters"><TextArea value={draft.why||""}
        onChange={e=>setDraft(d=>({...d,why:e.target.value}))}/></Field>
      <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.ghost,lineHeight:1.6,marginBottom:14}}>
        Changing the goal type doesn't rebuild your block automatically — do that from the Plan tab when you're ready.
      </div>
      <Btn size="lg" full onClick={()=>{ setState(s=>({...s,goal:draft})); setEditing(false); }}>SAVE GOAL</Btn>
    </Sheet>}
  </div>);
}

function LearnView({state, setState, onHide}){
  const [open,setOpen] = useState(null);
  const [answer,setAnswer] = useState(null);
  const read = new Set(state.learn.read||[]);
  const advancedOn = state.uiPrefs?.showAdvancedLearn ?? DEFAULT_UI_PREFS.showAdvancedLearn;
  const visibleTopics = LEARN.filter(t=>advancedOn || t.level!=="advanced");
  const visibleRead = visibleTopics.filter(t=>read.has(t.id)).length;
  const tags = [...new Set(visibleTopics.map(t=>t.tag))];

  function markRead(id){
    setState(s=>({...s, learn:{...s.learn, read:[...new Set([...(s.learn.read||[]), id])]}}));
  }
  function recordQuiz(id, correct){
    setState(s=>({...s, learn:{...s.learn, quiz:{...(s.learn.quiz||{}), [id]:correct}}}));
  }

  const topic = open ? LEARN_BY_ID[open] : null;

  return (<div className="fade" style={{paddingTop:8,paddingBottom:20}}>
    <SectionTitle right={<Btn kind="ghost" size="sm" onClick={onHide}>Hide all learning</Btn>} sub={advancedOn
      ? "Fundamentals plus the optional advanced layer. Read them in any order."
      : "The practical fundamentals behind the plan. Advanced topics can be enabled in Settings."}>LEARN</SectionTitle>

    <Card style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div style={{fontSize:"calc(.72rem * var(--ts, 1))",color:C.dim}}>
          <strong style={{color:C.text}}>{visibleRead}</strong> of {visibleTopics.length} topics covered
        </div>
        <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint}}>{Math.round((visibleRead/visibleTopics.length)*100)}%</div>
      </div>
      <div style={{height:5,background:C.lineSoft,borderRadius:3,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${(visibleRead/visibleTopics.length)*100}%`,
          background:`linear-gradient(90deg,${C.blue},${C.green})`,borderRadius:3,transition:"width .4s"}}/>
      </div>
      {visibleRead===visibleTopics.length && <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.green,marginTop:9,lineHeight:1.6}}>
        You've read every visible topic. That's genuinely more training theory than most people in the gym have.</div>}
    </Card>

    {tags.map(tag=>(
      <div key={tag} style={{marginBottom:16}}>
        <div style={{fontSize:"calc(.6rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:8}}>{tag.toUpperCase()}</div>
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {visibleTopics.filter(t=>t.tag===tag).map(t=>{
            const isRead = read.has(t.id);
            return (<Card key={t.id} onClick={()=>{setOpen(t.id); setAnswer(null);}}
              style={{padding:"13px 14px",borderColor:isRead?`${tint(C.green,0x30)}`:C.lineSoft}}>
              <div style={{display:"flex",gap:11,alignItems:"flex-start"}}>
                <div style={{width:20,height:20,borderRadius:"50%",flexShrink:0,marginTop:2,
                  border:`1.5px solid ${isRead?C.green:C.ghost}`, background:isRead?`${tint(C.green,0x22)}`:"transparent",
                  display:"flex",alignItems:"center",justifyContent:"center",fontSize:"calc(.6rem * var(--ts, 1))",color:C.green}}>
                  {isRead?"✓":""}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:"calc(.84rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:3}}>{t.title}</div>
                  <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,lineHeight:1.55}}>{t.hook}</div>
                </div>
                <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,flexShrink:0,marginTop:3}}>{t.mins} min</div>
              </div>
            </Card>);
          })}
        </div>
      </div>))}

    {topic && (<Sheet title={topic.title} sub={`${topic.tag} · ${topic.mins} min read`} onClose={()=>{markRead(topic.id); setOpen(null);}}>
      <Markdown text={topic.body} style={{fontSize:"calc(.84rem * var(--ts, 1))",color:C.dim}}/>

      {topic.check && (<div style={{marginTop:20,background:C.card,border:`1px solid ${C.lineSoft}`,borderRadius:14,padding:16}}>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.yellow,fontWeight:700,letterSpacing:".08em",marginBottom:8}}>QUICK CHECK</div>
        <div style={{fontSize:"calc(.82rem * var(--ts, 1))",color:C.text,lineHeight:1.6,marginBottom:12}}>{topic.check.q}</div>
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {topic.check.a.map((a,i)=>{
            const picked = answer===i;
            const right = i===topic.check.correct;
            const show = answer!=null;
            const col = show ? (right?C.green : picked?C.red : C.line) : C.line;
            return (<button key={i} disabled={show} onClick={()=>{setAnswer(i); recordQuiz(topic.id, right);}} style={{
              padding:"11px 13px",borderRadius:11,textAlign:"left",cursor:show?"default":"pointer",
              border:`1.5px solid ${col}`, background: show&&right ? `${tint(C.green,0x12)}` : picked ? `${tint(C.red,0x12)}` : C.raised,
              color: show&&(right||picked) ? C.text : C.dim, fontSize:"calc(.76rem * var(--ts, 1))",lineHeight:1.5}}>
              {show && right && <span style={{color:C.green,marginRight:6}}>✓</span>}
              {show && picked && !right && <span style={{color:C.red,marginRight:6}}>✕</span>}
              {a}
            </button>);
          })}
        </div>
        {answer!=null && (<div className="fade" style={{marginTop:12,fontSize:"calc(.75rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,
          background:C.raised,borderRadius:10,padding:"11px 12px"}}>{topic.check.why}</div>)}
      </div>)}

      <Btn size="lg" full style={{marginTop:18}} onClick={()=>{markRead(topic.id); setOpen(null);}}>
        {read.has(topic.id)?"CLOSE":"MARK AS READ ✓"}
      </Btn>
    </Sheet>)}
  </div>);
}

const CHAT_CONTEXT_MESSAGES = 8;

/* On iOS the software keyboard can shrink only the visual viewport while the
   layout viewport (and a normal bottom composer) stays behind it. Track the
   visual viewport and pin the composer immediately above the keyboard. */
function useKeyboardViewport(){
  const read = ()=>{
    const v = typeof window!=="undefined" ? window.visualViewport : null;
    if(!v) return {open:false,top:0,left:0,width:0};
    const hidden = Math.max(0, window.innerHeight-v.height-v.offsetTop);
    return {open:hidden>100, top:v.offsetTop+v.height, left:v.offsetLeft, width:v.width};
  };
  const [viewport,setViewport] = useState(read);
  useEffect(()=>{
    const v=window.visualViewport;
    if(!v) return;
    const sync=()=>setViewport(read());
    v.addEventListener("resize",sync); v.addEventListener("scroll",sync);
    window.addEventListener("orientationchange",sync);
    return ()=>{ v.removeEventListener("resize",sync); v.removeEventListener("scroll",sync);
      window.removeEventListener("orientationchange",sync); };
  },[]);
  return viewport;
}

function ChatComposer({value,onChange,onSend,busy,onStop,placeholder="Ask your coach…",layer=140,onFocus}){
  const viewport = useKeyboardViewport();
  const boxRef = useRef(null);
  const [height,setHeight] = useState(70);
  useEffect(()=>{
    const box=boxRef.current;
    if(!box) return;
    const measure=()=>setHeight(Math.ceil(box.getBoundingClientRect().height));
    measure();
    const ro=typeof ResizeObserver!=="undefined" ? new ResizeObserver(measure) : null;
    ro?.observe(box); return ()=>ro?.disconnect();
  },[value,busy]);
  const fixed = viewport.open;
  const outer = fixed ? {
    position:"fixed",left:viewport.left,width:viewport.width,
    top:Math.max(0,viewport.top-height),zIndex:layer,background:C.bg,
    borderTop:`1px solid ${C.lineSoft}`,padding:"9px 10px calc(9px + env(safe-area-inset-bottom))",
    boxShadow:"0 -8px 24px rgba(0,0,0,.28)",
  } : {paddingTop:10,borderTop:`1px solid ${C.lineSoft}`,background:C.bg};
  return (<>
    {fixed && <div aria-hidden="true" style={{height}}/>}
    <div ref={boxRef} style={outer}>
      <div style={{display:"flex",gap:8,maxWidth:620,margin:"0 auto",alignItems:"flex-end"}}>
        <TextArea value={value} onChange={onChange} placeholder={placeholder}
          onFocus={e=>{ onFocus?.(); setTimeout(()=>e.currentTarget.scrollIntoView({block:"center"}),80); }}
          onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); onSend(); } }}
          style={{minHeight:46,maxHeight:110,flex:1,padding:"12px 13px"}}/>
        {busy
          ? <Btn kind="ghost" size="md" onClick={onStop} aria-label="Stop response" style={{width:52,padding:0}}>■</Btn>
          : <Btn size="md" onClick={onSend} disabled={!value.trim()} aria-label="Send message" style={{width:52,padding:0}}>→</Btn>}
      </div>
    </div>
  </>);
}

function SetCoachSheet({exercise,logs,setIndex,coach,onClose}){

  const abortRef=useRef(null), endRef=useRef(null);
  useEffect(()=>()=>abortRef.current?.abort(),[]);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[messages.length,stream]);
  async function send(){
    const content=input.trim(); if(!content||busy) return;
    const next=[...messages,{role:"user",content}];
    setInput(""); setError(""); setStream(""); setMessages(next); setBusy(true);
    const ctrl=new AbortController(); abortRef.current=ctrl;
    try{
      const full=await coach.setChatStream({exercise,logs,setIndex,
        messages:next.slice(-6),onDelta:(_d,acc)=>setStream(acc),signal:ctrl.signal});
      setMessages([...next,{role:"assistant",content:full}]);

    </div>
    <div style={{height:"min(44vh,360px)",overflowY:"auto",paddingRight:2}}>

        <div style={{maxWidth:"88%",padding:"9px 11px",borderRadius:m.role==="user"?"12px 12px 3px 12px":"12px 12px 12px 3px",
          background:m.role==="user"?tint(C.red,0x18):C.card,border:`1px solid ${C.lineSoft}`}}>
          {m.role==="user"?<div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.text,whiteSpace:"pre-wrap"}}>{m.content}</div>

        <Markdown text={stream} style={{fontSize:"calc(.76rem * var(--ts, 1))"}}/></div>}
      {busy&&!stream&&<div style={{display:"flex",gap:7,color:C.ghost,fontSize:"calc(.68rem * var(--ts, 1))"}}><Spinner size={12}/> Thinking…</div>}
      {error&&<div style={{color:C.red,fontSize:"calc(.68rem * var(--ts, 1))",marginTop:8}}>{error}</div>}

      onFocus={()=>endRef.current?.scrollIntoView({block:"end"})}/>
  </Sheet>);
}

function ChatView({state, setState, coach, aiOn, onGoSettings}){
  const [input,setInput]   = useState("");
  const [busy,setBusy]     = useState(false);
  const [stream,setStream] = useState("");
  const [error,setError]   = useState("");
  const abortRef = useRef(null);
  const endRef   = useRef(null);
  const msgs = state.chat || [];

  useEffect(()=>{ endRef.current?.scrollIntoView({behavior:"smooth"}); },[msgs.length, stream]);

  async function send(text){
    const content = (text ?? input).trim();
    if(!content || busy) return;
    setInput(""); setError(""); setStream("");
    const next = [...msgs, {role:"user", content}];
    setState(s=>({...s, chat:next.slice(-40)}));
    setBusy(true);
    const ctrl = new AbortController();
    abortRef.current = ctrl;
    try{
      const full = await coach.chatStream({
        messages: next.slice(-CHAT_CONTEXT_MESSAGES).map(m=>({role:m.role, content:m.content})),
        onDelta: (_d,acc)=>setStream(acc),
        signal: ctrl.signal,
      });
      setState(s=>({...s, chat:[...next, {role:"assistant", content:full}].slice(-40)}));
    }catch(e){
      if(e.name!=="AbortError"){
        setError(e.kind==="auth" ? "Your API key was rejected. Check it in Settings."
               : e.kind==="rate" ? "Rate limited by the API. Give it a minute."
               : e.message || "Couldn't reach the coach.");
      }
    }finally{ setBusy(false); setStream(""); abortRef.current=null; }
  }

  function newChat(){
    abortRef.current?.abort();
    setInput(""); setStream(""); setError(""); setBusy(false);
    setState(s=>({...s,chat:[]}));
  }

  if(!aiOn) return (<div className="fade" style={{paddingTop:8}}>
    <SectionTitle sub="The one part that genuinely needs a key.">COACH</SectionTitle>
    <Card accent={C.red} style={{marginBottom:14}}>

      <div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.faint,lineHeight:1.75,marginBottom:14}}>
        Everything else in the app works without one. Chat can't — there's no way to answer
        "why has my squat stalled" from a lookup table. With a key, the coach can see your whole
        logged history and answer specifically.
      </div>
      <Btn size="md" full onClick={onGoSettings}>ADD A KEY IN SETTINGS →</Btn>
    </Card>
    <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.ghost,lineHeight:1.7}}>
      In the meantime, the <strong style={{color:C.dim}}>Learn</strong> tab covers the questions people
      ask most often — stalled lifts, how hard to train, why deloads exist.
    </div>
  </div>);

  return (<div className="fade" style={{display:"flex",flexDirection:"column",height:"100%",paddingTop:8}}>
    <SectionTitle sub="Knows your goal, block and logged history; sends only the last 8 chat messages."
      right={msgs.length>0 ? <Btn kind="ghost" size="sm" onClick={newChat}>New chat</Btn> : null}>
      COACH
    </SectionTitle>

    <div style={{flex:1,minHeight:0,overflowY:"auto",paddingBottom:8}}>
      {!msgs.length && !stream && (<div style={{paddingTop:8}}>
        <div style={{fontSize:"calc(.76rem * var(--ts, 1))",color:C.faint,lineHeight:1.7,marginBottom:16}}>
          Ask anything about your training. It has your numbers in front of it, so be specific and
          you'll get a specific answer. Start a new chat when you change topic to keep context and token use lean.
        </div>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,fontWeight:700,letterSpacing:".1em",marginBottom:9}}>TRY ASKING</div>
        <div style={{display:"flex",flexDirection:"column",gap:7}}>
          {OPENERS.map(o=>(<button key={o} onClick={()=>send(o)} style={{
            padding:"11px 13px",borderRadius:11,border:`1px solid ${C.line}`,background:C.card,
            color:C.dim,fontSize:"calc(.78rem * var(--ts, 1))",textAlign:"left",cursor:"pointer",lineHeight:1.5}}>{o}</button>))}
        </div>
      </div>)}

      {msgs.map((m,i)=>(
        <div key={i} style={{marginBottom:14,display:"flex",
          justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
          <div style={{maxWidth:"88%",
            background: m.role==="user" ? `${tint(C.red,0x18)}` : C.card,
            border:`1px solid ${m.role==="user"?tint(C.red,0x35):C.lineSoft}`,
            borderRadius: m.role==="user" ? "14px 14px 4px 14px" : "14px 14px 14px 4px",
            padding:"11px 13px"}}>
            {m.role==="user"
              ? <div style={{fontSize:"calc(.8rem * var(--ts, 1))",color:C.text,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{m.content}</div>
              : <Markdown text={m.content} style={{fontSize:"calc(.8rem * var(--ts, 1))"}}/>}
          </div>
        </div>))}

      {stream && (<div style={{marginBottom:14,display:"flex",justifyContent:"flex-start"}}>
        <div style={{maxWidth:"88%",background:C.card,border:`1px solid ${C.lineSoft}`,
          borderRadius:"14px 14px 14px 4px",padding:"11px 13px"}}>
          <Markdown text={stream} style={{fontSize:"calc(.8rem * var(--ts, 1))"}}/>
          <span style={{display:"inline-block",width:7,height:13,background:C.red,
            animation:"blink 1s infinite",verticalAlign:"text-bottom",marginLeft:2}}/>
        </div>
      </div>)}

      {busy && !stream && (<div style={{display:"flex",gap:8,alignItems:"center",color:C.ghost,
        fontSize:"calc(.72rem * var(--ts, 1))",marginBottom:14}}><Spinner size={13}/> Thinking…</div>)}

      {error && (<Card accent={C.red} style={{marginBottom:14,padding:12}}>
        <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.red,lineHeight:1.6}}>{error}</div></Card>)}

      <div ref={endRef}/>
    </div>

    <ChatComposer value={input} onChange={e=>setInput(e.target.value)} onSend={()=>send()} busy={busy}
      onStop={()=>abortRef.current?.abort()} onFocus={()=>endRef.current?.scrollIntoView({block:"end"})}/>
  </div>);
}

function csvEscape(v){ const s = String(v??""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }

function exportCSV(state){
  const rows = ["Date,Exercise,Station,Sets Logged,Sets Total,Avg Reps,Target Reps,Weight (kg),Day Type"];
  Object.entries(state.exerciseHistory||{}).forEach(([exId,entries])=>{
    const name = EX_NAME[exId] || exId.replace(/_/g," ");
    (entries||[]).forEach(e=>{
      rows.push([e.date, csvEscape(name), csvEscape(`#${e.station||"?"}`), e.setsLogged??"", e.totalSets??"",
        e.avgReps!=null?e.avgReps.toFixed(1):"", e.targetReps??"", e.weight??"", csvEscape(e.dayName||"")].join(","));
    });
  });
  const blob = new Blob([rows.join("\n")],{type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `snapfit-history-${todayISO()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function exportJSON(state, apiKey){
  const backup = {...state, apiKey:String(apiKey||"")};
  const blob = new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `snapfit-backup-${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
}

/* Validate a JSON backup before it's allowed anywhere near live data. Every
   rejection names the actual problem — "invalid file" tells you nothing when
   you're trying to work out whether your training history is recoverable. */
function inspectJSON(text){
  let raw;
  try{ raw = JSON.parse(text); }
  catch{ throw new Error("That isn't valid JSON. If you edited the file, a stray comma is the usual culprit."); }

  if(!raw || typeof raw !== "object" || Array.isArray(raw))
    throw new Error("That file contains JSON, but not a SnapFit backup — the top level should be an object.");
  if(raw.v == null)
    throw new Error("No version marker. That looks like a different app's export, not a SnapFit backup.");
  if(Number(raw.v) > 3)
    throw new Error(`That backup is from a newer version (v${raw.v}) than this app understands.`);
  if(raw.sessions != null && !Array.isArray(raw.sessions))
    throw new Error("The `sessions` field is corrupt — it should be a list.");
  if(raw.exerciseHistory != null && (typeof raw.exerciseHistory !== "object" || Array.isArray(raw.exerciseHistory)))
    throw new Error("The `exerciseHistory` field is corrupt — it should be an object keyed by exercise.");
  if(raw.weights != null && (typeof raw.weights !== "object" || Array.isArray(raw.weights)))
    throw new Error("The `weights` field is corrupt — it should be an object keyed by exercise.");
  if(Object.prototype.hasOwnProperty.call(raw,"apiKey") && typeof raw.apiKey !== "string")
    throw new Error("The `apiKey` field is corrupt — it should be text.");

  const hasApiKey = Object.prototype.hasOwnProperty.call(raw,"apiKey");
  const apiKey = hasApiKey && typeof raw.apiKey === "string" ? raw.apiKey.trim() : null;
  const stateRaw = {...raw};
  delete stateRaw.apiKey;               // keep the credential out of the main state blob
  const state = migrate(stateRaw);      // an older backup gains newer fields
  const dates = (state.sessions||[]).map(s=>s.date).filter(Boolean).sort();
  return {
    state,
    apiKey,
    summary:{
      goal: state.goal ? (GOAL_BY_ID[state.goal.type]?.label || state.goal.type) : "none set",
      sessions: (state.sessions||[]).length,
      exercises: Object.keys(state.exerciseHistory||{}).length,
      from: dates[0] || null,
      to: dates[dates.length-1] || null,
      block: state.block ? state.block.name : "none",
      apiKey: apiKey === null ? "not in this older backup" : apiKey ? "included" : "no key saved",
    },
  };
}

function parseCSVLine(row){
  const parts=[]; let inQ=false, cur="";
  for(let i=0;i<row.length;i++){
    const ch=row[i];
    if(ch==='"'){ if(inQ && row[i+1]==='"'){ cur+='"'; i++; } else inQ=!inQ; }
    else if(ch==="," && !inQ){ parts.push(cur); cur=""; }
    else cur+=ch;
  }
  parts.push(cur);
  return parts.map(p=>p.trim());
}

/* Accepts the v1 CSV shape unchanged, so v1 history imports straight in. */
function importCSV(text, state){
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) throw new Error("That file has no rows in it.");
  const reverse = {};
  Object.entries(EX_NAME).forEach(([id,n])=>{ reverse[n.toLowerCase()]=id; });

  const hist = {...(state.exerciseHistory||{})};
  const weights = {...(state.weights||{})};
  let imported = 0, skipped = 0;

  lines.slice(1).forEach(row=>{
    const p = parseCSVLine(row);
    const [date, exName, station, setsLogged, totalSets, avgReps, targetReps, weight, dayName] = p;
    if(!date || !exName){ skipped++; return; }
    const clean = exName.replace(/^"|"$/g,"").trim();
    const exId = reverse[clean.toLowerCase()] || clean.toLowerCase().replace(/[^a-z0-9]+/g,"_");
    const entry = {
      date,
      station: (station||"").replace(/[^0-9]/g,"") || null,
      setsLogged: parseInt(setsLogged)||0,
      totalSets: parseInt(totalSets)||0,
      avgReps: parseFloat(avgReps) || null,
      targetReps: parseInt(targetReps)||10,
      weight: parseFloat(weight)||0,
      dayName: dayName||"",
    };
    if(!hist[exId]) hist[exId]=[];
    if(!hist[exId].some(x=>x.date===entry.date && x.weight===entry.weight)){ hist[exId].push(entry); imported++; }
  });

  Object.entries(hist).forEach(([exId,entries])=>{
    entries.sort((a,b)=>a.date<b.date?-1:1);
    const last = entries[entries.length-1];
    if(!last) return;
    const ex = EX_BY_ID[exId];
    weights[exId] = {
      weight: last.weight,
      lastAvgReps: last.avgReps,
      lastTargetReps: last.targetReps,
      lastEffort: weights[exId]?.lastEffort || "good",
      inc: ex?.inc || 2.5,
      updated: last.date,
    };
  });

  return {hist, weights, imported, skipped};
}

function EquipmentLoadsView({state,setState}){
  const [targets,setTargets]=useState({});
  const stations=Object.keys(PLATE_LOADED_DEFAULTS).sort((a,b)=>Number(a)-Number(b));
  function update(station,patch){
    setState(s=>({...s,equipment:{...s.equipment,loads:{...(s.equipment.loads||{}),
      [station]:{...(s.equipment.loads?.[station]||{}),...patch}}}}));
  }
  function restore(station){
    setState(s=>{
      const loads={...(s.equipment.loads||{})}; delete loads[station];
      return {...s,equipment:{...s.equipment,loads}};
    });
  }
  return (<div>
    <Card accent={C.blue} style={{marginBottom:12}}>
      <div style={{fontSize:"calc(.84rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:6}}>
        Watagan Park plate-loaded machines
      </div>
      <div style={{fontSize:"calc(.71rem * var(--ts, 1))",color:C.faint,lineHeight:1.65}}>
        Starting resistance comes from official Hammer Strength / Life Fitness specifications where published.
        Correct anything that differs on the physical machine here; your saved value is what workout generation and
        plate calculations use. Snap's available plates default to 2.5, 5, 10 and 20 kg.
      </div>
    </Card>
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {stations.map(station=>{
        const cfg=plateLoadConfig(state,station), base=PLATE_LOADED_DEFAULTS[station];
        const target=targets[station]??"";
        const calc=target!==""?platePrescription(Number(target),cfg):null;
        const changed=!!state.equipment.loads?.[station];
        return (<Card key={station} accent={changed?C.orange:cfg.verified?C.green:C.yellow}>
          <div style={{display:"flex",gap:9,alignItems:"flex-start",marginBottom:11}}>
            <Chip color={C.blue}>#{station}</Chip>
            <div style={{flex:1,minWidth:0}}>
              <TextArea rows={2} value={cfg.model||""} onChange={e=>update(station,{model:e.target.value})}
                aria-label={`Station ${station} machine model`} style={{fontWeight:650,minHeight:58,

              <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:cfg.verified?C.green:C.yellow,marginTop:4}}>
                {changed?"YOUR SAVED VALUES":cfg.verified?"MANUFACTURER DEFAULT":"VERIFY ON MACHINE"}
              </div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <Field label="Starting resistance (kg)" hint={cfg.startKg==null?"Not published":"Machine only, before plates"}>
              <Input type="number" inputMode="decimal" step="0.1" value={cfg.startKg??""}
                placeholder="Check machine" onChange={e=>update(station,{startKg:e.target.value===""?null:Number(e.target.value)})}/>
            </Field>
            <Field label="Resistance applies to">
              <select value={cfg.mode} onChange={e=>update(station,{mode:e.target.value})}
                style={{...inputStyle,appearance:"auto"}}>
                <option value="per-arm">Each arm</option><option value="total">Whole machine</option>
              </select>
            </Field>
          </div>
          <Field label="Available plates (kg)" hint="Comma separated; calculations load the same plates on both sides.">
            <Input value={(cfg.plates||DEFAULT_PLATES_KG).join(", ")} onChange={e=>{
              const plates=e.target.value.split(",").map(x=>Number(x.trim())).filter(n=>Number.isFinite(n)&&n>0);
              if(plates.length) update(station,{plates:[...new Set(plates)].sort((a,b)=>a-b)});
