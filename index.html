  <script>
    /* Keep an update waiting until the user chooses to reload. This matters in
       a workout: silently replacing the page mid-set would be spectacularly
       unhelpful. React listens for this event and shows the update banner. */
    if('serviceWorker' in navigator){
      window.__snapfitUpdateWorker = null;
      window.__snapfitAnnounceUpdate = function(worker){
        if(!worker) return;
        window.__snapfitUpdateWorker = worker;
        window.dispatchEvent(new CustomEvent('snapfit-update-ready'));
      };
      navigator.serviceWorker.addEventListener('controllerchange',function(){
        if(window.__snapfitReloadForUpdate) window.location.reload();
      });
      window.addEventListener('load',function(){
        navigator.serviceWorker.register('./sw.js').then(function(reg){
          if(reg.waiting) window.__snapfitAnnounceUpdate(reg.waiting);
          reg.addEventListener('updatefound',function(){
            var worker=reg.installing;
            if(!worker) return;
            worker.addEventListener('statechange',function(){
              if(worker.state==='installed' && navigator.serviceWorker.controller){
                window.__snapfitAnnounceUpdate(worker);
              }
            });
          });
          reg.update().catch(function(){});
          document.addEventListener('visibilitychange',function(){
            if(document.visibilityState==='visible') reg.update().catch(function(){});
          });
        }).catch(function(){});
      });
    }
  </script>

  <!-- Resolve the theme BEFORE the stylesheet below paints. The app source is
       compiled in the browser by Babel, which takes a beat on ~5,000 lines, so
       leaving this to the app means a black flash on a light phone or a white one
       on a dark phone. Six lines here removes it entirely. -->
  <script>
    try{
      var t = localStorage.getItem("snapfit_v2_theme") || "system";
      var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    }catch(e){ document.documentElement.dataset.theme = "dark"; }
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- The palette. Lives here rather than in the app's stylesheet for the same
       reason as the script above: these have to be resolved at first paint.
       Dark is the base; light overrides. Every colour in the app is one of these
       via var(), so switching theme is one attribute on <html> and no re-render.

       Accents darken considerably in light mode because they have to: the dark
       theme's mint green measures 1.34:1 on off-white and the yellow 1.31:1 —
       invisible, not merely weak. The light values are all 5:1 or better. -->
  <style>
    :root{
      --c-bg:#0e0e0e; --c-surface:#141414; --c-card:#181818; --c-raised:#1e1e1e;
      --c-line:#262626; --c-lineSoft:#1c1c1c;
      --c-text:#f0f0f0; --c-dim:#8a8a8a; --c-faint:#5a5a5a; --c-ghost:#3a3a3a;
      --c-red:#e31837; --c-redSoft:#ff4d6a;
      --c-green:#69f0ae; --c-blue:#4fc3f7; --c-yellow:#ffd740; --c-orange:#ffa040; --c-purple:#a78bfa;
      --c-greenDeep:#2e8b57; --c-onGreen:#06210f;
      --c-scrim:rgba(0,0,0,.9); --c-scrimDeep:rgba(0,0,0,.92);
      /* Also gets form controls, scrollbars and native UI rendered for the right
         mode. Declaring it turned out to fix the ⚡ and 📋 nav icons too: without
         it Chromium rendered them as monochrome text glyphs in the nav's own dim
         grey — near-invisible on a dark bar — instead of as colour emoji. */
      color-scheme: dark;
    }
    :root[data-theme="light"]{
      --c-bg:#edeae5; --c-surface:#f4f2ee; --c-card:#f9f7f4; --c-raised:#e8e4dd;
      --c-line:#d5d0c8; --c-lineSoft:#e2ded7;
      /* faint and ghost are darker here than a straight inversion suggests.
         Measured, light's originals beat dark's for the same roles — but on a
         light background weak grey reads as *disabled* rather than as dim, and
         faint carries text people need, like the API-key warning. */
      --c-text:#2a2a28; --c-dim:#5f5c57; --c-faint:#6f6b64; --c-ghost:#8a867f;
      --c-red:#c2102b; --c-redSoft:#d92642;
      --c-green:#0f7a45; --c-blue:#0369a1; --c-yellow:#8a5a00; --c-orange:#a34e00; --c-purple:#6d28d9;
      --c-greenDeep:#0b5c34; --c-onGreen:#ffffff;
      --c-scrim:rgba(0,0,0,.5); --c-scrimDeep:rgba(0,0,0,.55);
      color-scheme: light;
    }
    html,body{margin:0;padding:0;background:var(--c-bg);height:100%;}
    body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  </style>

<!-- The app source. Compiled in the browser by the bootstrap at the foot of this

const {useState,useEffect,useRef,useMemo,useCallback} = React;

/* ═══════════════════════════════════════════════════════════════════════════
   THEME
   ═══════════════════════════════════════════════════════════════════════════ */

/* Every colour is a CSS custom property, defined for both themes in the <head>.

   These are strings that happen to be `var()` references, so all ~620 places
   that interpolate them into an inline style keep working untouched, and a theme
   change is one attribute on <html> with no React re-render at all — the same
   trick the text-size setting uses for --ts.

   It also means module-level constants that capture a colour (EFFORT,
   inputStyle, CONF_STYLE, APP_CSS) hold a live reference rather than whichever
   theme happened to be active when the file loaded. */
const C = {
  bg:"var(--c-bg)", surface:"var(--c-surface)", card:"var(--c-card)", raised:"var(--c-raised)",
  line:"var(--c-line)", lineSoft:"var(--c-lineSoft)",
  text:"var(--c-text)", dim:"var(--c-dim)", faint:"var(--c-faint)", ghost:"var(--c-ghost)",
  red:"var(--c-red)", redSoft:"var(--c-redSoft)",
  green:"var(--c-green)", blue:"var(--c-blue)", yellow:"var(--c-yellow)",
  orange:"var(--c-orange)", purple:"var(--c-purple)",
  greenDeep:"var(--c-greenDeep)", onGreen:"var(--c-onGreen)",
  scrim:"var(--c-scrim)", scrimDeep:"var(--c-scrimDeep)",
};

/* Hex alpha used to be concatenated onto a colour — `${tint(C.red,0x55)}` for a 33% red.
   That can't work on a var(), so this does the same job with color-mix. It takes
   the same byte the old code appended, which makes every converted site exact
   rather than approximately right: dark mode is unchanged by the conversion.

   color-mix needs Safari 16.2 / Chrome 111 / Firefox 113. The wake lock already
   requires Safari 16.4, so this doesn't move the floor. */
function tint(c, byte){
  return `color-mix(in srgb, ${c} ${(byte/255*100).toFixed(1)}%, transparent)`;
}

const APP_CSS = `

body{background:${C.bg};font-family:'DM Sans',system-ui,sans-serif;color:${C.text};overscroll-behavior-y:none;}

@keyframes popIn{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}

/* ═══════════════════════════════════════════════════════════════════════════

const STORE_KEY   = "snapfit_v2";
const APIKEY_KEY  = "snapfit_v2_apikey";   // separate at runtime; explicitly included in JSON backups

function loadKey(){ try{ return localStorage.getItem(APIKEY_KEY)||""; }catch{ return ""; } }
function saveKey(k){

    k ? localStorage.setItem(APIKEY_KEY,k) : localStorage.removeItem(APIKEY_KEY);

}
function loadModel(){ try{ return localStorage.getItem(MODEL_KEY)||DEFAULT_MODEL; }catch{ return DEFAULT_MODEL; } }
function saveModel(m){ try{ localStorage.setItem(MODEL_KEY,m); }catch{} }
function loadApiStatus(){ try{ return JSON.parse(localStorage.getItem(API_STATUS_KEY)||"null"); }catch{ return null; } }
function saveApiStatus(ok,kind="ok",message=""){
  const status={ok:!!ok,kind,at:new Date().toISOString(),
    message:String(message||"").replace(/\s+/g," ").trim().slice(0,180)};
  try{ localStorage.setItem(API_STATUS_KEY,JSON.stringify(status)); }catch{}
  try{ window.dispatchEvent(new CustomEvent("snapfit-api-status",{detail:status})); }catch{}
  return status;
}

const API_OK_RECHECK_MS = 12*60*60*1000;
const API_FAIL_RETRY_MS = 2*60*1000;
function nextApiCheckDelay(status){
  if(!status || status.kind==="saved") return 600;
  const at=Date.parse(status.at||"");
  if(!Number.isFinite(at)) return 600;
  const ttl=status.ok?API_OK_RECHECK_MS:API_FAIL_RETRY_MS;
  return Math.max(600,ttl-(Date.now()-at));
}

function coachConnectionMeta(key,status,checking=false){
  if(!key) return {label:"BUILT-IN",color:C.faint,title:"Built-in coach",
    sub:"Rule-based. Works offline, forever."};
  if(checking) return {label:"CHECKING",color:C.blue,title:"🤖 Checking coach connection",
    sub:"Verifying the saved key automatically. This health check uses no generated tokens."};
  if(status?.ok) return {label:"🤖 COACH",color:C.green,title:"🤖 Coach connected",
    sub:"The last AI request connected successfully."};
  if(status?.kind==="auth") return {label:"KEY REJECTED",color:C.red,title:"⚠ Coach key rejected",
    sub:"The last request was rejected. Test the key again before relying on AI."};
  if(status?.kind==="rate") return {label:"RATE LIMITED",color:C.yellow,title:"⚠ Coach rate limited",
    sub:"The API refused the last request temporarily. Retry in a minute."};
  if(["http","network","timeout","response"].includes(status?.kind)) return {
    label:"COACH OFFLINE",color:C.yellow,title:"⚠ Coach unavailable",
    sub:`The last AI request failed${status?.message?`: ${status.message}`:""}.`};
  return {label:"KEY SAVED",color:C.yellow,title:"🤖 Coach key saved",
    sub:"Not connected yet. The next AI action will try the saved key."};
}

/* Calendar dates must be local. `toISOString()` is UTC and can tell an
   Australian user that Monday morning is still Sunday, which then poisons
   weekly reviews and every "today" reference sent to the coach. */
const dateISO = (d=new Date()) => {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
};
const todayISO = () => dateISO(new Date());
const localDate = iso => {
  const [y,m,d]=String(iso||"").split("-").map(Number);
  return new Date(y||1970,(m||1)-1,d||1,12);
};
const addLocalDays = (iso,n) => { const d=localDate(iso); d.setDate(d.getDate()+n); return dateISO(d); };
const daysBetween = (a,b) => Math.round((localDate(b)-localDate(a))/86400000);
const uid = () => Math.random().toString(36).slice(2,10);
const round25 = n => Math.round(n*2)/2;
const clamp = (n,lo,hi) => Math.max(lo,Math.min(hi,n));
const roundToIncrement = (n,step=0.5) => {
  const s=Number(step)||0.5;
  return Math.round((Number(n)||0)/s)*s;
};
const plainCoachText = text => String(text||"")
  .replace(/#{1,4}\s+/g, "")
  .replace(/\*\*(.+?)\*\*/g, "$1")
  .replace(/\*(.+?)\*/g, "$1")
  .replace(/`(.+?)`/g, "$1")
  .replace(/^\s*[-•]\s+/gm, "")
  .replace(/^\s*\d+[.)]\s+/gm, "")
  .replace(/\s+/g, " ")
  .trim();

/* ═══════════════════════════════════════════════════════════════════════════

/* Official Hammer Strength / Life Fitness starting resistance where the
   floor-plan machine can be identified confidently. User corrections live in
   state.equipment.loads and always win. The Glute Drive page does not publish
   a starting resistance; its 20.4kg value was confirmed from the gym's unit

const DEFAULT_PLATES_KG = [2.5,5,10,20];
const PLATE_LOADED_DEFAULTS = {
  "19":{model:"Hammer Strength Iso-Lateral Shoulder Press",startKg:4.5,mode:"per-arm",verified:true,

  "21":{model:"Hammer Strength Iso-Lateral Incline Press",startKg:3.6,mode:"per-arm",verified:true,

  "39":{model:"Hammer Strength Iso-Lateral Row",startKg:5.4,mode:"per-arm",verified:true,
    source:"https://shop.lifefitness.com/products/hammer-strength-plate-loaded-iso-lateral-row"},
  "40":{model:"Hammer Strength Iso-Lateral Low Row",startKg:3.6,mode:"per-arm",verified:true,
    source:"https://shop.lifefitness.com/products/hammer-strength-plate-loaded-iso-lateral-low-row"},
};

function plateLoadConfig(state,station){
  const base=PLATE_LOADED_DEFAULTS[String(station)];
  if(!base) return null;
  const saved=state?.equipment?.loads?.[String(station)]||{};
  return {...base,plates:[...DEFAULT_PLATES_KG],...saved};
}

/* `targetKg` is the total effective resistance shown/logged by SnapFit. For an
   independent-arm machine the factory resistance and plates exist on both
   arms; bilateral prescriptions therefore use two identical plate stacks. */
function platePrescription(targetKg,config){
  if(!config || config.startKg==null || config.startKg==="" || !Number.isFinite(Number(config.startKg))) return null;
  const sides=config.mode==="per-arm"?2:2;
  const baseTotal=config.mode==="per-arm"?Number(config.startKg)*2:Number(config.startKg);
  const requested=Math.max(baseTotal,Number(targetKg)||baseTotal);
  const perSide=Math.max(0,(requested-baseTotal)/sides);
  const step=Math.min(...(config.plates||DEFAULT_PLATES_KG).map(Number).filter(n=>n>0));
  const snappedPerSide=roundToIncrement(perSide,step);
  let remaining=Math.max(0,Math.round(snappedPerSide*10)/10), plates=[];
  [...(config.plates||DEFAULT_PLATES_KG)].map(Number).sort((a,b)=>b-a).forEach(p=>{
    const count=Math.floor((remaining+1e-8)/p);
    if(count){ plates.push({kg:p,count}); remaining=Math.round((remaining-count*p)*10)/10; }
  });
  const total=Math.round((baseTotal+snappedPerSide*sides)*10)/10;
  return {total,baseTotal,perSide:snappedPerSide,plates};
}

function plateHintForExercise(ex,state){
  const station=(ex?.stations||[]).find(s=>plateLoadConfig(state,s));
  if(!station) return null;
  const config=plateLoadConfig(state,station);
  const load=platePrescription(ex.weight,config);
  return load?{station,model:config.model,...load}:null;
}

/* ═══════════════════════════════════════════════════════════════════════════
   EXERCISE CATALOGUE
   Each entry teaches as well as prescribes. `pattern` drives block building;
   `cues` drive the How panel; `why` explains the exercise's job in a plan.
   ═══════════════════════════════════════════════════════════════════════════ */

const P = { // movement patterns
  SQUAT:"squat", HINGE:"hinge", LUNGE:"lunge",

  lunge:"Single-leg", push_h:"Horizontal press (chest)", push_v:"Vertical press (shoulders)",
  pull_h:"Horizontal pull (mid-back)", pull_v:"Vertical pull (lats)",
  arms:"Arms", delts:"Side & rear delts", core:"Core", calf:"Calves",
};

const EX = [
  /* ── Knee-dominant ────────────────────────────────────────────────────── */
  { id:"leg_press", name:"Linear Leg Press", stations:["35"], pattern:P.SQUAT, compound:true,
    primary:"Quads", secondary:["Glutes"], kind:"machine", inc:5, start:80, reps:[8,15], tags:["lower","knee"],
    why:"Your main quad builder. A machine lets you push close to failure safely, so it carries most of the leg volume in the plan.",
    cues:{
      setup:"Feet mid-platform, shoulder-width, toes very slightly out. Hips and lower back flat against the pad — if your tailbone lifts at the bottom, you've gone too deep.",
      execution:"Lower for 2–3 seconds until your knees reach about 90°. Drive through the whole foot, mostly the heel. Stop just short of locking the knees.",
      mistakes:["Bouncing out of the bottom","Letting the lower back round off the pad","Slamming into a locked knee at the top","Feet so high it becomes a glute exercise when you wanted quads"],

/* Fixed commercial dumbbell racks do not contain arbitrary half-kilo loads.
   Snap's seeded rack uses 2kg jumps; gyms with 2.5kg commercial sets can switch
   this in Settings. All prescriptions are snapped to the selected real rack. */
function exerciseIncrement(ex,state){
  if(ex?.kind==="dumbbell") return Number(state?.profile?.dumbbellStep)||2;
  return Number(ex?.inc)||2.5;
}
function availableWeight(ex,weight,state){
  const n=Math.max(0,Number(weight)||0);
  const plateStation=(ex?.stations||[]).find(s=>plateLoadConfig(state,s));
  if(plateStation){
    const prescription=platePrescription(n,plateLoadConfig(state,plateStation));
    if(prescription) return prescription.total;
  }
  if(ex?.kind!=="dumbbell") return roundToIncrement(n,exerciseIncrement(ex,state));
  const step=Number(state?.profile?.dumbbellStep)||2;
  /* The seeded mixed rack has every whole kilo through 10kg, then even loads
     (12, 14, 16...). A conventional commercial rack is 2.5kg throughout. */
  const snapped = step===2
    ? (n<=10 ? Math.round(n) : 10+roundToIncrement(n-10,2))
    : roundToIncrement(n,2.5);
  /* An away-gym ceiling is an observed real dumbbell, even when it does not
     match the usual home-rack spacing. Never round that safety cap upward. */
  const venueMax=travelOn(state) ? Number(state.travel?.dumbbellMax)||null : null;
  return venueMax ? Math.min(snapped,venueMax) : snapped;
}

/* Tempo is a technique prescription, not another progression lever. It is
   catalogue/phase driven so the AI cannot invent a slow clean or an unsafe
   pause under a heavy compound. */
function tempoPrescription(ex,phase){
  const execution=String(ex?.cues?.execution||"").toLowerCase();
  if(ex?.kind==="sandbag" && /clean|jerk|push press/.test(ex.name||""))
    return "Reset each rep · powerful drive up · controlled return";
  if(/deload/i.test(phase?.name||"")) return "2 sec down · smooth up · leave plenty in reserve";
  if(ex?.compound || /peak|intensification/i.test(phase?.name||""))
    return "2–3 sec down · no bounce · strong controlled up";
  if(/pause|hold|squeeze/.test(execution))
    return "3 sec down · 1 sec squeeze at the peak · smooth up";
  return "3 sec down · controlled turn · smooth up";
}

function rampSetsFor(session){
  const first=session?.exercises?.[0];
  if(!first||!Number.isFinite(Number(first.weight))||first.weight<=0) return [];
  const catalogEx=EX_BY_ID[first.exId]||first;
  const working=Number(first.weight);
  const minimum=Math.min(working,Number(first.inc)||2.5);
  const snap=w=>catalogEx.kind==="dumbbell"
    ? ((Number(first.inc)||2)===2 ? (w<=10?Math.round(w):10+roundToIncrement(w-10,2)) : roundToIncrement(w,2.5))
    : roundToIncrement(w,Number(first.inc)||2.5);
  const candidates=[
    {reps:10,weight:snap(Math.max(minimum,working*.5)),label:"easy rehearsal"},
    {reps:5,weight:snap(Math.max(minimum,working*.75)),label:"feel the working groove"},
  ];
  /* A warm-up that equals the working load is not a warm-up. Light exercises
     may therefore get one ramp set or none instead of two fake ones. */
  return candidates.filter((r,i,a)=>r.weight<working && a.findIndex(x=>x.weight===r.weight)===i);
}

    hook:"The one principle everything else serves.",
    body:`Muscles adapt to what you repeatedly ask of them. Ask the same thing forever and they have no reason to change. **Progressive overload** just means gradually asking for more.

  { id:"recovery", title:"Sleep, soreness and what actually recovers you", mins:3, tag:"Recovery",

    body:`### Sleep does the heavy lifting
Nothing else comes close. Growth hormone release, tissue repair and the nervous-system reset all happen while you sleep. Chronically under 6 hours and you'll see strength drop, appetite rise and sessions feel harder at the same weights. If you can only fix one thing, fix this.

### Protein is the raw material
Training is the signal to build; protein is the material. Roughly **1.6–2.2 g per kg of body weight per day** is the well-supported range. Spread it across your meals rather than cramming it into one.

Muscle soreness peaks a day or two after training and mostly reflects **novelty** — new exercises, new ranges, more volume than usual. It's not a measure of how good the session was. Well-trained lifters making excellent progress are often barely sore.

  { id:"form", title:"Range, tempo and what 'good form' really means", mins:3, tag:"Practice",
    hook:"Most people's fastest gains come from lifting the same weight better.",
    body:`### Full range beats heavy and short
A muscle grows most from being loaded while it's **lengthened**. Cutting the bottom off a rep to add weight is a bad trade — you're skipping the most valuable part. If you can't reach full range, the weight is too heavy.

### Control the lowering
The lowering (eccentric) phase drives a lot of the growth stimulus and costs you nothing extra. Aim for roughly **2–3 seconds down, then lift with intent**. Letting the weight drop is throwing away half the rep.

### Tempo, in one line
Down slow and controlled, brief pause where the muscle is stretched, up with purpose, brief squeeze at the top.

### Form failure is the real end of a set
The set is over when your **technique** breaks, not when you physically cannot move the weight by any means. Rounding your back, bouncing, jerking with the hips — those reps add risk, not muscle.

    body:`Newcomers add weight almost every session. That stops, and it stops sooner than anyone would like. When a lift hasn't moved in **three sessions**, work through this in order.

function trainingWeek(state, onDate=todayISO()){
  const startDay = clamp(Number(state?.profile?.weekStartsOn ?? 1),0,6);

  const start = addLocalDays(onDate,-back), end = addLocalDays(start,6);
  return {start,end,startDay,startName:WEEKDAYS[startDay]};
}

  {label:"Straight", note:"No jokes. Clear, calm coaching."},
  {label:"Dry", note:"The occasional dry aside, used sparingly."},
  {label:"Cheeky", note:"A bit of bite when it makes the point land."},
  {label:"Spicy", note:"Regular sharp wit, without turning cruel."},
  {label:"Full roast", note:"Maximum playful heat. Still respectful, never personal."},
];
const HARD_TRUTH_LEVELS = [
  null,
  {label:"Gentle", note:"Lead with context, then give the honest read."},
  {label:"Candid", note:"Plain facts with a supportive next step."},
  {label:"Direct", note:"Verdict first. Evidence and action straight after."},
  {label:"Blunt", note:"Call out weak effort, excuses and inconsistency clearly."},
  {label:"No sugar-coating", note:"Lead with the uncomfortable truth and its consequence."},
];

function coachStylePreview(style){
  const sass = clamp(Number(style?.sass)||DEFAULT_COACH_STYLE.sass, 1, 5);
  const truth = clamp(Number(style?.hardTruth)||DEFAULT_COACH_STYLE.hardTruth, 1, 5);
  const verdict = [
    "You completed two of four sessions. Let's make next week more workable.",
    "You completed two of four sessions. That's below plan, so something needs to change.",
    "You planned four sessions and completed two. Change the schedule or protect the time.",
    "Two of four sessions is not enough for the result you want. Cut the plan or make the time.",
    "You completed half the plan. At this rate the goal date is fiction — change the schedule today or accept a slower result.",
  ][truth-1];
  const aside = [
    "",
    " Good intentions remain difficult to progressively overload.",
    " The calendar, rudely, does not count good intentions as training.",
    " Your calendar has reviewed the vibes and declined to count them as reps.",
    " The plan is not a decorative PDF. It needs sweat, not emotional support.",
  ][sass-1];
  return verdict + aside;
}

function defaultState(){
  return {
    v:3,
    equipmentCatalogueVersion:3,
    onboarded:false,
    goal:null,
    profile:{...DEFAULT_PROFILE},
    limits:{...DEFAULT_LIMITS},
    coachStyle:{...DEFAULT_COACH_STYLE},
    uiPrefs:{...DEFAULT_UI_PREFS},
    equipment:{ enabled:SEED_STATIONS.map(s=>s.num), custom:[], loads:{} },
    travel:null,          // an away gym for today — see TRAVEL / AWAY GYM below
    block:null,
    weights:{},          // { [exId]: {weight,lastAvgReps,lastTargetReps,inc,lastEffort,updated} }
    exerciseHistory:{},  // { [exId]: [ {date,weight,avgReps,targetReps,setsLogged,totalSets,dayName} ] }
    sessions:[],         // completed sessions, newest first
    checkins:[],
    bodyLog:[],
    discomfortFlags:[],  // active until the user marks the body area resolved
    learn:{ read:[], quiz:{} },
    chat:[],
    coachNotes:[],       // short observations the coach can carry forward
  };
}

function migrate(raw){
  const s = {...defaultState(), ...raw};
  s.profile   = {...DEFAULT_PROFILE, ...(raw.profile||{})};
  s.limits    = {...DEFAULT_LIMITS,  ...(raw.limits||{})};
  s.coachStyle = {...DEFAULT_COACH_STYLE, ...(raw.coachStyle||{})};
  s.uiPrefs = {...DEFAULT_UI_PREFS, ...(raw.uiPrefs||{})};
  s.coachStyle.sass = clamp(Number(s.coachStyle.sass)||DEFAULT_COACH_STYLE.sass, 1, 5);
  s.coachStyle.hardTruth = clamp(Number(s.coachStyle.hardTruth)||DEFAULT_COACH_STYLE.hardTruth, 1, 5);
  s.equipment = {enabled:SEED_STATIONS.map(x=>x.num), custom:[], loads:{}, ...(raw.equipment||{})};
  if(!s.equipment.loads || typeof s.equipment.loads!=="object") s.equipment.loads={};
  /* Catalogue v2 adds the gym's functional sandbags. Add them once for an
     existing install; after that the user's equipment toggle is respected. */
  if((Number(raw.equipmentCatalogueVersion)||1) < 2 && !s.equipment.enabled.includes("SB")){
    s.equipment.enabled = [...s.equipment.enabled, "SB"];
  }
  /* v3 expands the original exercise-only subset to the complete 50-station
     Watagan Park floor plan. Existing on/off choices for known stations stay
     untouched; only newly catalogued floor-plan numbers are added. */
  if((Number(raw.equipmentCatalogueVersion)||1) < 3){
    const knownV2=new Set(["6","7","8","10","11","12","13","14","15","16","17","19","20","21","22","23","24","25","26","29","SB","32","33","35","36","37","38","39","40","41","48"]);
    const added=SEED_STATIONS.map(x=>x.num).filter(n=>!knownV2.has(n) && !s.equipment.enabled.includes(n));
    s.equipment.enabled=[...s.equipment.enabled,...added];
  }
  s.equipmentCatalogueVersion = 3;
  s.v=3;
  s.travel    = normaliseTravel(raw.travel);
  s.learn     = {read:[], quiz:{},  ...(raw.learn||{})};
  ["weights","exerciseHistory"].forEach(k=>{ if(!s[k]||typeof s[k]!=="object") s[k]={}; });
  ["sessions","checkins","bodyLog","discomfortFlags","chat","coachNotes"].forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  s.discomfortFlags = s.discomfortFlags
    .filter(x=>x && DISCOMFORT_BY_KEY[x.area])
    .map(x=>({...x, active:x.active!==false}));
  return s;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return defaultState();
    return migrate(JSON.parse(raw));
  }catch{ return defaultState(); }
}
function persist(s){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch{} return s; }

/* ═══════════════════════════════════════════════════════════════════════════
   RULES ENGINE — the offline coach.
   Everything below works with no API key. The AI layer replaces the *content*
   of these functions, never the shapes they return.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Progression ──────────────────────────────────────────────────────────
   Adapted from v1's getWeightDecision, extended to work against a rep RANGE
   and the logged effort rating rather than a single target number.          */

function estimate1RM(weight, reps){
  if(!weight||!reps) return 0;
  return Math.round(weight * (1 + reps/30) * 10)/10;   // Epley
}

function progressionDecision(entry, repRange, inc){
  const [lo,hi] = repRange;
  if(!entry || !entry.lastAvgReps){
    return {action:"start", delta:0, label:"First time — find a weight you can control", color:C.blue};
  }
  const reps   = entry.lastAvgReps;
  const effort = entry.lastEffort;

  // Effort overrides: an honest "everything" means we do not add load.
  if(effort==="failed" && reps < lo){
    return {action:"down", delta:-inc, label:`Form broke below target — drop ${inc}kg and rebuild`, color:C.red};
  }
  if(effort==="failed"){
    return {action:"hold", delta:0, label:"Taken to the limit — hold and consolidate", color:C.yellow};
  }
  if(reps >= hi && (effort==="easy"||effort==="good")){
    const bump = effort==="easy" ? inc*2 : inc;
    return {action:"up", delta:bump, label:`Top of the range — up ${bump}kg`, color:C.green};
  }
  if(reps >= hi){
    return {action:"up", delta:inc, label:`Hit ${hi} reps — up ${inc}kg`, color:C.green};
  }
  if(effort==="easy"){
    return {action:"up", delta:inc, label:`Too easy for the reps — up ${inc}kg`, color:C.green};
  }
  if(reps >= lo){
    return {action:"hold", delta:0, label:`In range — hold and chase ${hi} reps`, color:C.yellow};
  }
  if(reps >= lo-2){
    return {action:"hold", delta:0, label:"Just short — hold and build reps", color:C.orange};
  }
  return {action:"down", delta:-inc, label:`Well short — drop ${inc}kg`, color:C.red};
}

/* Working weight for an exercise this session. */
function workingWeight(ex, state, phase){
  const entry = state.weights[ex.id];
  const inc   = exerciseIncrement(ex,state);
  const dec   = progressionDecision(entry, phase.repRange, inc);
  let w = entry ? entry.weight : ex.start;
  if(entry) w = Math.max(0, w + dec.delta);
  if(phase.name==="Deload") w *= 0.6;
  return { weight: availableWeight(ex,w,state), decision: dec, e1rm: entry ? estimate1RM(entry.weight, entry.lastAvgReps||0) : 0 };
}

/* Optional onboarding anchors for lifters who already know their working
   weights. They are deliberately not exercise-history rows: no workout was
   completed, and the first session should hold the stated load rather than
   applying a progression bump. */
function onboardingWeights(profile){
  const out = {};
  Object.entries(profile?.baselineWeights||{}).forEach(([exId,value])=>{
    if(value==="" || value==null) return;
    const ex = EX_BY_ID[exId], weight = Number(value);
    if(ex && Number.isFinite(weight) && weight>=0){
      out[exId] = {weight:availableWeight(ex,weight,{profile,equipment:{loads:{}}}), updated:todayISO(), source:"onboarding"};
    }
  });
  return out;
}

/* ── Duration shaping ─────────────────────────────────────────────────────── */

function durationShape(mins){
  const m = mins||45;
  if(m<=20) return {maxEx:3, label:"Express",  emoji:"⚡", color:C.blue,   note:"Three exercises, straight through. The big ones only."};
  if(m<=30) return {maxEx:4, label:"Quick",    emoji:"🏃", color:C.green,  note:"Four exercises, short rests."};
  if(m<=45) return {maxEx:5, label:"Standard", emoji:"💪", color:C.red,    note:"Five exercises. The default shape."};
  if(m<=60) return {maxEx:6, label:"Full",     emoji:"🔥", color:C.yellow, note:"Six exercises with full rests."};
  if(m<=75) return {maxEx:7, label:"Extended", emoji:"💯", color:C.orange, note:"Seven exercises. Room for accessories."};
  return       {maxEx:8, label:"Long",     emoji:"🏆", color:C.purple, note:"Eight exercises. Bring a drink."};
}

/* ── Away gym ─────────────────────────────────────────────────────────────
   A travel venue overrides the home gym for one day: a hotel gym, a friend's
   garage, whatever the photo found. It deliberately does NOT touch
   state.equipment, so coming home is a single flag flip and nothing about the
   real gym was ever edited.

   `date` is the day it was set up for. An away gym goes inactive by itself
   overnight — you should never walk into your own gym and be handed a hotel
   session because you forgot to switch back. The record survives so a four
   night stay is one tap a day rather than a rescan.                        */

/* Supersets are a time-saving tool, not a licence to turn the whole workout
   into cardio. Only adjacent accessory exercises can pair. Main compounds,
   deloads and repeated muscle groups stay out. */
function assignSupersets(exercises,state,phase){
  const clean=(exercises||[]).map(e=>{ const {superset,...rest}=e; return rest; });
  if(state?.profile?.useSupersets===false || /deload/i.test(phase?.name||"") || clean.length<4) return clean;
  const maxPairs=(state.profile.sessionMinutes||45)>=60 ? 2 : 1;
  let pairs=0;
  for(let i=2;i<clean.length-1 && pairs<maxPairs;i++){
    const a=clean[i], b=clean[i+1];
    if(a.compound||b.compound||a.sets!==b.sets||a.pattern===b.pattern||a.primary===b.primary) continue;
    const group=String.fromCharCode(65+pairs);
    clean[i]={...a,superset:{group,position:1}};
    clean[i+1]={...b,superset:{group,position:2}};
    pairs++; i++;
  }
  return clean;
}

function supersetPairs(session){
  const groups={};
  (session?.exercises||[]).forEach((ex,index)=>{
    if(!ex.superset) return;
    const g=ex.superset.group;
    if(!groups[g]) groups[g]=[];
    groups[g].push({ex,index});
  });
  return Object.entries(groups).map(([group,items])=>({group,items:items.sort((a,b)=>a.ex.superset.position-b.ex.superset.position)}))
    .filter(x=>x.items.length===2);
}

function normaliseTravel(raw){
  if(!raw || typeof raw!=="object") return null;
  const t = {
    name: String(raw.name||"Away gym").slice(0,40),
    stations: Array.isArray(raw.stations) ? raw.stations.map(String) : [],
    custom: Array.isArray(raw.custom)
      ? raw.custom.filter(c=>c&&c.num&&c.name).map(c=>({num:String(c.num), name:String(c.name), kind:"travel"}))
      : [],
    note: String(raw.note||"").slice(0,400),
    dumbbellMax: Number(raw.dumbbellMax)>0 ? Number(raw.dumbbellMax) : null,
    source: raw.source==="photo" ? "photo" : "manual",
    date: typeof raw.date==="string" ? raw.date : todayISO(),
    active: !!raw.active,
  };
  if(!t.stations.length && !t.custom.length) return null;
  if(t.date !== todayISO()) t.active = false;    // expires overnight, but is kept
  return t;
}

function travelOn(state){ return !!(state.travel && state.travel.active); }

function venueName(state){
  return travelOn(state) ? state.travel.name : "Your gym";
}

/* The dumbbell rack at an away gym has a ceiling, and being told to press 30s
   when the heaviest pair is 15 is worse than useless. Every dumbbell weight in
   the catalogue is the weight of ONE dumbbell, so the rack's heaviest pair is
   the cap regardless of whether the exercise uses one hand or two. Capped here
   rather than in the picker so it holds on both coach paths. */
function capForVenue(ex, weight, state){
  const max = travelOn(state) ? state.travel.dumbbellMax : null;
  if(!max || ex.kind!=="dumbbell") return weight;
  return Math.min(weight, max);
}

/* ── Equipment & exercise availability ────────────────────────────────────── */

/* Every station this app knows about, wherever it came from. */
function stationCatalogue(state){
  return [...SEED_STATIONS, ...(state.equipment?.custom||[]), ...(state.travel?.custom||[])];
}

/* The stations available RIGHT NOW, as objects. Single choke point: the pool,
   the digests sent to the AI and the equipment counts in the UI all read this,
   so an away gym needs no special-casing anywhere downstream. */
function activeStations(state){
  const all = stationCatalogue(state);
  const nums = travelOn(state)
    ? new Set([...(state.travel.stations||[]), ...(state.travel.custom||[]).map(c=>c.num)])
    : new Set([...(state.equipment.enabled||[]), ...(state.equipment.custom||[]).map(c=>c.num)]);
  return all.filter(s=>nums.has(s.num));
}

function enabledStationSet(state){
  return new Set(activeStations(state).map(s=>s.num));
}

function limitBlocks(ex, limits){
  if(limits.knees     && ex.tags?.includes("knee"))     return true;
  if(limits.ankles    && ex.tags?.includes("ankle"))    return true;
  if(limits.shoulders && ex.tags?.includes("shoulder")) return true;
  if(limits.back      && ex.tags?.includes("back"))     return true;
  if(limits.elbows    && ex.tags?.includes("elbow"))    return true;
  return false;
}

function activeDiscomforts(state){
  return (state?.discomfortFlags||[]).filter(x=>x?.active!==false && DISCOMFORT_BY_KEY[x.area]);
}

function effectiveLimits(state){
  const limits={...DEFAULT_LIMITS,...(state?.limits||{})};
  activeDiscomforts(state).forEach(flag=>{
    if(flag.area!=="other") limits[flag.area]=true;
  });
  return limits;
}

function stateWithDiscomfort(state, area){
  if(!DISCOMFORT_BY_KEY[area]) return state;
  return {...state,discomfortFlags:[...(state.discomfortFlags||[]),{area,active:true,date:todayISO()}]};
}

function discomfortSafetyNote(state){
  const labels=activeDiscomforts(state).map(x=>DISCOMFORT_BY_KEY[x.area].label.toLowerCase());
  if(!labels.length) return "";
  return `Active discomfort flag${labels.length===1?"":"s"}: ${labels.join(", ")}. Exercises that directly load a flagged area have been removed. Do not train through sharp, worsening or joint-centred pain.`;
}

function availableExercises(state){
  const stations = enabledStationSet(state);
  const limits = effectiveLimits(state);
  return EX.filter(ex =>
    (ex.stationMode === "any"
      ? ex.stations.some(n => stations.has(n))
      : ex.stations.every(n => stations.has(n)))
    && !limitBlocks(ex, limits)
  );
}

/* Busy-gym substitutions stay inside the same movement pattern and current
   equipment/limit rules. Prefer a different station so "swap" does not offer
   the machine beside the occupied machine as its first bright idea. */
function exerciseSwapOptions(current, state, session){
  const used=new Set((session?.exercises||[]).map(e=>e.exId));
  const currentStations=new Set(current.stations||[]);
  return availableExercises(state)
    .filter(ex=>ex.id!==current.exId && ex.pattern===current.pattern && !used.has(ex.id))
    .map(ex=>({ex, overlap:stationsForExercise(ex,state).some(s=>currentStations.has(s))?1:0,
      preference:ex.kind==="dumbbell" ? Math.abs((state.profile.freeWeightPct||0)-100) : Math.abs(state.profile.freeWeightPct||0)}))
    .sort((a,b)=>a.overlap-b.overlap || a.preference-b.preference || Number(b.ex.compound)-Number(a.ex.compound))
    .slice(0,2).map(x=>x.ex);
}

/* Ramp-up sets must not drag a working weight backwards. The progression base
   is the heaviest successfully completed load; reps and effort are calculated
   only from sets at that load. A failed top set falls back to the heaviest
   non-failed set, while an all-out session still records what actually moved. */
function performanceSummary(logged, repRange=[1,99]){
  const rows=(logged||[]).filter(x=>x&&Number.isFinite(Number(x.weight))&&Number.isFinite(Number(x.reps))&&Number(x.reps)>0)
    .map(x=>({...x,weight:Number(x.weight),reps:Number(x.reps)}));
  if(!rows.length) return null;
  const [lo]=repRange;
  const productive=rows.filter(x=>x.effort!=="failed" && x.reps>=Math.max(1,lo-2));
  const candidates=productive.length?productive:rows;
  const weight=Math.max(...candidates.map(x=>x.weight));
  const working=candidates.filter(x=>x.weight===weight);
  const avgReps=Math.round((working.reduce((n,x)=>n+x.reps,0)/working.length)*10)/10;
  const effort=working.some(x=>x.effort==="failed") ? "failed"
    : working.some(x=>x.effort==="hard") ? "hard"
    : working.every(x=>x.effort==="easy") ? "easy" : "good";
  return {weight,avgReps,effort,sets:working.length,allSets:rows.length,
    volume:Math.round(rows.reduce((n,x)=>n+x.weight*x.reps,0))};
}

/* Most exercises require every listed item (dumbbells + a bench). Cable
   movements marked `any` can use either suitable tower; show and save the
   first one that is actually available instead of pretending both are needed. */
function stationsForExercise(ex, state){
  if(ex.stationMode !== "any") return ex.stations;
  const enabled = enabledStationSet(state);
  const station = ex.stations.find(n=>enabled.has(n));
  return station ? [station] : [];
}

function stationRequirement(ex){
  const joiner = ex.stationMode === "any" ? " or #" : "+#";
  return `#${ex.stations.join(joiner)}`;
}

/* Pick the best exercise for a pattern slot, avoiding repeats and honouring
   the user's free-weight preference. */
function pickForPattern(pattern, pool, used, recentIds, freePct){
  let cands = pool.filter(e => e.pattern===pattern && !used.has(e.id));
  if(!cands.length) return null;

  const preferFree = Math.random()*100 < (freePct||0);
  const scored = cands.map(e=>{
    let score = 0;
    if(e.compound) score += 3;                                  // compounds anchor a slot
    if(recentIds.includes(e.id)) score -= 4;                    // rotate away from recent
    if(preferFree  &&  FREE_WEIGHT_IDS.has(e.id)) score += 3;
    if(!preferFree && !FREE_WEIGHT_IDS.has(e.id)) score += 1;
    score += Math.random();                                     // gentle variety
    return {e, score};
  }).sort((a,b)=>b.score-a.score);
  return scored[0].e;
}

function restSeconds(ex, phase){
  const base = ex.compound ? 105 : 60;
  return Math.round(base * (phase.restMult||1));
}

/* ── Block ────────────────────────────────────────────────────────────────── */

function buildBlockRules(state){
  const goal = state.goal;
  const tpl  = BLOCK_TEMPLATES[goal?.type] || BLOCK_TEMPLATES.general_fitness;
  const phases = tpl.phases.map(p=>({...p}));
  const totalWeeks = phases.reduce((n,p)=>n+p.weeks,0);
  const g = GOAL_BY_ID[goal?.type] || GOAL_TYPES[3];
  return {
    id: uid(),
    source: "rules",
    name: `${g.label} — ${totalWeeks} week block`,
    rationale: `${totalWeeks} weeks built around ${g.label.toLowerCase()}, training ${state.profile.daysPerWeek} days a week. It moves through ${phases.length} phases and finishes with a deload so the work turns into progress.`,
    phases,
    totalWeeks,
    startedAt: todayISO(),
    createdFrom: { goal: goal?.type, days: state.profile.daysPerWeek, mins: state.profile.sessionMinutes },
  };
}

function phaseForWeek(block, week){
  let acc = 0;
  for(const p of block.phases){
    acc += p.weeks;
    if(week <= acc) return p;
  }
  return block.phases[block.phases.length-1];
}
function phaseIndexForWeek(block, week){
  let acc = 0;
  for(let i=0;i<block.phases.length;i++){
    acc += block.phases[i].weeks;
    if(week <= acc) return i;
  }
  return block.phases.length-1;
}

function planWeekForSession(session){
  const n=Number(session?.planWeek ?? session?.week);
  return Number.isFinite(n)&&n>0 ? Math.round(n) : 1;
}

function targetForPlanWeek(state,week){
  const override=Number(state?.block?.weekTargets?.[String(week)]);
  return clamp(Number.isFinite(override)&&override>0 ? override : (state?.profile?.daysPerWeek||3),2,5);
}

function setPlanWeekTarget(state,week,target){
  if(!state.block) return state;
  const key=String(clamp(Number(week)||1,1,state.block.totalWeeks||1));
  const normal=clamp(Number(state.profile?.daysPerWeek)||3,2,5);
  const v=clamp(Number(target)||normal,2,5);
  const weekTargets={...(state.block.weekTargets||{})};
  if(v===normal) delete weekTargets[key]; else weekTargets[key]=v;
  return {...state,block:{...state.block,weekTargets}};
}

function setCurrentPlanWeek(state,week){
  if(!state.block) return state;
  const weekFloor=clamp(Number(week)||1,1,state.block.totalWeeks||1);
  return {...state,block:{...state.block,weekFloor,weekFloorSetAt:new Date().toISOString()}};
}

function clearCurrentPlanWeek(state){
  if(!state.block) return state;
  const block={...state.block};
  delete block.weekFloor;
  delete block.weekFloorSetAt;
  return {...state,block};
}

function blockProgress(state){
  const b = state.block;
  if(!b) return null;
  const blockSessions = state.sessions.filter(s=>s.blockId===b.id);
  /* An optional extra session is still a real session from this block. It
     advances the rotation; `bonus` only distinguishes it from the weekly
     attendance target in the log and review. */
  const done  = blockSessions.length;
  const bonusDone = blockSessions.filter(s=>s.bonus).length;
  const total = b.totalWeeks;
  /* A manual floor is the failsafe for imports, missed logs or a plan that was
     started outside the app. It never manufactures sessions or edits history;
     it only prevents an incomplete earlier week pulling the cursor backwards. */
  const weekFloor=clamp(Number(b.weekFloor)||1,1,total);
  let rawWeek=total+1, dayIdx=0, dpw=targetForPlanWeek(state,total);
  for(let week=weekFloor;week<=total;week++){
    const target=targetForPlanWeek(state,week);
    const completed=blockSessions.filter(s=>planWeekForSession(s)===week).length;
    if(completed<target){ rawWeek=week; dayIdx=completed; dpw=target; break; }
  }
  const complete = rawWeek > total;
  const week  = clamp(rawWeek, 1, total);
  const progressWeeks = complete ? total : Math.max(0,(rawWeek-1)+(dayIdx/dpw));
  return {
    done, bonusDone, dpw, total, week, complete,
    dayIdx,
    phase: phaseForWeek(b, week),
    phaseIdx: phaseIndexForWeek(b, week),
    weekInPhase: (()=>{ let acc=0; for(const p of b.phases){ if(week<=acc+p.weeks) return week-acc; acc+=p.weeks; } return 1; })(),
    pct: Math.round(clamp(progressWeeks/total,0,1)*100),
  };
}

function changeTrainingDays(state, daysPerWeek){
  const v = clamp(Number(daysPerWeek)||state.profile.daysPerWeek||3,2,5);
  if(v===state.profile.daysPerWeek) return state;
  if(!state.block) return {...state,profile:{...state.profile,daysPerWeek:v}};
  const before=blockProgress(state), old=clamp(Number(state.profile.daysPerWeek)||3,2,5);
  const weekTargets={...(state.block.weekTargets||{})};
  /* Completed earlier weeks retain the cadence they were actually run under.
     The new global setting applies to the current/future week without making a
     completed week reopen merely because its denominator changed. */
  for(let week=1;week<(before?.week||1);week++){
    if(weekTargets[String(week)]==null) weekTargets[String(week)]=old;
  }
  return {...state,profile:{...state.profile,daysPerWeek:v},block:{...state.block,weekTargets}};
}

/* ── Readiness check-in ───────────────────────────────────────────────────── */

/* sleep/energy: 1 (awful) .. 5 (great); soreness/stress: 1 (none) .. 5 (severe) */
function readinessScore(ci){
  if(!ci) return 3.5;
  const s = (ci.sleep||3) + (ci.energy||3) + (6-(ci.soreness||2)) + (6-(ci.stress||2));
  return Math.round((s/4)*10)/10;   // 1..5
}
/* Bands are set so that middling answers across the board read as a normal
   session. Trimming load off someone who said "3 out of 5, about usual" would
   make the check-in feel like a punishment for answering honestly. */
function readinessAdjustment(ci){
  const r = readinessScore(ci);
  if(r >= 4.0) return {key:"green",  loadMult:1.0,  setDelta:0,  color:C.green,
    label:"Fully recovered", note:"You're in good shape. Run the session as written and push the last set of each exercise."};
  if(r >= 3.0) return {key:"normal", loadMult:1.0,  setDelta:0,  color:C.blue,
    label:"Good to go", note:"Normal session. Nothing to change."};
  if(r >= 2.2) return {key:"amber",  loadMult:0.92, setDelta:0,  color:C.yellow,
    label:"A bit beaten up", note:"Weights trimmed by about 8% and effort capped one notch. Still a real session, just not a heroic one."};
  return {key:"red", loadMult:0.8, setDelta:-1, color:C.red,
    label:"Under-recovered", note:"Lightened and shortened. Showing up and moving well today beats grinding out a session you'll pay for."};
}

/* ── Session generation ───────────────────────────────────────────────────── */

function buildSessionRules(state, checkin, {bonus=false,regenerateReason=""}={}){
  const prog = blockProgress(state);
  if(!prog) return null;
  const dpw    = prog.dpw;
  const split  = SPLITS[dpw] || SPLITS[3];
  const day    = split[prog.dayIdx % split.length];
  const phase  = prog.phase;
  const shape  = durationShape(checkin?.availableMinutes || state.profile.sessionMinutes);
  const adj    = readinessAdjustment(checkin);
  const pool   = availableExercises(state);
  const recent = state.sessions.slice(0,2).flatMap(s=>s.exercises.map(e=>e.exId));

  const used = new Set();
  const exercises = [];
  for(const pattern of day.slots){
    if(exercises.length >= shape.maxEx) break;
    const ex = pickForPattern(pattern, pool, used, recent, state.profile.freeWeightPct);
    if(!ex) continue;
    used.add(ex.id);

    const ww = workingWeight(ex, state, phase);
    let sets = ex.compound ? phase.sets : Math.max(2, phase.sets-1);
    sets = Math.max(1, sets + adj.setDelta);
    const [lo,hi] = phase.repRange;
    const reps = ex.compound ? lo : Math.min(hi+3, Math.round((lo+hi)/2)+2);

    exercises.push({
      exId: ex.id,
      name: ex.name,
      stations: stationsForExercise(ex, state),
      pattern: ex.pattern,
      primary: ex.primary,
      compound: ex.compound,
      kind:ex.kind,
      sets,
      targetReps: reps,
      repRange: phase.repRange,
      weight: availableWeight(ex,capForVenue(ex, ww.weight * adj.loadMult, state),state),
      inc: exerciseIncrement(ex,state),
      rpe: clamp(phase.rpe + (adj.key==="amber"?-1:adj.key==="red"?-2:0), 5, 10),
      rest: restSeconds(ex, phase),
      tempo: tempoPrescription(ex,phase),
      decisionLabel: ww.decision.label,
      decisionColor: ww.decision.color,
      why: buildWhy(ex, phase, prog, state, bonus),
    });
  }
  const plannedExercises=assignSupersets(exercises,state,phase);

  return {
    id: uid(),
    blockId: state.block.id,
    bonus,
    regeneratedFrom:regenerateReason||null,
    date: todayISO(),
    dayName: day.name,
    week: prog.week,
    phaseName: phase.name,
    phaseIntent: phase.intent,
    shape: shape.label,
    /* Recorded on the session so the log tells you why a week looks odd —
       three sessions at 15kg dumbbells reads as a plateau otherwise. */
    venue: travelOn(state) ? state.travel.name : null,
    source: "rules",
    readiness: adj,
    checkin: checkin||null,
    adaptationNote: discomfortSafetyNote(state),
    focusTip: focusTipFor(day, phase),
    brief: buildBriefRules(day, phase, prog, state, plannedExercises, bonus),
    exercises:plannedExercises,
  };
}

function buildWhy(ex, phase, prog, state, bonus=false){
  const goalLabel = (GOAL_BY_ID[state.goal?.type]||{}).label || "your goal";
  const patt = PATTERN_LABEL[ex.pattern] || ex.pattern;
  const role = ex.compound
    ? `It's the ${patt.toLowerCase()} anchor for this session — the exercise carrying the most of the load.`
    : `It's here as focused work for the ${ex.primary.toLowerCase()}, which the compound lifts don't fully finish off.`;
  return `${bonus ? "This is an extra opportunity to complete the next workout in your block, with the same phase targets. " : ""}${role} ${phase.name==="Deload"
    ? "This week is a deload, so the weight is deliberately light."
    : `In the ${phase.name.toLowerCase()} phase you're working ${phase.repRange[0]}–${phase.repRange[1]} reps at around ${phase.rpe}/10 effort.`} Serves ${goalLabel.toLowerCase()}.`;
}

/* The coach's brief: what today is for, what's required of you, and how you'll
   know you got it right. Composed rather than templated — it should read like
   someone talking, not like a form with the slots showing. */
function buildBriefRules(day, phase, prog, state, exercises, bonus=false){
  const goal = GOAL_BY_ID[state.goal?.type];
  const [lo,hi] = phase.repRange;
  const deload = /deload/i.test(phase.name);
  const compounds = exercises.filter(e=>e.compound).map(e=>e.name);
  const groups = [...new Set(exercises.map(e=>e.primary))];
  const totalSets = exercises.reduce((n,e)=>n+e.sets,0);

  const purpose = bonus
    ? `You found time for an extra session, so this is the next workout in your block: ${day.name.toLowerCase()}. It follows the current ${phase.name.toLowerCase()} phase exactly — ${exercises.length} exercises, ${totalSets} sets, working ${groups.slice(0,4).join(", ").toLowerCase()}. It advances the block normally, while your weekly target stays at ${prog.dpw}.`
    : deload
    ? `This is your deload week, and today is meant to feel easy. The weights are about 60% of what you've been lifting. The work of the last few weeks is already done — this week is when it turns into progress, and the only way to get that wrong is to push.`
    : `Today is ${day.name.toLowerCase()} — ${exercises.length} exercises, ${totalSets} sets, working ${groups.slice(0,4).join(", ").toLowerCase()}. You're in week ${prog.week} of ${prog.total}, the ${phase.name.toLowerCase()} phase, and the job of this phase is ${phase.intent.charAt(0).toLowerCase()+phase.intent.slice(1).replace(/\.$/,"")}.`;

  let required = deload
    ? `Two sets per exercise, well short of failure, moving cleanly. Stop while it still feels like a warm-up.`
    : `Each set wants ${lo} to ${hi} reps at roughly ${phase.rpe} out of 10 effort — that's ${phase.rpe>=9?"a rep or less":phase.rpe>=8?"one to two reps":"two to three reps"} left in the tank. Take the last set of each exercise closer to the limit than the earlier ones. Control the lowering for two to three seconds; that's where most of the growth is, and it costs you nothing.${compounds.length?` ${compounds[0]} is the one that matters most today, so do it while you're freshest.` : ""}`;
  const pairs=supersetPairs({exercises});
  if(pairs.length) required += ` The ${pairs.map(p=>`${p.group}1/${p.group}2`).join(" and ")} accessory pair${pairs.length===1?"":"s"} ${pairs.length===1?"is":"are"} supersetted: move directly from the first exercise to the second, then take the displayed rest.`;

  const standard = deload
    ? `You'll know you've done it right if you leave feeling like you could have done the whole thing again.`
    : `You'll know it worked if you reach ${hi} reps on most sets with your form intact. Get there and the weight goes up next time — that's the whole mechanism. If you can't hit ${lo} with clean reps, the weight's too heavy, and dropping it is the fast way forward rather than the slow one.${goal ? ` All of it is in service of ${goal.label.toLowerCase()}.` : ""}`;

  /* An away-gym session looks like a downgrade unless something says otherwise.
     It gets the first paragraph, because "why is my session different today"
     is the question you have before any of the rest of this matters. */
  const away = travelOn(state) ? awayParagraph(state, exercises) : "";

  return [away, purpose, `**What's required.** ${required}`, `**The standard.** ${standard}`]
    .filter(Boolean).join("\n\n");
}

function awayParagraph(state, exercises){
  const t = state.travel;
  const missing = ["squat","hinge","pull_v","core","calf"]
    .filter(p=>!exercises.some(e=>e.pattern===p));
  const bits = [`**You're at ${t.name} today, not your usual gym**, so this is built from what's actually there.`];
  if(t.dumbbellMax) bits.push(`The heaviest dumbbells are ${t.dumbbellMax}kg, so where that's lighter than your working weight the reps go up instead — a set of 15 at 15kg is a real stimulus, it's just a different one.`);
  bits.push(missing.length
    ? `Some patterns aren't trainable here, so they're missing rather than faked. Pick them back up at home; one session doesn't undo a block.`
    : `Every movement pattern is still covered, so nothing is being skipped — the exercises are just different.`);
  return bits.join(" ");
}

function focusTipFor(day, phase){
  const tips = {
    squat:"Drive through the whole foot, not the toes.",
    hinge:"Squeeze the glutes at the top of every hip extension.",
    push_h:"Shoulder blades back and down before you press.",
    push_v:"Ribs down — don't arch to get the weight up.",
    pull_h:"Pull with your elbows, not your hands.",
    pull_v:"Start the pull by dropping the shoulder blades.",
  };
  const first = day.slots[0];
  const base  = tips[first] || "Control the lowering — that's where most of the growth is.";
  if(phase.name==="Deload") return "Deload week: light, crisp, and stop well short. That's the whole job.";
  return base;
}

/* ── Explain (form coaching) ──────────────────────────────────────────────── */

function explainRules(exId){
  const ex = EX_BY_ID[exId];
  if(!ex) return null;
  return { source:"rules", exId, ...ex.cues, why:ex.why };
}

/* ── Debrief ──────────────────────────────────────────────────────────────── */

function debriefRules(session, state){
  const rows = session.exercises.map(e=>{
    const logged = (e.log||[]).filter(x=>x && x.reps!=null);
    if(!logged.length) return null;
    const perf = performanceSummary(logged, e.repRange || [e.targetReps-2,e.targetReps]);
    const catalogEx=EX_BY_ID[e.exId];
    const inc=exerciseIncrement(catalogEx||e,state);
    const dec = progressionDecision(
      {lastAvgReps:perf.avgReps, lastEffort:perf.effort},
      e.repRange || [e.targetReps-2, e.targetReps], inc);
    return {name:e.name, avg:perf.avgReps, target:e.targetReps, dec, weight:perf.weight,
      nextWeight:availableWeight(catalogEx||e,perf.weight+dec.delta,state), sets:perf.allSets,
      workingSets:perf.sets, total:e.sets, volume:perf.volume};
  }).filter(Boolean);

  const ups   = rows.filter(r=>r.dec.action==="up");
  const downs = rows.filter(r=>r.dec.action==="down");
  const totalVolume = rows.reduce((n,r)=>n+r.volume,0);

  let headline;
  if(!rows.length) headline = "Nothing logged this session.";
  else if(ups.length >= rows.length*0.6) headline = "Strong session — most lifts earned a weight increase.";
  else if(downs.length > rows.length*0.4) headline = "A grinder. Several lifts came in short, so a few weights step back.";
  else headline = "Solid, workmanlike session. Progress where it was earned, holds where it wasn't.";

  const lines = [];
  if(ups.length)   lines.push(`**Going up next time:** ${ups.map(r=>r.name).join(", ")}.`);
  if(downs.length) lines.push(`**Stepping back:** ${downs.map(r=>r.name).join(", ")}. Not a setback — a smaller weight you can own beats a bigger one you can't.`);
  const holds = rows.filter(r=>r.dec.action==="hold");
  if(holds.length) lines.push(`**Holding:** ${holds.map(r=>r.name).join(", ")}. Chase an extra rep next time and the weight follows.`);
  if(session.swaps?.length) lines.push(`**Exercise swaps:** ${session.swaps.map(sw=>`${sw.fromName} → ${sw.toName} (${SWAP_REASON_BY_KEY[sw.reason]?.short||sw.reason}${sw.discomfortArea?`, ${DISCOMFORT_BY_KEY[sw.discomfortArea]?.label||sw.discomfortArea}`:""})`).join("; ")}.`);

  const body = lines.join("\n\n") || "Log your sets and the debrief will have something to work with.";
  const nextFocus = activeDiscomforts(state).length
    ? `Keep working around the active ${activeDiscomforts(state).map(x=>DISCOMFORT_BY_KEY[x.area].label.toLowerCase()).join(", ")} flag${activeDiscomforts(state).length===1?"":"s"}. Mark resolved only when the discomfort has settled.`
    : session.readiness?.key==="red"
    ? "You went in under-recovered. Prioritise sleep before the next one."
    : "Same session shape next time, with the adjusted weights above.";

  return {
    source:"rules",
    headline,
    body,
    nextFocus,
    voiceSummary: plainCoachText(`${headline} ${body} Next session: ${nextFocus}`),
    stats:{ volume: Math.round(totalVolume), exercises: rows.length, sets: rows.reduce((n,r)=>n+r.sets,0) },
    rows,
    stretches:recommendedStretches(session),
  };
}

/* ── Weekly review ────────────────────────────────────────────────────────── */

function weeklyReviewRules(state){
  const prog = blockProgress(state);
  if(!prog) return null;
  const window = trainingWeek(state);
  const since = state.sessions.filter(s=>s.date>=window.start && s.date<=window.end);
  const planned = since.filter(s=>!s.bonus);
  const extras = since.filter(s=>s.bonus);
  const target = prog.dpw;
  const adherence = Math.round(clamp(planned.length/target,0,1)*100);

  const e1rms = [];
  Object.entries(state.weights).forEach(([id,w])=>{
    const hist = state.exerciseHistory[id]||[];
    if(hist.length < 2) return;
    const first = hist[0], last = hist[hist.length-1];
    const a = estimate1RM(first.weight, first.avgReps||0);
    const b = estimate1RM(last.weight,  last.avgReps||0);
    if(a && b && b!==a) e1rms.push({name:EX_NAME[id]||id, delta: Math.round((b-a)*10)/10, pct: Math.round(((b-a)/a)*100)});
  });
  e1rms.sort((x,y)=>y.delta-x.delta);

  const lines = [];
  lines.push(`**${planned.length} of ${target} planned sessions** completed in this ${window.startName}-to-${WEEKDAYS[(window.startDay+6)%7]} training week.`);
  if(extras.length) lines.push(`Plus **${extras.length} optional extra session${extras.length===1?"":"s"}** — useful additional work, kept outside the plan's attendance count.`);
  if(adherence===100) lines.push("Full attendance. That's the single biggest driver of the result you're after.");
  else if(adherence>=66) lines.push("Solid attendance. One missed session in a week costs you very little.");
  else lines.push("Attendance slipped this week. If the schedule isn't realistic, lower the days per week rather than keep missing — a plan you complete beats a plan you don't.");

  if(e1rms.length){
    const up = e1rms.filter(e=>e.delta>0).slice(0,3);
    const dn = e1rms.filter(e=>e.delta<0).slice(0,2);
    if(up.length) lines.push(`**Climbing:** ${up.map(e=>`${e.name} (+${e.delta}kg est. 1RM)`).join(", ")}.`);
    if(dn.length) lines.push(`**Slipping:** ${dn.map(e=>e.name).join(", ")}. Worth checking sleep and food before changing anything in the plan.`);
  }
  if(prog.phase.name==="Deload") lines.push("You're in the deload week. Feeling underworked is the intended outcome.");

  const body = lines.join("\n\n");
  const headline = `Week ${prog.week} of ${prog.total} — ${prog.phase.name}`;
  return {
    source:"rules",
    headline,
    body,
    voiceSummary: plainCoachText(`${headline}. ${body}`),
    adherence,
    sessions: planned.length,
    bonusSessions: extras.length,
    target,
    weekWindow: window,
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   AI LAYER
   Direct browser calls to the Anthropic Messages API. Every method here has a
   rules-engine twin above; `coach` picks the AI path when a key is present and
   falls through silently when it isn't, or when the call fails.
   ═══════════════════════════════════════════════════════════════════════════ */

const API_URL = "https://api.anthropic.com/v1/messages";
const API_MODELS_URL = "https://api.anthropic.com/v1/models?limit=1";

function apiHeaders(key){
  return {
    "Content-Type":"application/json",
    "x-api-key":key,
    "anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true",
  };
}

class CoachError extends Error {
  constructor(msg, kind){ super(msg); this.kind = kind; }
}

/* ── The cached system block ──────────────────────────────────────────────
   Kept byte-stable on purpose: no timestamps, no random ids, no per-request
   content. Anything volatile belongs in the user turn instead, or the cache
   is invalidated on every call and we pay full price each time.            */

function coachIdentity(){
  return `You are the coach inside SnapFit, a training app. You are not a chatbot with a fitness theme — you are the user's coach, and you have their full training history.

How you talk:
- Direct and warm. A good coach in a gym, not a textbook and not a hype man.
- Say the thing. No hedging, no "it depends" without then saying what it depends on.
- Do not flatter, fawn, mirror the user's opinion, or praise effort that the evidence does not support. Agreement is earned by the facts.
- Praise only when it is specific and deserved. "You added 5kg with the same reps" is useful; "great job" on its own is noise.
- Explain the reasoning behind what you prescribe. The user is here to learn, not just to be told.
- Use their actual numbers. "Your leg press has gone 103 to 115 in four weeks" beats "you're progressing well".
- Australian English. Metric. No emoji unless the user uses them first.
- Never invent numbers you weren't given. If you don't have the data, say so.

Where your remit ends:
- You coach training and recovery. You can give general nutrition principles (protein targets, eating enough to support the goal) but you do not write meal plans or count calories.
- You are not a medical professional. Sharp, joint-centred or one-sided pain, anything that persists, or anything that worries them: say plainly that it needs a physio or doctor, and offer to work around it in the meantime.
- If asked about anabolic steroids or other performance-enhancing drugs, decline to advise on use and redirect to what training and recovery can do.`;
}

function coachStyleDigest(state){
  const style = {...DEFAULT_COACH_STYLE, ...(state.coachStyle||{})};
  const sass = clamp(Number(style.sass)||DEFAULT_COACH_STYLE.sass, 1, 5);
  const truth = clamp(Number(style.hardTruth)||DEFAULT_COACH_STYLE.hardTruth, 1, 5);
  const sassInstructions = [
    "Use no sass or jokes. Keep the delivery clean and neutral.",
    "Use at most one subtle dry aside when it genuinely helps the point land.",
    "Use occasional cheeky wit and a light jab at bad habits, never at the person.",
    "Use regular sharp, concise sass. Keep the coaching more memorable than polite.",
    "Bring maximum playful roast energy, but keep every barb about the behaviour or the numbers, never the person's body, identity or worth.",
  ];
  const truthInstructions = [
    "Deliver difficult feedback gently, but do not hide or change the verdict.",
    "Be candid. Name the problem plainly, then give a supportive next step.",
    "Lead with the verdict, support it with evidence, and finish with a concrete action.",
    "Be blunt about poor effort, weak consistency and excuses. State the likely consequence if nothing changes.",
    "Do not sugar-coat. Put the uncomfortable truth first, tie it to their actual data, and tell them exactly what must change.",
  ];
  return `COACH PERSONALITY — USER SETTINGS
SASS ${sass}/5 (${SASS_LEVELS[sass].label}): ${sassInstructions[sass-1]}
HARD TRUTH ${truth}/5 (${HARD_TRUTH_LEVELS[truth].label}): ${truthInstructions[truth-1]}

Calibration rules:
- Sass is wit, not contempt. Never insult, humiliate, body-shame, threaten, or use a protected trait as material.
- Hard truth means accurate, specific and actionable — not reckless certainty. If the evidence is mixed or missing, say that plainly.
- Never use pain, injury risk, disordered eating, punishment exercise, or unsafe loading as a punchline or a test of commitment.
- Do not invent a failure just to sound tough. Match the verdict to the logged numbers.`;
}

function equipmentDigest(state){
  const list = activeStations(state).map(s=>`#${s.num} ${s.name}`).join(" | ");
  let out = `EQUIPMENT AVAILABLE (only ever program these):\n${list}`;
  if(travelOn(state)){
    const t = state.travel;
    out = `TRAINING AWAY FROM THEIR USUAL GYM TODAY: "${t.name}". Program only what's listed below — their home gym's machines are NOT available. Acknowledge this in what you write and treat it as a session worth doing rather than a compromise.\n\n` + out;
    if(t.dumbbellMax) out += `\nHEAVIEST DUMBBELL HERE: ${t.dumbbellMax}kg. Never prescribe a dumbbell weight above it. If their working weight is higher, say so and add reps or slow the tempo instead.`;
    if(t.note)        out += `\nNOTES ON THIS VENUE: ${t.note}`;
  }
  return out;
}

function catalogueDigest(state){
  const pool = availableExercises(state);
  return `EXERCISE CATALOGUE (use these ids exactly):\n` + pool.map(e =>
    `${e.id} — "${e.name}" @${stationRequirement(e)} · ${PATTERN_LABEL[e.pattern]} · ${e.primary} · ${e.compound?"compound":"isolation"} · increment ${e.inc}kg`
  ).join("\n");
}

function goalDigest(state){
  const g = state.goal;
  if(!g) return "GOAL: not set yet.";
  const meta = GOAL_BY_ID[g.type] || {};
  const parts = [`GOAL: ${meta.label||g.type}`];
  if(g.targetValue) parts.push(`target ${g.targetValue}${g.unit||""}`);
  if(g.targetDate)  parts.push(`by ${g.targetDate}`);
  if(g.startValue)  parts.push(`starting from ${g.startValue}`);
  if(g.why)         parts.push(`their reason: "${g.why}"`);
  return parts.join(" · ");
}

function profileDigest(state){
  const p = state.profile, l = state.limits;
  const bits = [
    p.age ? `${p.age}yo` : null,
    p.sex || null,
    p.heightCm ? `${p.heightCm}cm` : null,
    `${p.experience} lifter`,
    `${p.daysPerWeek} days/week`,
    `${p.sessionMinutes} min sessions`,
    `accessory supersets ${p.useSupersets===false?"off":"on"}`,
    `free-weight preference ${p.freeWeightPct}%`,
    `training week starts ${WEEKDAYS[clamp(Number(p.weekStartsOn??1),0,6)]}`,
  ].filter(Boolean);
  const lims = Object.entries({knees:"knees",shoulders:"shoulders",back:"lower back",ankles:"ankles",elbows:"elbows"})
    .filter(([k])=>l[k]).map(([,v])=>v);
  let s = `LIFTER: ${bits.join(" · ")}`;
  if(lims.length) s += `\nAVOID LOADING: ${lims.join(", ")} — program around these, never through them.`;
  const discomforts=activeDiscomforts(state);
  if(discomforts.length) s += `\nACTIVE DISCOMFORT FLAGS: ${discomforts.map(x=>{
    const area=DISCOMFORT_BY_KEY[x.area]?.label||x.area;
    return `${area}${x.exerciseName?` (flagged during ${x.exerciseName})`:""} on ${x.date||"an earlier session"}`;
  }).join("; ")}. Treat these as temporary safety constraints, do not diagnose them, and never encourage training through pain.`;
  if(l.note)      s += `\nTHEIR NOTE: "${l.note}"`;
  return s;
}

function strengthDigest(state){
  const rows = Object.entries(state.weights)
    .filter(([id])=>EX_BY_ID[id])
    .map(([id,w])=>`${EX_NAME[id]}: ${w.weight}kg × ${w.lastAvgReps??"?"} reps (felt: ${w.lastEffort||"n/a"}, est 1RM ${estimate1RM(w.weight,w.lastAvgReps||0)}kg)`);
  return rows.length ? `CURRENT WORKING WEIGHTS:\n${rows.join("\n")}` : "CURRENT WORKING WEIGHTS: none logged yet — this is their first session.";
}

function journeyDigest(state){
  const sessions=(state.sessions||[]).filter(s=>s?.finishedAt);
  if(!sessions.length) return "WHOLE TRAINING JOURNEY: no completed sessions yet.";
  const dates=sessions.map(s=>s.date).filter(Boolean).sort();
  let workingSets=0,totalReps=0;
  const exerciseCounts={};
  sessions.forEach(s=>(s.exercises||[]).forEach(e=>{
    const logged=(e.log||[]).filter(x=>x&&x.reps!=null);
    if(!logged.length) return;
    workingSets+=logged.length;
    totalReps+=logged.reduce((n,x)=>n+(Number(x.reps)||0),0);
    exerciseCounts[e.exId]=(exerciseCounts[e.exId]||0)+1;
  }));
  const mostUsed=Object.entries(exerciseCounts).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([id,n])=>`${EX_NAME[id]||id} (${n} sessions)`).join(", ");
  const trends=Object.entries(state.exerciseHistory||{}).map(([id,rows])=>{
    const valid=(rows||[]).filter(r=>Number(r.weight)>0 && Number(r.avgReps)>0);
    if(valid.length<2) return null;
    const first=valid[0],last=valid[valid.length-1];
    return {uses:valid.length,text:`${EX_NAME[id]||id}: ${first.weight}kg × ${first.avgReps} avg → ${last.weight}kg × ${last.avgReps} avg across ${valid.length} logged sessions`};
  }).filter(Boolean).sort((a,b)=>b.uses-a.uses).slice(0,10).map(x=>x.text);
  return [
    `WHOLE TRAINING JOURNEY: ${sessions.length} completed sessions from ${dates[0]||"unknown"} to ${dates[dates.length-1]||"unknown"}, ${workingSets} logged working sets and ${totalReps} logged reps.`,
    mostUsed?`MOST CONSISTENT EXERCISES ACROSS THE JOURNEY: ${mostUsed}.`:"",
    trends.length?`LONG-RANGE PROGRESSION:\n${trends.map(x=>`- ${x}`).join("\n")}`:"",
    "Use this whole-journey summary for long-range decisions. The recent-session section below supplies the detailed set-by-set context.",
  ].filter(Boolean).join("\n");
}

function historyDigest(state, n=8){
  const s = state.sessions.slice(0,n);
  if(!s.length) return "RECENT SESSIONS: none yet.";
  return "RECENT SESSIONS (newest first):\n" + s.map(x=>{
    const ex = x.exercises.map(e=>{
      const logged=(e.log||[]).filter(y=>y&&y.reps!=null);
      if(!logged.length) return null;
      const perf=performanceSummary(logged,e.repRange||[Math.max(1,e.targetReps-2),e.targetReps]);
      return `${EX_NAME[e.exId]||e.exId} working load ${perf.weight}kg, ${perf.sets} set${perf.sets===1?"":"s"} at avg ${perf.avgReps} reps (${perf.effort}); all sets: ${logged.map(y=>`${y.weight}kg×${y.reps}`).join(", ")}`;
    }).filter(Boolean).join("; ");
    const swaps=(x.swaps||[]).map(sw=>`${sw.fromName} → ${sw.toName} (${SWAP_REASON_BY_KEY[sw.reason]?.short||sw.reason}${sw.discomfortArea?`, ${DISCOMFORT_BY_KEY[sw.discomfortArea]?.label||sw.discomfortArea}`:""})`).join("; ");
    return `${x.date} [${x.bonus?"BONUS · ":""}${x.dayName}${x.readiness?`, felt ${x.readiness.label.toLowerCase()}`:""}]: ${ex||"nothing logged"}${swaps?` | swaps: ${swaps}`:""}`;
  }).join("\n");
}

function blockDigest(state){
  const b = state.block, prog = blockProgress(state);
  if(!b || !prog) return "CURRENT BLOCK: none — they need one built.";
  return `CURRENT BLOCK: "${b.name}", week ${prog.week} of ${prog.total}, phase "${prog.phase.name}" (${prog.phase.repRange[0]}-${prog.phase.repRange[1]} reps, ${prog.phase.sets} sets, RPE ~${prog.phase.rpe}).\nPHASE INTENT: ${prog.phase.intent}`;
}

function notesDigest(state){
  const n = (state.coachNotes||[]).slice(-8);
  return n.length ? `YOUR EARLIER OBSERVATIONS:\n${n.map(x=>`- ${x}`).join("\n")}` : "";
}

function buildSystemBlock(state, extra){
  return [
    coachIdentity(),
    coachStyleDigest(state),
    goalDigest(state),
    profileDigest(state),
    equipmentDigest(state),
    catalogueDigest(state),
    blockDigest(state),
    journeyDigest(state),
    strengthDigest(state),
    historyDigest(state),
    notesDigest(state),
    extra||"",
  ].filter(Boolean).join("\n\n───\n\n");
}

/* ── Transport ────────────────────────────────────────────────────────────── */

function schemaForAnthropic(schema){
  const copy = JSON.parse(JSON.stringify(schema));
  const visit = value=>{
    if(!value || typeof value!=="object") return;
    /* Anthropic currently accepts array minItems only as 0 or 1. Keep this
       transport guard even though the declared schemas are compatible, so a
       future Snap schema cannot take the whole coach offline again. */
    if(value.type==="array" && Number(value.minItems)>1) value.minItems=1;
    Object.values(value).forEach(visit);
  };
  visit(copy);
  return copy;
}

function jsonFallbackContent(content,schema){
  const instruction=`The structured-output service was unavailable. Return ONLY one valid JSON object matching this schema. Do not use markdown fences or add commentary.\n${JSON.stringify(schemaForAnthropic(schema))}`;
  return Array.isArray(content) ? [...content,{type:"text",text:instruction}] : `${content}\n\n${instruction}`;
}

function parseCoachJson(text){
  const raw=String(text||"").trim();
  try{ return JSON.parse(raw); }catch{}
  const unfenced=raw.replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/i,"").trim();
  try{ return JSON.parse(unfenced); }catch{}
  const start=unfenced.indexOf("{");
  const end=unfenced.lastIndexOf("}");
  if(start>=0 && end>start) return JSON.parse(unfenced.slice(start,end+1));
  throw new SyntaxError("No JSON object in coach response");
}

async function callAnthropic({state, key, model, userText, schema, effort="low", maxTokens=4000, systemExtra, timeoutMs=45000}){
  if(!key) throw new CoachError("No API key","nokey");
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try{
    const body = {
      model: model || DEFAULT_MODEL,
      max_tokens: maxTokens,
      system: [{ type:"text", text: buildSystemBlock(state, systemExtra), cache_control:{type:"ephemeral"} }],
      messages: [{ role:"user", content: userText }],
      output_config: { effort },
    };
    if(schema) body.output_config.format = { type:"json_schema", schema:schemaForAnthropic(schema) };

    let res = await fetch(API_URL, {method:"POST", headers:apiHeaders(key), body:JSON.stringify(body), signal:ctrl.signal});
    /* Chat uses plain text and can remain healthy while Anthropic rejects the
       separate structured-output grammar. A 400 here is therefore a format
       failure, not proof that the coach is offline. Retry once as JSON text;
       the same local domain validation still runs before Snap accepts it. */
    if(!res.ok && schema && res.status===400){
      const fallbackBody={...body,
        messages:[{role:"user",content:jsonFallbackContent(userText,schema)}],
        output_config:{effort}};
      res = await fetch(API_URL, {method:"POST", headers:apiHeaders(key), body:JSON.stringify(fallbackBody), signal:ctrl.signal});
    }
    if(!res.ok){
      let msg = `HTTP ${res.status}`;
      try{ const j = await res.json(); msg = j?.error?.message || msg; }catch{}
      const kind=res.status===401?"auth":res.status===429?"rate":"http";
      saveApiStatus(false,kind,msg);
      throw new CoachError(msg,kind);
    }
    const data = await res.json();
    if(data.stop_reason === "refusal") throw new CoachError("The model declined that request.","refusal");

    // Thinking blocks can precede text — never index content[0] blindly.
    const textBlock = (data.content||[]).find(b=>b.type==="text");
    const text = textBlock ? textBlock.text : "";
    if(!text) throw new CoachError("Empty response","empty");

    if(typeof window!=="undefined" && window.__snapfitDebug){
      console.log("[snapfit] usage", data.usage);
    }
    saveApiStatus(true);
    if(!schema) return text;
    try{ return parseCoachJson(text); }
    catch{
      saveApiStatus(false,"response","The coach returned an unreadable structured response");
      throw new CoachError("The coach returned an unreadable response.","response");
    }
  } catch(err){
    if(err instanceof CoachError) throw err;
    const timedOut=err?.name==="AbortError";
    const kind=timedOut?"timeout":"network";
    const msg=timedOut?"The coach request timed out":"The browser could not reach the Anthropic API";
    saveApiStatus(false,kind,msg);
    throw new CoachError(msg,kind);
  } finally { clearTimeout(timer); }
}

function buildLeanCoachBlock(state, extra){
  return [
    coachIdentity(),
    coachStyleDigest(state),
    goalDigest(state),
    profileDigest(state),
    blockDigest(state),
    extra||"",
  ].filter(Boolean).join("\n\n---\n\n");
}

async function streamAnthropic({state, key, model, messages, onDelta, signal, systemExtra, lean=false}){
  if(!key) throw new CoachError("No API key","nokey");
  try{
  const body = {
    model: model || DEFAULT_MODEL,
    max_tokens: 3000,
    stream: true,
    system: [{ type:"text", text: lean ? buildLeanCoachBlock(state, systemExtra) : buildSystemBlock(state, systemExtra), cache_control:{type:"ephemeral"} }],
    messages,
    output_config: { effort:"medium" },
  };
  const res = await fetch(API_URL, {method:"POST", headers:apiHeaders(key), body:JSON.stringify(body), signal});
  if(!res.ok){
    let msg = `HTTP ${res.status}`;
    try{ const j = await res.json(); msg = j?.error?.message || msg; }catch{}
    const kind=res.status===401?"auth":res.status===429?"rate":"http";
    saveApiStatus(false,kind,msg);
    throw new CoachError(msg,kind);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", out = "";
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split("\n");
    buf = lines.pop();
    for(const line of lines){
      if(!line.startsWith("data:")) continue;
      const payload = line.slice(5).trim();
      if(!payload || payload==="[DONE]") continue;
