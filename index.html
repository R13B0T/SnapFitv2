      let ev; try{ ev = JSON.parse(payload); }catch{ continue; }
      if(ev.type==="content_block_delta" && ev.delta?.type==="text_delta"){
        out += ev.delta.text;
        onDelta(ev.delta.text, out);
      }
      if(ev.type==="message_delta" && ev.delta?.stop_reason==="refusal"){
        throw new CoachError("The model declined that request.","refusal");
      }
    }
  }
  saveApiStatus(true);
  return out;
  }catch(err){
    if(err instanceof CoachError || err?.name==="AbortError") throw err;
    const msg="The browser could not reach the Anthropic API";
    saveApiStatus(false,"network",msg);
    throw new CoachError(msg,"network");
  }
}

/* ── Photos ───────────────────────────────────────────────────────────────
   A phone camera hands you 8-12MB and 4000px of gym photo. Base64 inflates it
   by a third on top of that, and the API caps an image at 5MB. Sending it raw
   would fail on mobile data before it ever reached the model, so every photo is
   drawn through a canvas at a sane size first — 1400px on the long edge is more
   than enough to read a dumbbell rack, and lands around 200-400KB.          */

const PHOTO_MAX_EDGE = 1400;
const PHOTO_QUALITY  = 0.82;
const PHOTO_MAX      = 3;      // one photo rarely captures a whole room

async function shrinkImage(file, maxEdge=PHOTO_MAX_EDGE){
  if(!/^image\//.test(file.type||"")) throw new CoachError("That's not an image file.","photo");
  let bmp;
  try{ bmp = await createImageBitmap(file); }
  catch{ throw new CoachError("Couldn't read that image — try a JPEG or PNG.","photo"); }

  const scale = Math.min(1, maxEdge/Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width*scale));
  const h = Math.max(1, Math.round(bmp.height*scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
  bmp.close?.();

  const dataUrl = canvas.toDataURL("image/jpeg", PHOTO_QUALITY);
  const b64 = dataUrl.split(",")[1] || "";
  if(!b64) throw new CoachError("Couldn't process that image.","photo");
  return { b64, mediaType:"image/jpeg", w, h, bytes: Math.round(b64.length*3/4), preview: dataUrl };
}

/* ── Schemas ────────────────────────────────────────────────────────────────
   Anthropic's structured-output subset accepts array minItems only as 0 or 1.
   Snap's stricter domain minima are checked after the response is parsed. */

const S_BLOCK = {
  type:"object", additionalProperties:false,
  required:["name","rationale","phases"],
  properties:{
    name:{type:"string", description:"Short name for the block, e.g. '8 week hypertrophy block'"},
    rationale:{type:"string", description:"2-3 sentences: why this block, for this person, for this goal. Plain language, second person."},
    phases:{ type:"array", minItems:1, maxItems:5, items:{
      type:"object", additionalProperties:false,
      required:["name","weeks","sets","repRange","rpe","restMult","intent"],
      properties:{
        name:{type:"string"},
        weeks:{type:"integer"},
        sets:{type:"integer"},
        repRange:{type:"array", items:{type:"integer"}, minItems:1, maxItems:2},
        rpe:{type:"integer"},
        restMult:{type:"number"},
        intent:{type:"string", description:"One or two sentences the user reads: what this phase is for and how it should feel."},
      }}},
  }};

const S_SESSION = {
  type:"object", additionalProperties:false,
  required:["brief","focusTip","exercises"],
  properties:{
    brief:{type:"string", description:"The coach's brief for today, read before they start. Markdown, 2-3 short paragraphs, second person. Cover three things: what this session is for and how it serves their goal; what's required of them to make it count (rep range, effort level, tempo, which exercise matters most); and the standard — how they'll know they got it right, and what to do if they can't hit it. Reference their own numbers where you have them. Write it as a coach talking, not a summary."},
    focusTip:{type:"string", description:"One coaching cue for today, max 16 words."},
    adaptationNote:{type:"string", description:"If you changed the session because of their check-in or recent performance, one sentence saying what and why. Empty string if unchanged."},
    exercises:{ type:"array", minItems:1, maxItems:8, items:{
      type:"object", additionalProperties:false,
      required:["exId","sets","targetReps","weight","rest","why"],
      properties:{
        exId:{type:"string", description:"Must be an id from the exercise catalogue."},
        sets:{type:"integer"},
        targetReps:{type:"integer"},
        weight:{type:"number", description:"Working weight in kg, a sensible increment from their logged history."},
        rest:{type:"integer", description:"Rest in seconds."},
        why:{type:"string", description:"Why this exercise is in today's session, tied to their goal and phase. 1-2 sentences, second person."},
      }}},
  }};

const S_EXPLAIN = {
  type:"object", additionalProperties:false,
  required:["setup","execution","mistakes","feel","why"],
  properties:{
    setup:{type:"string"},
    execution:{type:"string"},
    mistakes:{type:"array", items:{type:"string"}, minItems:1, maxItems:5},
    feel:{type:"string"},
    why:{type:"string", description:"Why this exercise earns its place in THEIR plan, referencing their goal."},
  }};

const S_DEBRIEF = {
  type:"object", additionalProperties:false,
  required:["headline","body","nextFocus","voiceSummary"],
  properties:{
    headline:{type:"string", description:"One sentence verdict on the session."},
    body:{type:"string", description:"2-4 short paragraphs in markdown. What happened, what it means, what changes. Reference their actual numbers."},
    nextFocus:{type:"string", description:"One concrete thing to focus on next session."},
    voiceSummary:{type:"string", description:"A natural spoken recap, 35-70 words. Lead with the verdict, use their numbers, then say what happens next. No markdown, headings or lists."},
    note:{type:"string", description:"Optional: one short observation worth remembering across sessions. Empty string if none."},
  }};

const S_REVIEW = {
  type:"object", additionalProperties:false,
  required:["headline","body","voiceSummary"],
  properties:{
    headline:{type:"string"},
    body:{type:"string", description:"Markdown. Progress against their goal, what's working, what to change. Reference real numbers."},
    voiceSummary:{type:"string", description:"A natural spoken weekly recap, 40-80 words. Verdict, evidence, and one change. No markdown, headings or lists."},
    note:{type:"string", description:"Optional observation to carry forward. Empty string if none."},
  }};

/* Reading a gym off a photo. `confidence` matters more than it looks: the user
   confirms this list before it's used, and flagging the guesses is what makes
   the confirmation step quick instead of a full audit. */
const S_GYM = {
  type:"object", additionalProperties:false,
  required:["name","stations","summary"],
  properties:{
    name:{type:"string", description:"A short label for this place, 3-4 words max, e.g. 'Hotel gym' or 'Apartment gym'. Guess from what you can see. No punctuation."},
    stations:{ type:"array", maxItems:40, items:{
      type:"object", additionalProperties:false,
      required:["num","confidence"],
      properties:{
        num:{type:"string", description:"The station number from the STATION LIST you were given. Only ever numbers from that list."},
        confidence:{type:"string", enum:["sure","likely","unsure"], description:"'sure' means you can clearly see it. 'likely' means you can see part of it or it's partly obscured. 'unsure' means you're inferring it from context — say a bench you can only see the end of."},
        seen:{type:"string", description:"What in the photo made you say this, max 12 words. The user reads this to check your work."},
      }}},
    extras:{ type:"array", maxItems:10, items:{
      type:"object", additionalProperties:false,
      required:["name"],
      properties:{
        name:{type:"string", description:"Equipment you can see that is NOT in the station list, e.g. 'Treadmill', 'Kettlebells', 'Resistance bands'."},
        note:{type:"string", description:"Anything useful about it, max 12 words. Empty string if nothing to add."},
      }}},
    dumbbellMax:{type:"number", description:"The heaviest single dumbbell you can actually read a number on, in kg. 0 if you can't read any numbers — do not guess from size, a wrong ceiling is worse than none."},
    note:{type:"string", description:"What a coach would want to know about training here that the equipment list doesn't say: how limited it is, what's conspicuously missing, cable or plate loading, anything about space. 1-2 sentences. Empty string if nothing to add."},
    summary:{type:"string", description:"One or two sentences to the user about what you can see and what kind of session it supports. Second person, coach's voice, no list — they can already see the list."},
  }};

/* ── The coach facade ─────────────────────────────────────────────────────── */

function makeCoach(getState, getKey, getModel, onFallback){
  const fallback = (kind, err) => { try{ onFallback && onFallback(kind, err); }catch{} };

  function rejectAIResponse(message){
    saveApiStatus(false,"response",message);
    throw new CoachError(message,"response");
  }

  async function tryAI(fn, rulesFn, kind){
    const key = getKey();
    if(!key) return rulesFn();
    try{
      const out = await fn(key);
      return out;
    }catch(err){
      if(err?.kind !== "nokey") fallback(kind, err);
      return rulesFn();
    }
  }

  return {
    async buildBlock(){
      const state = getState();
      return tryAI(async key=>{
        const g = GOAL_BY_ID[state.goal?.type];
        const raw = await callAnthropic({
          state, key, model:getModel(), schema:S_BLOCK, effort:"medium", maxTokens:5000,
          userText:`Design a training block for this person.

They train ${state.profile.daysPerWeek} days a week in ${state.profile.sessionMinutes}-minute sessions, and their goal is ${g?.label||"general fitness"}${state.goal?.targetDate?` by ${state.goal.targetDate}`:""}.

Requirements:
- Between 4 and 10 weeks total.
- Between 2 and 4 working phases, then a final deload phase of 1 week.
- Rep ranges, set counts and RPE should suit the goal and their experience level.
- restMult is a multiplier on standard rest (1.0 = normal, 1.4 = long rests for heavy strength work, 0.8 = short rests for density work).
- The "intent" of each phase is read by the user. Write it to them, in plain language, saying what the phase is for and how it should feel.`,
        });
        if(!Array.isArray(raw?.phases) || raw.phases.length < 2 || raw.phases.length > 5){
          rejectAIResponse("The coach returned an invalid number of training phases");
        }
        if(raw.phases.some(p=>!Array.isArray(p?.repRange) || p.repRange.length !== 2)){
          rejectAIResponse("The coach returned an invalid phase rep range");
        }
        const totalWeeks = raw.phases.reduce((n,p)=>n+(p.weeks||1),0);
        if(totalWeeks < 4 || totalWeeks > 10){
          rejectAIResponse("The coach returned a block outside the 4 to 10 week range");
        }
        return { id:uid(), source:"ai", name:raw.name, rationale:raw.rationale,
          phases: raw.phases.map(p=>({...p, repRange:[p.repRange[0],p.repRange[1]]})),
          totalWeeks, startedAt: todayISO(),
          createdFrom:{goal:state.goal?.type, days:state.profile.daysPerWeek, mins:state.profile.sessionMinutes} };
      }, ()=>buildBlockRules(state), "block");
    },

    async todaysSession(checkin, {bonus=false,regenerateReason=""}={}){
      const state = getState();
      const rules = ()=>buildSessionRules(state, checkin, {bonus,regenerateReason});
      const base  = rules();
      if(!base) return null;
      return tryAI(async key=>{
        const prog = blockProgress(state);
        const week = trainingWeek(state);
        const adj  = readinessAdjustment(checkin);
        const ci   = checkin
          ? `Their check-in just now: sleep ${checkin.sleep}/5, energy ${checkin.energy}/5, soreness ${checkin.soreness}/5, stress ${checkin.stress}/5. Readiness reads as "${adj.label}". They have ${checkin.availableMinutes||state.profile.sessionMinutes} minutes.${checkin.note?` They added: "${String(checkin.note).slice(0,300)}"`:""}`
          : "They skipped the check-in today.";
        const raw = await callAnthropic({
          state, key, model:getModel(), schema:S_SESSION, effort:"low", maxTokens:4000,
          userText:`Build today's ${bonus?"optional bonus":"planned"} session. Today is ${todayISO()}.

It's block week ${prog.week} of ${prog.total}, phase "${prog.phase.name}". Their current training week runs ${week.start} to ${week.end} (${week.startName} start). The planned shape for today is "${base.dayName}" covering these movement patterns: ${base.exercises.map(e=>PATTERN_LABEL[e.pattern]).join(", ")}.

${ci}

${regenerateReason?`This is a regeneration. The user rejected the previous draft because: "${regenerateReason}". Build a meaningfully different session while keeping the same block week, phase and required movement balance.`:""}

${bonus?`They found an extra training window. This must still be the NEXT workout in their current block and follow the ${prog.phase.name} phase's normal sets, rep range, RPE and progression. It advances the block normally; only their weekly target remains ${prog.dpw}.`:"This is the next scheduled day in their weekly split."}

Rules:
- Exactly ${base.exercises.length} exercises, using ids from the catalogue only.
- Cover the movement patterns above. Keep the balance between pushing and pulling.
- Set weights from their logged history and the progression it implies. If they hit the top of the rep range last time, add an increment. If they came up short, hold or drop. First time on a lift, pick something conservative. The app validates this progression maths and may correct a proposed load so it never contradicts the logged working set.
- Respect the phase's rep range and set count, and adjust for their check-in if it warrants it.
- "why" is read at the rack between sets. Make it specific to them and worth reading.`,
        });
        if(!Array.isArray(raw?.exercises) || raw.exercises.length !== base.exercises.length){
          rejectAIResponse(`The coach returned ${raw?.exercises?.length||0} exercises instead of ${base.exercises.length}`);
        }
        if(new Set(raw.exercises.map(r=>r?.exId)).size !== raw.exercises.length){
          rejectAIResponse("The coach returned duplicate exercises");
        }
        const byId = Object.fromEntries(base.exercises.map(e=>[e.exId,e]));
        const exercises = raw.exercises.map(r=>{
          const ex = EX_BY_ID[r.exId];
          if(!ex) return null;
          const seed = byId[r.exId];
          const calculated = seed || (()=>{
            const ww = workingWeight(ex, state, prog.phase);
            return {weight:availableWeight(ex,capForVenue(ex, ww.weight * adj.loadMult, state),state),
              decisionLabel:ww.decision?.label||"", decisionColor:ww.decision?.color||C.faint};
          })();
          return { exId:ex.id, name:ex.name, stations:stationsForExercise(ex, state), pattern:ex.pattern, primary:ex.primary,
            compound:ex.compound,kind:ex.kind,
            sets:clamp(r.sets,1,6),
            targetReps:clamp(r.targetReps,1,30),
            repRange: base.exercises[0]?.repRange || prog.phase.repRange,
            weight:calculated.weight, inc:exerciseIncrement(ex,state), rpe:prog.phase.rpe,
            rest: clamp(r.rest, 30, 240),
            tempo:tempoPrescription(ex,prog.phase),
            decisionLabel: calculated.decisionLabel || "", decisionColor: calculated.decisionColor || C.faint,
            why: r.why };
        }).filter(Boolean);
        if(exercises.length !== base.exercises.length){
          rejectAIResponse("The coach returned an exercise outside Snap's catalogue");
        }
        const plannedExercises=assignSupersets(exercises,state,prog.phase);
        return {...base, source:"ai", brief:raw.brief || base.brief,
          focusTip:raw.focusTip,
          adaptationNote:[base.adaptationNote,raw.adaptationNote].filter(Boolean).join(" "), exercises:plannedExercises};
      }, rules, "session");
    },

    async explain(exId){
      const state = getState();
      const ex = EX_BY_ID[exId];
      return tryAI(async key=>{
        const entry = state.weights[exId];
        const raw = await callAnthropic({
          state, key, model:getModel(), schema:S_EXPLAIN, effort:"low", maxTokens:2500,
          userText:`Coach them through "${ex.name}" (${stationRequirement(ex)}).
${entry ? `They're currently working at ${entry.weight}kg for about ${entry.lastAvgReps} reps and last logged it as "${entry.lastEffort}".` : "They haven't logged this one before."}

Write it as if you're standing at the machine with them. Setup, then how to execute the rep, the mistakes you actually see people make on this exercise, and what it should feel like when it's right. Then why it's in their plan specifically.`,
        });
        if(!Array.isArray(raw?.mistakes) || raw.mistakes.length < 2 || raw.mistakes.length > 5){
          rejectAIResponse("The coach returned an invalid exercise explanation");
        }
        return {source:"ai", exId, ...raw};
      }, ()=>explainRules(exId), "explain");
    },

    async debrief(session){
      const state = getState();
      const rules = ()=>debriefRules(session, state);
      return tryAI(async key=>{
        const deterministic = rules();
        const lines = session.exercises.map(e=>{
          const logged=(e.log||[]).filter(x=>x&&x.reps!=null);
          if(!logged.length) return `${e.name}: not logged`;
          return `${e.name} — prescribed ${e.weight}kg, ${e.sets}×${e.targetReps} — actual ${logged.map(x=>`${x.weight}kg×${x.reps} (${x.effort||"?"})`).join(", ")}`;
        }).join("\n");
        const raw = await callAnthropic({
          state, key, model:getModel(), schema:S_DEBRIEF, effort:"medium", maxTokens:3000,
          userText:`They just finished this ${session.bonus?"optional bonus":"planned"} session (${session.dayName}, week ${session.week}, ${session.phaseName} phase). Today is ${todayISO()}.

${lines}

${session.swaps?.length ? `Exercise swaps recorded:\n${session.swaps.map(sw=>`${sw.fromName} -> ${sw.toName}: ${SWAP_REASON_BY_KEY[sw.reason]?.label||sw.reason}${sw.discomfortArea?` (${DISCOMFORT_BY_KEY[sw.discomfortArea]?.label||sw.discomfortArea})`:""}`).join("\n")}` : "No exercise swaps were recorded."}

${session.readiness ? `They went in reading as "${session.readiness.label}".` : ""}

The app's progression calculation, based on the heaviest productive working set, is:
${deterministic.rows.map(r=>`${r.name}: ${r.weight}kg working load -> ${r.nextWeight}kg next time (${r.dec.action})`).join("\n")}

Debrief it. What actually happened, what it means for their goal, and what changes next time. Use their numbers. Do not contradict the progression calculation above. Don't be congratulatory about a session that wasn't good, and don't be grim about one that was fine.`,
        });
        const r = deterministic;
        return {...r, source:"ai", headline:raw.headline, body:raw.body, nextFocus:raw.nextFocus,
          voiceSummary:raw.voiceSummary || plainCoachText(`${raw.headline} ${raw.body} Next session: ${raw.nextFocus}`),
          note:raw.note||""};
      }, rules, "debrief");
    },

    async weeklyReview(){
      const state = getState();
      const rules = ()=>weeklyReviewRules(state);
      return tryAI(async key=>{
        const r = rules();
        const raw = await callAnthropic({
          state, key, model:getModel(), schema:S_REVIEW, effort:"medium", maxTokens:3000,
          userText:`Write their weekly review. Today is ${todayISO()}. This is block week ${blockProgress(state).week} of ${blockProgress(state).total}. Their configured training week runs ${r.weekWindow.start} to ${r.weekWindow.end}, starting ${r.weekWindow.startName}. They completed ${r.sessions} of ${r.target} planned sessions in that training week${r.bonusSessions?`, plus ${r.bonusSessions} optional extra session${r.bonusSessions===1?"":"s"}`:""}.

Cover: how the week went, progress against their goal specifically, what's working, and one thing to change. Reference real lifts and numbers from their history. Be honest if the week was poor.`,
        });
        return {...r, source:"ai", headline:raw.headline, body:raw.body,
          voiceSummary:raw.voiceSummary || plainCoachText(`${raw.headline}. ${raw.body}`),
          note:raw.note||""};
      }, rules, "review");
    },

    chatStream({messages, onDelta, signal}){
      const state = getState();
      const prog = blockProgress(state), week = trainingWeek(state);
      return streamAnthropic({state, key:getKey(), model:getModel(), messages:messages.slice(-CHAT_CONTEXT_MESSAGES), onDelta, signal,
        systemExtra:`They are chatting with you now. Today is ${todayISO()}. They are in block week ${prog?.week||"?"} of ${prog?.total||"?"}; their configured ${week.startName}-start training week is ${week.start} to ${week.end}. Answer using their real history above. Keep replies tight — a few short paragraphs at most unless they ask for depth. Markdown is fine.`});
    },

    setChatStream({exercise, logs, setIndex, messages, onDelta, signal}){
      const state = getState();
      const prog = blockProgress(state), week = trainingWeek(state);
      const logged = (logs||[]).filter(x=>x&&x.reps!=null);
      const setContext = logged.length
        ? logged.map((x,i)=>`Set ${i+1}: ${x.weight}kg x ${x.reps}, effort ${x.effort||"not rated"}`).join("\n")
        : "No sets logged yet.";
      return streamAnthropic({state, key:getKey(), model:getModel(), messages:messages.slice(-6), onDelta, signal, lean:true,
        systemExtra:`LIVE SET COACHING. Today is ${todayISO()}, block week ${prog?.week||"?"}, ${week.startName}-start training week ${week.start} to ${week.end}.
The question is specifically about ${exercise.name}, set ${setIndex+1}. Prescription: ${exercise.weight}kg, ${exercise.sets} sets of ${exercise.targetReps}, RPE ${exercise.rpe||"not set"}, rest ${exercise.rest}s.
Logged so far:\n${setContext}
Answer the immediate set question directly and briefly. Use only this exercise context plus their goal/profile/block. If pain, dizziness, loss of control or a possible injury is mentioned, tell them to stop the set; do not diagnose. Do not invent unlogged reps or weights.`});
    },

    postSessionChatStream({session,debrief,messages,onDelta,signal}){
      const state=getState();
      const rows=(session?.exercises||[]).map(e=>{
        const logged=(e.log||[]).filter(x=>x&&x.reps!=null);
        return `${e.name}: prescribed ${e.weight}kg, logged ${logged.length?logged.map(x=>`${x.weight}kg x ${x.reps} (${x.effort||"not rated"})`).join(", "):"nothing"}`;
      }).join("\n");
      return streamAnthropic({state,key:getKey(),model:getModel(),messages:messages.slice(-6),onDelta,signal,lean:true,
        systemExtra:`POST-SESSION CLARIFICATION for the workout just completed.\n${rows}\n\nInitial debrief: ${debrief?.headline||""} ${plainCoachText(debrief?.body||"")}\n\nAnswer questions about what happened in this session. Treat the user's clarification as authoritative when it explains an abnormal set, equipment issue, deliberate test, or logging mistake. Do not diagnose symptoms. Do not recommend changing the wider plan merely from one unusual session. If their clarification should stop an AI observation carrying forward, say so plainly. Keep the answer concise.`});
    },

    /* Read a gym off photos.

       The only coach method with no rules twin: there is no offline way to
       look at a picture, so this one throws rather than falling through to
       something worse. The UI offers the by-hand path instead, which is why
       the feature still works with no key at all.

       The station list goes in the USER turn, not the system block. The system
       block's equipment digest lists what's available *now* — which, if an away
       gym is already active, is exactly the wrong list to match against, and
       putting the full catalogue there would break the cache for every other
       call. */
    async scanGym(photos){
      const state = getState();
      const key = getKey();
      if(!key) throw new CoachError("Reading a photo needs an API key.","nokey");
      if(!photos?.length) throw new CoachError("No photo to look at.","photo");

      const list = SEED_STATIONS.map(s=>`${s.num} = ${s.name} (${s.kind})`).join("\n");
      const content = [
        ...photos.slice(0,PHOTO_MAX).map(p=>({
          type:"image", source:{type:"base64", media_type:p.mediaType, data:p.b64}})),
        { type:"text", text:`${photos.length===1?"This photo shows":"These photos show"} a gym the user is training in today, away from their usual one. Work out what they can train with.

STATION LIST — match what you see to these, and only these, by number:
${list}

How to do this well:
- Only report a station if you can actually see something that is that piece of equipment. A room that "probably has" a leg press does not have one.
- Match on function, not on brand or colour. Any adjustable bench is #25. Any rack of dumbbells is #29. A cable crossover or functional trainer is #17. A single cable tower is #24. Functional sandbags, power bags or Life Fitness Core Bags are #SB.
- A "likely" or "unsure" is genuinely useful to the user, so use them rather than dropping a partly visible machine or promoting it to certain. They will confirm your list before it's used.
- If you can read weight numbers on the dumbbells, give the heaviest. If you cannot read them, return 0. Guessing a ceiling from how big they look is worse than admitting you can't tell, because they'll be handed a weight they can't lift.
- Put anything real but not on the list into extras — treadmills, kettlebells, bands, a mat. It won't be programmed, but the coach reads it.
- If the photos show no gym equipment at all, return an empty stations list and say so plainly in the summary. Don't invent a gym to be helpful.` },
      ];

      const raw = await callAnthropic({
        state, key, model:getModel(), schema:S_GYM, effort:"low", maxTokens:2000,
        userText:content, timeoutMs:70000,
      });

      const valid = new Set(SEED_STATIONS.map(s=>s.num));
      const seen  = new Set();
      const stations = (raw.stations||[])
        .filter(s=>valid.has(String(s.num)) && !seen.has(String(s.num)) && seen.add(String(s.num)))
        .map(s=>({num:String(s.num), confidence:s.confidence||"likely", seen:s.seen||"",
                  name:(SEED_STATIONS.find(x=>x.num===String(s.num))||{}).name||""}));

      return {
        name: (raw.name||"Away gym").trim().slice(0,40) || "Away gym",
        stations,
        extras: (raw.extras||[]).filter(e=>e?.name).map(e=>({name:String(e.name).slice(0,40), note:String(e.note||"")})),
        dumbbellMax: Number(raw.dumbbellMax)>0 ? round25(Number(raw.dumbbellMax)) : null,
        note: String(raw.note||""),
        summary: String(raw.summary||""),
      };
    },

    async testKey(key){
      try{
      /* Listing one model verifies authentication without generating content or
         spending message tokens. It is safe to use for automatic refreshes. */
      const res = await fetch(API_MODELS_URL, {method:"GET", headers:apiHeaders(key)});
      if(!res.ok){
        let msg = `HTTP ${res.status}`;
        try{ const j = await res.json(); msg = j?.error?.message || msg; }catch{}
        const kind=res.status===401?"auth":res.status===429?"rate":"http";
        saveApiStatus(false,kind,msg);
        throw new CoachError(msg,kind);
      }
      saveApiStatus(true);
      return true;
      }catch(err){
        if(err instanceof CoachError) throw err;
        const msg="The browser could not reach the Anthropic API";
        saveApiStatus(false,"network",msg);
        throw new CoachError(msg,"network");
      }
    },
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   DEVICE — audio cues, wake lock, text scale

   All three are preferences that live outside the main state blob, so they
   survive a data reset and never end up in an export.
   ═══════════════════════════════════════════════════════════════════════════ */

const SOUND_KEY = "snapfit_v2_sound";
const SOUND_VOLUME_KEY = "snapfit_v2_sound_volume";
const WAKE_KEY  = "snapfit_v2_wake";
const SCALE_KEY = "snapfit_v2_textscale";
const THEME_KEY = "snapfit_v2_theme";
const REST_KEY  = "snapfit_v2_rest";

function prefOn(key){ try{ return localStorage.getItem(key) !== "off"; }catch{ return true; } }
function setPref(key,on){ try{ localStorage.setItem(key, on?"on":"off"); }catch{} }

/* ── Text scale ───────────────────────────────────────────────────────────
   Body font sizes are written as calc(Xrem * var(--ts, 1)). Setting --ts on
   the root element rescales every one of them with no React re-render at all,
   which is what makes the slider smooth.                                    */

const TEXT_STEPS = [
  {id:"compact",     label:"Compact",     v:0.92, note:"Tighter than default"},
  {id:"standard",    label:"Standard",    v:1.00, note:"Original size"},
  {id:"comfortable", label:"Comfortable", v:1.11, note:"Default — easier to read at arm's length"},
  {id:"large",       label:"Large",       v:1.22, note:"Noticeably bigger"},
  {id:"largest",     label:"Largest",     v:1.35, note:"Biggest available"},
];
const DEFAULT_SCALE = "comfortable";

function loadScaleId(){
  try{
    const v = localStorage.getItem(SCALE_KEY);
    return TEXT_STEPS.some(s=>s.id===v) ? v : DEFAULT_SCALE;
  }catch{ return DEFAULT_SCALE; }
}
function applyScale(id){
  const step = TEXT_STEPS.find(s=>s.id===id) || TEXT_STEPS.find(s=>s.id===DEFAULT_SCALE);
  document.documentElement.style.setProperty("--ts", String(step.v));
  document.documentElement.dataset.textScale=step.id;
  return step;
}
function saveScaleId(id){ try{ localStorage.setItem(SCALE_KEY,id); }catch{} applyScale(id); }
applyScale(loadScaleId());   // before first paint, so there's no visible reflow

/* ── Theme ────────────────────────────────────────────────────────────────
   The palette itself is CSS custom properties in the <head>, so all this has to
   do is decide which set is in force. The inline script up there has already
   stamped data-theme before first paint; this agrees with it, and takes over
   when the user changes the setting.

   "System" means system, continuously — the media-query listener below is what
   makes it follow your phone's own day/night schedule rather than meaning
   "whatever the phone said when the app started".                            */

const THEMES = [
  {id:"system", label:"System", note:"Follows your phone"},
  {id:"light",  label:"Light",  note:"Soft off-white"},
  {id:"dark",   label:"Dark",   note:"The original"},
];
const DEFAULT_THEME = "system";

function loadThemeId(){
  try{
    const v = localStorage.getItem(THEME_KEY);
    return THEMES.some(t=>t.id===v) ? v : DEFAULT_THEME;
  }catch{ return DEFAULT_THEME; }
}
function systemPrefersDark(){
  try{ return window.matchMedia("(prefers-color-scheme: dark)").matches; }catch{ return true; }
}
/* The resolved theme is always an explicit "light" or "dark" — never "system".
   One source of truth beats a data attribute and a media query disagreeing. */
function resolveTheme(id){
  return id === "system" ? (systemPrefersDark() ? "dark" : "light") : id;
}
function applyTheme(id){
  const resolved = resolveTheme(id);
  document.documentElement.dataset.theme = resolved;
  // Keep the browser/OS chrome in step, including when the user has overridden
  // their phone's own preference — which a media-query <meta> couldn't do.
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", resolved==="dark" ? "#0e0e0e" : "#edeae5");
  const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if(bar) bar.setAttribute("content", resolved==="dark" ? "black" : "default");
  return resolved;
}
function saveThemeId(id){ try{ localStorage.setItem(THEME_KEY,id); }catch{} return applyTheme(id); }
applyTheme(loadThemeId());

/* Live-follow the OS. Only acts while the setting is on "system", so an explicit
   Light or Dark choice isn't overridden by the phone switching at sunset. */
try{
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onSystemChange = ()=>{ if(loadThemeId()==="system") applyTheme("system"); };
  mq.addEventListener ? mq.addEventListener("change", onSystemChange)
                      : mq.addListener(onSystemChange);
}catch{}

/* ── Audio cues ───────────────────────────────────────────────────────────
   The whole sequence is scheduled against the AudioContext clock the moment
   rest starts, rather than fired from a JS timer. Timers get throttled to once
   a minute in a backgrounded tab; the audio clock does not. The two whistle
   samples are bundled in the app cache, with synthesised cues as a fallback. */

const CUE_PLAN = [
  {at:20, kind:"short"},
  {at:10, kind:"short"}, {at:9, kind:"short"}, {at:8, kind:"short"}, {at:7, kind:"short"},
  {at:6,  kind:"short"}, {at:5, kind:"short"}, {at:4, kind:"short"}, {at:3, kind:"short"},
  {at:2,  kind:"short"}, {at:1, kind:"short"},
  {at:0,  kind:"long"},
];

const cues = (()=>{
  const SAMPLE_URLS = {
    short:"./assets/sounds/countdown-whistle.mp3",
    long:"./assets/sounds/start-whistle.mp3",
  };
  let ctx = null, live = [], samples = null, loading = null;
  let ready = Promise.resolve(null), scheduleToken = 0;
  let activeRest = null, watchdog = null, watchMark = null, clockMark = null, recovering = false;

  function loadVolume(){
    try{
      const raw = localStorage.getItem(SOUND_VOLUME_KEY);
      if(raw === null) return 100;
      const v = Number(raw);
      return Number.isFinite(v) && v >= 0 && v <= 100 ? v : 100;
    }catch{ return 100; }
  }

  function context(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!ctx || ctx.state === "closed") ctx = new AC();
    return ctx;
  }

  /* "ambient" is the mix-with-other-apps category. Safari versions without
     AudioSession simply ignore this and keep using their normal Web Audio
     policy. Never use "playback" here: it would take over from the music app. */
  function configureAudioSession(){
    try{
      if(navigator.audioSession && "type" in navigator.audioSession){
        navigator.audioSession.type = "ambient";
      }
    }catch{}
  }

  /* Starting a one-frame buffer during the tap gives iOS the explicit user
     activation it requires. This is not a looping keepalive track and cannot
     keep or claim the phone's media session after the tap has finished. */
  function prime(c){
    try{
      if(!c || typeof c.createBuffer !== "function" || typeof c.createBufferSource !== "function") return;
      const source = c.createBufferSource();
      source.buffer = c.createBuffer(1, 1, c.sampleRate || 44100);
      source.connect(c.destination);
      source.start(0);
    }catch{}
  }

  async function recover(c, forceCycle=false){
    if(!c) return null;
    try{
      /* iOS/WebKit has a non-standard "interrupted" state when another app,
         a call, or Control Centre has held audio focus. A suspend/resume cycle
         is the reliable way out; resume alone can leave a silent context. */
      if((forceCycle || c.state === "interrupted") && typeof c.suspend === "function"){
        await c.suspend();
      }
      if(c.state !== "running" && typeof c.resume === "function") await c.resume();
    }catch{
      try{ if(typeof c.resume === "function") await c.resume(); }catch{}
    }
    return c;
  }

  /* Must be called from inside a user gesture or iOS leaves the context
     suspended/interrupted and nothing ever plays. */
  function unlock(){
    configureAudioSession();
    const c = context();
    prime(c);
    const wallPassed = clockMark ? (Date.now()-clockMark.wall)/1000 : 0;
    const audioPassed = clockMark && c ? c.currentTime-clockMark.audio : wallPassed;
    const frozen = wallPassed>.75 && audioPassed<wallPassed-.55;
    ready = c && (c.state !== "running" || frozen) ? recover(c,frozen) : Promise.resolve(c);
    return c;
  }

  async function preload(existingContext=null){
    if(samples) return true;
    const c = existingContext || unlock();
    if(!c || typeof c.decodeAudioData !== "function") return false;
    if(!loading){
      loading = Promise.all(Object.entries(SAMPLE_URLS).map(async ([name,url])=>{
        const res = await fetch(url);
        if(!res.ok) throw new Error(`Couldn't load ${name} whistle`);
        return [name, await c.decodeAudioData(await res.arrayBuffer())];
      })).then(entries=>{
        samples = Object.fromEntries(entries);
        return true;
      }).catch(()=>{
        loading = null;
        return false;
      });
    }
    return loading;
  }

  function clip(c, buffer, at, peak=1){
    if(!buffer || typeof c.createBufferSource !== "function") return false;
    const source = c.createBufferSource(), g = c.createGain();
    source.buffer = buffer;
    g.gain.setValueAtTime((loadVolume()/100) * peak, at);
    source.connect(g).connect(c.destination);
    source.start(at);
    live.push(source);
    return true;
  }

  function blip(c, at, {freq, dur, type="sine", peak=0.3, warble=0}){
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    if(warble){
      // Referee-whistle shrillness comes from the warble, not the pitch.
      const n = 24, curve = new Float32Array(n);
      for(let i=0;i<n;i++) curve[i] = freq + Math.sin(i/n * Math.PI * 2 * 6) * warble;
      osc.frequency.setValueCurveAtTime(curve, at, dur);
    } else {
      osc.frequency.setValueAtTime(freq, at);
    }
    // Envelope, or it clicks at both ends.
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * loadVolume()/100), at + Math.min(0.02, dur/4));
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g).connect(c.destination);
    osc.start(at);
    osc.stop(at + dur + 0.02);
    live.push(osc);
  }

  function play(c, kind, at){
    if(kind==="short")   return clip(c, samples?.short, at) || blip(c, at, {freq:880, dur:0.12});
    if(kind==="double"){
      if(samples?.short){ clip(c, samples.short, at); return clip(c, samples.short, at+0.35); }
      blip(c, at, {freq:880, dur:0.10}); return blip(c, at+0.19, {freq:880, dur:0.10});
    }
    if(kind==="tick")    return blip(c, at, {freq:660, dur:0.055, peak:0.2});
    if(kind==="long")    return clip(c, samples?.long, at) || blip(c, at, {freq:2000, dur:0.7, type:"square", peak:0.34, warble:260});
  }

  function plannedCues(endsAt){
    const secsLeft = (endsAt - Date.now()) / 1000;
    return CUE_PLAN.flatMap(cue=>{
      const offset = secsLeft - cue.at;
      return offset < 0.05 ? [] : [{
        at:cue.at, kind:cue.kind, offset:Math.round(offset*100)/100,
      }];
    });
  }

  function scheduleNow(c, endsAt){
    if(!c || c.state !== "running") return [];
    const now = c.currentTime;
    const used = plannedCues(endsAt);
    used.forEach(cue=> play(c, cue.kind, now + cue.offset));
    return used;
  }

  function stopLive(){
    live.forEach(n=>{ try{ n.stop(0); }catch{} });
    live=[];
  }

  function stopWatchdog(){
    if(watchdog) clearInterval(watchdog);
    watchdog=null; watchMark=null;
  }

  async function rescheduleActive(forceCycle=false){
    if(recovering || !activeRest || activeRest.token!==scheduleToken || !prefOn(SOUND_KEY)) return;
    recovering=true;
    const current={...activeRest};
    try{
      stopLive(); configureAudioSession();
      const c=context();
      await recover(c,forceCycle);
      if(current.token!==scheduleToken || Date.now()>=current.endsAt) return;
      scheduleNow(c,current.endsAt);
      clockMark={wall:Date.now(),audio:c.currentTime};
      watchMark={wall:Date.now(),audio:c.currentTime};
    }finally{ recovering=false; }
  }

  function armWatchdog(token,endsAt,c){
    stopWatchdog();
    activeRest={token,endsAt};
    watchMark={wall:Date.now(),audio:c.currentTime};
    watchdog=setInterval(()=>{
      if(!activeRest || token!==scheduleToken || Date.now()>endsAt+1200){ stopWatchdog(); activeRest=null; return; }
      const current=context(); if(!current) return;
      const wallPassed=(Date.now()-watchMark.wall)/1000;
      const audioPassed=current.currentTime-watchMark.audio;
      if(current.state!=="running") rescheduleActive(false);
      else if(wallPassed>.75 && audioPassed<wallPassed-.55) rescheduleActive(true);
      else if(wallPassed>.75) watchMark={wall:Date.now(),audio:current.currentTime};
    },500);
  }

  if(typeof document !== "undefined"){
    document.addEventListener("visibilitychange", ()=>{
      if(document.visibilityState === "visible" && ctx){
        configureAudioSession();
        if(activeRest) rescheduleActive(ctx.state==="running");
        else if(ctx.state!=="running") ready = recover(ctx);
      }
    });
  }

  return {
    enabled: ()=>prefOn(SOUND_KEY),
    setEnabled(on){ setPref(SOUND_KEY,on); if(!on){ this.cancel(); } },
    volume: loadVolume,
    setVolume(v){
      const safe = Math.max(0, Math.min(100, Number(v)||0));
      try{ localStorage.setItem(SOUND_VOLUME_KEY, String(safe)); }catch{}
      return safe;
    },
    supported: ()=>!!(window.AudioContext || window.webkitAudioContext),
    unlock,
    preload,

    /* Schedule every cue for a rest ending at `endsAt` (epoch ms). Returns the
       offsets in seconds it scheduled, which is what the tests assert on. */
    schedule(endsAt){
      this.cancel();
      if(!prefOn(SOUND_KEY)) return [];
      const token = scheduleToken;
      const c = unlock();
      if(!c) return [];
      if(!samples) preload(c); // ready for the next rest if this one started too quickly
      const planned = plannedCues(endsAt);
      const queue = ()=>{
        if(token !== scheduleToken || !prefOn(SOUND_KEY)) return;
        scheduleNow(c, endsAt);
        clockMark={wall:Date.now(),audio:c.currentTime};
        armWatchdog(token,endsAt,c);
      };
      if(c.state === "running") queue();
      else ready.then(queue).catch(()=>{});
      return planned;
    },

    cancel(){
      scheduleToken += 1;
      stopWatchdog(); activeRest=null;
      stopLive();
    },

    /* Settings preview: the same sequence compressed so you can check volume. */
    async test(){
      this.cancel();
      const c = unlock();
      if(!c) return;
      await ready;
      await preload(c);
      if(c.state === "running"){
        const now = c.currentTime + 0.05;
        [0,1,2,3,4].forEach(i=> play(c, "short", now + i*0.42));
        play(c, "long",    now + 2.4);
      }
    },
  };
})();

/* ── Screen wake lock ─────────────────────────────────────────────────────
   Mobile browsers can release a valid lock on a visibility change, a power
   mode change or for no useful reason at all. Re-acquire carefully while a
   workout is active, and expose the real status so the UI never claims the
   screen is protected when iOS has rejected the request.                    */

const wakeLock = (()=>{
  let sentinel=null, wanted=false, pending=false, currentStatus="off", retryTimer=null;
  const listeners=new Set();
  const supported=()=>typeof navigator!=="undefined" && "wakeLock" in navigator;
  const visible=()=>typeof document==="undefined" || document.visibilityState==="visible";
  const notify=status=>{
    currentStatus=status;
    listeners.forEach(fn=>{ try{ fn(status); }catch{} });
  };
  const schedule=(delay=1000)=>{
    clearTimeout(retryTimer);
    if(!wanted||!prefOn(WAKE_KEY)||!visible()) return;
    retryTimer=setTimeout(()=>acquire(),delay);
  };

  async function acquire(){
    if(!wanted||!prefOn(WAKE_KEY)){ notify("off"); return; }
    if(!supported()){ notify("unsupported"); return; }
    if(!visible()) return;
    if(sentinel){ notify("held"); return; }
    if(pending) return;
    pending=true; notify("requesting");
    try{
      const lock=await navigator.wakeLock.request("screen");
      if(!wanted||!prefOn(WAKE_KEY)||!visible()){
        try{ await lock.release(); }catch{}
        notify("off"); return;
      }
      sentinel=lock; notify("held");
      lock.addEventListener("release",()=>{
        if(sentinel===lock) sentinel=null;
        if(wanted&&prefOn(WAKE_KEY)&&visible()){
          notify("released"); schedule(1200);
        } else notify("off");
      });
    }catch{
      sentinel=null; notify("denied"); schedule(5000);
    }finally{ pending=false; }
  }
  function release(){
    clearTimeout(retryTimer);
    const lock=sentinel; sentinel=null;
    try{ lock&&lock.release(); }catch{}
    notify("off");
  }
  if(typeof document!=="undefined"){
    document.addEventListener("visibilitychange",()=>{
      if(visible()) acquire(); else release();
    });
    document.addEventListener("pointerdown",()=>{
      if(wanted&&!sentinel) acquire();
    },{passive:true});
  }
  if(typeof window!=="undefined"){
    window.addEventListener("pageshow",()=>acquire());
    window.addEventListener("focus",()=>acquire());
    setInterval(()=>{ if(wanted&&!sentinel&&visible()) acquire(); },15000);
  }
  return {
    supported,
    enabled:()=>prefOn(WAKE_KEY),
    status:()=>currentStatus,
    subscribe(fn){ listeners.add(fn); fn(currentStatus); return ()=>listeners.delete(fn); },
    retry:()=>{ clearTimeout(retryTimer); acquire(); },
    setEnabled(on){ setPref(WAKE_KEY,on); on ? acquire() : release(); },
    setWanted(v){ wanted=v; v ? acquire() : release(); },
    held:()=>!!sentinel,
  };
})();

/* Minimal markdown — bold, headings, lists, paragraphs. Enough for coach copy. */
function Markdown({text, style}){
  const html = useMemo(()=>{
    if(!text) return "";
    const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const inline = s => esc(s)
      .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
      .replace(/`(.+?)`/g,"<code>$1</code>")
      .replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s).,!?]|$)/g,"$1<em>$2</em>");
    const out=[]; let list=null;
    const flush=()=>{ if(list){ out.push(`<${list.tag}>${list.items.map(i=>`<li>${i}</li>`).join("")}</${list.tag}>`); list=null; } };
    for(const raw of String(text).split("\n")){
      const line = raw.trimEnd();
      if(!line.trim()){ flush(); continue; }
      const h = line.match(/^#{1,4}\s+(.*)$/);
      if(h){ flush(); out.push(`<h3>${inline(h[1])}</h3>`); continue; }
      const ul = line.match(/^\s*[-*•]\s+(.*)$/);
      if(ul){ if(!list||list.tag!=="ul"){ flush(); list={tag:"ul",items:[]}; } list.items.push(inline(ul[1])); continue; }
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if(ol){ if(!list||list.tag!=="ol"){ flush(); list={tag:"ol",items:[]}; } list.items.push(inline(ol[1])); continue; }
      flush(); out.push(`<p>${inline(line)}</p>`);
    }
    flush();
    return out.join("");
  },[text]);
  return <div className="md" style={{fontSize:"calc(.8rem * var(--ts, 1))",color:C.dim,...style}} dangerouslySetInnerHTML={{__html:html}}/>;
}

function SpeakButton({text, label="Listen"}){
  const supported = typeof window!=="undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
  const [speaking,setSpeaking] = useState(false);
  const utteranceRef = useRef(null);

  useEffect(()=>()=>{
    if(utteranceRef.current && supported) window.speechSynthesis.cancel();
  },[supported]);

  function toggle(){
    if(!supported || !text) return;
    window.speechSynthesis.cancel();
    if(speaking){ setSpeaking(false); utteranceRef.current=null; return; }

    const utterance = new SpeechSynthesisUtterance(plainCoachText(text));
    const voices = window.speechSynthesis.getVoices();
    const voice = voices.find(v=>v.lang==="en-AU" && /natural|enhanced|premium|neural/i.test(v.name))
      || voices.find(v=>v.lang==="en-AU")
      || voices.find(v=>/^en-(GB|NZ|US)/i.test(v.lang));
    if(voice) utterance.voice = voice;
    utterance.lang = voice?.lang || "en-AU";
    utterance.rate = 1.02;
    utterance.pitch = .96;
    utterance.onend = ()=>{ setSpeaking(false); utteranceRef.current=null; };
    utterance.onerror = ()=>{ setSpeaking(false); utteranceRef.current=null; };
    utteranceRef.current = utterance;
    setSpeaking(true);
    window.speechSynthesis.speak(utterance);
  }

  if(!supported || !text) return null;
  return <Btn kind="ghost" size="sm" onClick={toggle}
    aria-label={speaking?"Stop voice summary":`${label} to voice summary`}>
    {speaking?"■ Stop":`▶ ${label}`}
  </Btn>;
}

/* ═══════════════════════════════════════════════════════════════════════════
   NUMBER FIELD — stepper buttons either side of a real editable field, because
   getting from 100 to 47.5 with a +/- button is eleven taps.

   The raw string is held in local state while typing so a half-entered "4."
   isn't clobbered by a re-render, and only committed on blur or Enter.
   ═══════════════════════════════════════════════════════════════════════════ */

function NumberField({value, onChange, step=1, min=0, max=999, suffix, size="lg", inputMode="decimal"}){
  const [draft,setDraft] = useState(null);          // null = not being edited
  const shown = draft !== null ? draft : String(value);

  function commit(raw){
    const n = parseFloat(raw);
    setDraft(null);
    if(!isFinite(n)) return;                        // gibberish: snap back
    onChange(clamp(Math.round(n*100)/100, min, max));
  }
  const bump = d => { setDraft(null); onChange(clamp(round25(value + d), min, max)); };

  const big = size === "lg";
  return (<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:big?12:8}}>
    <button onClick={()=>bump(-step)} style={{width:big?44:30,height:big?44:30,borderRadius:big?12:8,
      border:`1px solid ${C.line}`,background:big?C.raised:C.card,color:C.dim,
      fontSize:big?"1.5rem":"1rem",cursor:"pointer",flexShrink:0,lineHeight:1}}>−</button>

    <div style={{position:"relative",flex:big?undefined:1,minWidth:0}}>
      <input
        value={shown}
        inputMode={inputMode}
        onChange={e=>setDraft(e.target.value.replace(/[^0-9.]/g,""))}
        onFocus={e=>{ setDraft(String(value)); e.target.select(); }}
        onBlur={e=>commit(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter"){ e.preventDefault(); commit(e.target.value); e.target.blur(); } }}
        style={{
          width:big?110:78, textAlign:"center", background:"transparent",
          border:"none", borderBottom:`1px dashed ${C.line}`, outline:"none", color:C.text,
          fontFamily:"'Bebas Neue',sans-serif",
          fontSize:big?"3.2rem":"1.15rem", lineHeight:1, padding:big?"0 0 4px":"0 0 2px",
        }}/>
      {suffix && <span style={{fontSize:big?"1rem":".7rem",color:C.faint,marginLeft:2}}>{suffix}</span>}
    </div>

    <button onClick={()=>bump(step)} style={{width:big?44:30,height:big?44:30,borderRadius:big?12:8,
      border:`1px solid ${C.line}`,background:big?C.raised:C.card,color:C.dim,
      fontSize:big?"1.5rem":"1rem",cursor:"pointer",flexShrink:0,lineHeight:1}}>+</button>
  </div>);
}

/* ═══════════════════════════════════════════════════════════════════════════
   REP PICKER — reps, then how it felt.
   ═══════════════════════════════════════════════════════════════════════════ */

function RepPicker({exercise, setIndex, initial, lastWeight, onSave, onClose}){
  const [step,setStep]     = useState("reps");
  const [reps,setReps]     = useState(initial?.reps ?? exercise.targetReps);
  const [effort,setEffort] = useState(initial?.effort ?? null);
  // Editing this set → its own value. Otherwise the weight actually used on the
  // last set, not the planned one, so a mid-exercise drop carries forward.
  const [weight,setWeight] = useState(initial?.weight ?? lastWeight ?? exercise.weight);
  const carried = initial?.weight == null && lastWeight != null && lastWeight !== exercise.weight;
  const exerciseKind=exercise.kind||EX_BY_ID[exercise.exId]?.kind;
  const snapWeight=n=>exerciseKind==="dumbbell" && (Number(exercise.inc)||2)===2
    ? (n<=10?Math.round(n):10+roundToIncrement(n-10,2))
    : roundToIncrement(n,exercise.inc||2.5);

  const target = exercise.targetReps;
  const opts = [...new Set([target-3,target-2,target-1,target,target+1,target+2,target+3].filter(n=>n>=0))];
  const rc = reps>=target ? C.green : reps>=target*0.75 ? C.yellow : C.red;

  const suggestion = useMemo(()=>{
    if(!effort) return null;
    const e = EFFORT_BY_KEY[effort]; const inc = exercise.inc||2.5;
    if(effort==="easy"  && reps>=target) return {msg:`Too light — try ${snapWeight(weight+inc)}kg on the next set`, color:e.color};
    if(effort==="easy")                  return {msg:`Felt light but short of target — hold ${weight}kg`, color:C.yellow};
    if(effort==="good")                  return {msg:`That's the zone. Keep ${weight}kg.`, color:e.color};
    if(effort==="hard" && reps>=target)  return {msg:`Hard but you got the reps — hold ${weight}kg`, color:e.color};
    if(effort==="hard")                  return {msg:`Short of target — hold ${weight}kg and rebuild reps`, color:C.yellow};
    if(effort==="failed")                return {msg:`Drop to ${snapWeight(Math.max(0,weight-inc))}kg for the next set`, color:e.color};
    return null;
  },[effort,reps,weight,target,exercise.inc]);

  return (<div onClick={onClose} style={{position:"fixed",inset:0,background:C.scrimDeep,zIndex:220,
      display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div className="pop" onClick={e=>e.stopPropagation()} style={{background:C.surface,border:`1px solid ${C.line}`,
      borderRadius:20,padding:"22px 20px 18px",width:"100%",maxWidth:320,textAlign:"center"}}>

      <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,letterSpacing:".08em",marginBottom:2}}>{exercise.name.toUpperCase()}</div>
      <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.ghost,marginBottom:14}}>Set {setIndex+1} of {exercise.sets}</div>

      <div style={{display:"flex",justifyContent:"center",gap:6,marginBottom:16}}>
        <div style={{height:3,width:38,borderRadius:2,background:step==="reps"?C.red:C.ghost}}/>
        <div style={{height:3,width:38,borderRadius:2,background:step==="effort"?C.red:C.ghost}}/>
      </div>

      {step==="reps" && (<>
        <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.dim,fontWeight:700,letterSpacing:".1em",marginBottom:4}}>REPS COMPLETED</div>
        <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,marginBottom:14}}>Target: <span style={{color:C.text,fontWeight:600}}>{target}</span> at {weight}kg</div>

        <div style={{marginBottom:4}}>
          <NumberField value={reps} onChange={setReps} step={1} min={0} max={99} inputMode="numeric"/>
        </div>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.ghost,marginBottom:12}}>reps done — tap the number to type it</div>

        <div style={{display:"flex",gap:5,justifyContent:"center",flexWrap:"wrap",marginBottom:14}}>
          {opts.map(n=>(<button key={n} onClick={()=>setReps(n)} style={{width:34,height:34,borderRadius:8,
            border:`1.5px solid ${reps===n?C.red:C.line}`, background:reps===n?C.red:C.raised,
            color:reps===n?"#fff":C.dim, fontSize:"calc(.74rem * var(--ts, 1))", fontWeight:700, cursor:"pointer"}}>{n}</button>))}
        </div>

        <div style={{background:C.raised,borderRadius:10,padding:"9px 10px",marginBottom:6}}>
          <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,marginBottom:5}}>Weight used</div>
          <NumberField value={weight} onChange={setWeight} step={exercise.inc||2.5}
            min={0} max={999} suffix="kg" size="sm"/>
        </div>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:carried?C.yellow:C.ghost,marginBottom:14,lineHeight:1.5}}>
          {carried ? `Carried over from your last set. Coach says ${exercise.weight}kg.`
                   : `Coach says ${exercise.weight}kg.`}
        </div>

        <Btn onClick={()=>setStep("effort")} full size="md">HOW DID IT FEEL? →</Btn>
      </>)}

      {step==="effort" && (<>
        <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.dim,fontWeight:700,letterSpacing:".1em",marginBottom:4}}>HOW MANY LEFT IN THE TANK?</div>
        <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,marginBottom:14}}>{reps} reps at {weight}kg</div>

        <div style={{display:"flex",flexDirection:"column",gap:7,marginBottom:14}}>
          {EFFORT.map(e=>(<button key={e.key} onClick={()=>setEffort(e.key)} style={{
            width:"100%",padding:"10px 13px",borderRadius:12,cursor:"pointer",display:"flex",
            alignItems:"center",gap:11,textAlign:"left",
            border:`1.5px solid ${effort===e.key?e.color:C.line}`, background:effort===e.key?`${tint(e.color,0x12)}`:C.raised}}>
            <span style={{fontSize:"calc(1.3rem * var(--ts, 1))",flexShrink:0}}>{e.emoji}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:"calc(.76rem * var(--ts, 1))",fontWeight:700,color:effort===e.key?e.color:C.dim}}>{e.label}</div>
              <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.faint,marginTop:1}}>{e.desc}</div>
            </div>
          </button>))}
        </div>

        {suggestion && <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:suggestion.color,background:`${tint(suggestion.color,0x10)}`,
          border:`1px solid ${tint(suggestion.color,0x30)}`,borderRadius:9,padding:"8px 10px",marginBottom:14,lineHeight:1.5}}>
          {suggestion.msg}</div>}

        <div style={{display:"flex",gap:8}}>
          <Btn kind="ghost" size="md" onClick={()=>setStep("reps")} style={{width:46,padding:0}}>←</Btn>
          <Btn disabled={!effort} onClick={()=>{onSave({reps,effort,weight}); onClose();}} full size="md">LOG IT ✓</Btn>
        </div>
      </>)}
    </div>
  </div>);
}

/* ═══════════════════════════════════════════════════════════════════════════
   REST TIMER BAR

   Lives at App level so it survives tab changes, and derives remaining time
   from a wall-clock `endsAt` rather than counting down a number — throttling in
   a backgrounded tab can make the display coarse, but it can never be wrong,
   and it self-corrects the moment you come back.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════════════
   AWAY GYM
   Photograph a hotel gym, confirm what was found, train from it for the day.

   Two paths on purpose. The photo path needs a key; the by-hand path needs
   nothing, so travelling still works offline in a basement gym with no signal —
   which is where you most often are when you need this.

   Everything the photo produces is CONFIRMED before it applies. Vision misreads
   equipment, and a silently wrong list means a session full of exercises you
   can't do. Reviewing a ticked list takes ten seconds and removes that failure
   mode entirely.
   ═══════════════════════════════════════════════════════════════════════════ */

/* A small hotel gym, as a starting point for the by-hand path. Dumbbells and a
   couple of benches is the overwhelmingly common case. */
const VENUE_PRESETS = [
  {id:"hotel",   label:"Typical hotel gym", sub:"Dumbbells, benches, a cable stack",
   stations:["29","25","26","17","37"]},
  {id:"minimal", label:"Dumbbells and a bench", sub:"The bare minimum that still trains everything",
   stations:["29","25","26"]},
  {id:"machines",label:"Machine circuit",     sub:"A row of fixed machines, no free weights",
   stations:["15","16","6","10","11","35","48"]},
];

const CONF_STYLE = {
  sure:   {label:"clear",     color:C.green},
  likely: {label:"likely",    color:C.yellow},
  unsure: {label:"a guess",   color:C.orange},
};

function GymSheet({state, coach, apiKey, onApply, onClear, onForget, onClose}){
  const t = state.travel;
  const [mode,setMode]   = useState(t && !t.active ? "again" : "menu");
  const [busy,setBusy]   = useState(false);
  const [err,setErr]     = useState("");
  const [photos,setPhotos] = useState([]);      // [{preview,b64,mediaType,bytes}]
  const [found,setFound] = useState(null);      // scan result awaiting confirmation
  const [ticked,setTicked] = useState(new Set());
  const [name,setName]   = useState("");
  const [dbMax,setDbMax] = useState("");
  const fileRef = useRef(null);

  const stationName = num => (SEED_STATIONS.find(s=>s.num===num)||{}).name || `#${num}`;

  /* How much of a session a given station list can actually build, worked out
     against the real pool so the number isn't a guess. This is the honest
     answer to "is this enough to train?" and it's shown before you commit. */
  function coverage(nums){
    const probe = {...state, travel:{name:"probe", stations:nums, custom:[], active:true, date:todayISO()}};
    const pool = availableExercises(probe);
    const patterns = new Set(pool.map(e=>e.pattern));
    const core = [P.SQUAT,P.HINGE,P.PUSH_H,P.PUSH_V,P.PULL_H,P.PULL_V];
    return { count:pool.length, covered:core.filter(p=>patterns.has(p)),
             missing:core.filter(p=>!patterns.has(p)) };
  }

  async function addPhotos(e){
    const files = [...(e.target.files||[])];
    e.target.value = "";
    if(!files.length) return;
    setErr("");
    setBusy(true);
    try{
      const room = PHOTO_MAX - photos.length;
      if(room <= 0) throw new CoachError(`Three photos is the limit — that's plenty for one room.`,"photo");
      const shrunk = [];
      for(const f of files.slice(0,room)) shrunk.push(await shrinkImage(f));
      setPhotos(p=>[...p, ...shrunk]);
    }catch(e2){ setErr(e2.message); }
    finally{ setBusy(false); }
  }

  async function runScan(){
    setErr(""); setBusy(true);
    try{
      const r = await coach.scanGym(photos);
      setFound(r);
      setName(r.name);
      setDbMax(r.dumbbellMax ? String(r.dumbbellMax) : "");
      // Guesses start unticked. An unsure match you never noticed is exactly
      // the thing that produces an exercise you can't do.
      setTicked(new Set(r.stations.filter(s=>s.confidence!=="unsure").map(s=>s.num)));
      setMode("review");
    }catch(e2){
      setErr(e2.kind==="nokey" ? "Reading a photo needs an API key. Settings has the field, or pick your equipment by hand below."
           : e2.kind==="auth"  ? "Your API key was rejected. Check it in Settings."
           : `Couldn't read the photos: ${e2.message}`);
    }
    finally{ setBusy(false); }
  }

  /* Everything is passed in rather than read off the form fields, because the
     reuse path has no form — reading `dbMax` there silently dropped the
     dumbbell ceiling and handed you weights the rack doesn't have. */
  function applyNow({stations, label, source, dumbbellMax, note}){
    const list = [...stations];
    if(!list.length){ setErr("Tick at least one thing you can train with."); return; }
    onApply({
      name: (label||"Away gym").trim() || "Away gym",
      stations: list,
      custom: [],
      note: note || "",
      dumbbellMax: Number(dumbbellMax)>0 ? Number(dumbbellMax) : null,
      source: source || "manual",
      date: todayISO(),
      active: true,
    });
  }
  const typedMax = () => Number(dbMax)>0 ? Number(dbMax) : null;

  /* ── an away gym from a previous day, still on file ───────────────────── */
  if(mode==="again" && t) {
    const cov = coverage(t.stations);
    return (<Sheet onClose={onClose} title="TRAINING AWAY AGAIN?"
      sub={`You set up ${t.name} on ${t.date}. It's switched off because that was a different day.`}>
      <Card accent={C.blue} style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.84rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:6}}>{t.name}</div>
        <div style={{fontSize:"calc(.7rem * var(--ts, 1))",color:C.faint,lineHeight:1.6}}>
          {t.stations.length} stations · {cov.count} exercises available
          {t.dumbbellMax ? ` · dumbbells to ${t.dumbbellMax}kg` : ""}
        </div>
      </Card>
      <Btn size="lg" full onClick={()=>applyNow({stations:t.stations, label:t.name, source:t.source,
        dumbbellMax:t.dumbbellMax, note:t.note})}>USE {t.name.toUpperCase()} TODAY</Btn>
      <div style={{display:"flex",gap:8,marginTop:10}}>
        {/* Somewhere new means starting clean — inheriting the last venue's
            name and dumbbell ceiling would quietly mislabel the new one. */}
        <Btn kind="solid" full onClick={()=>{ setName(""); setDbMax(""); setMode("menu"); }}>Somewhere new</Btn>
        <Btn kind="ghost" full onClick={onForget}>Forget it</Btn>
      </div>
    </Sheet>);
  }

  /* ── the review step: correct the scan before it applies ─────────────── */
  if(mode==="review" && found){
    const cov = coverage([...ticked]);
    const byConf = ["sure","likely","unsure"];
    return (<Sheet onClose={onClose} title="IS THIS RIGHT?"
      sub="Untick anything that isn't there. This is the list your session gets built from.">

      {found.summary && <Card accent={C.blue} style={{marginBottom:12}}>
        <Markdown text={found.summary}/>
      </Card>}

      {!found.stations.length && (<Card accent={C.orange} style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.text,lineHeight:1.6}}>
          Nothing in the catalogue was recognised in those photos. Either it's equipment this app
          doesn't know, or the photos didn't capture much. Pick by hand instead — it'll be quicker
          than another round of photos.
        </div>
        <Btn kind="solid" full style={{marginTop:10}} onClick={()=>setMode("manual")}>PICK BY HAND →</Btn>
      </Card>)}

      {byConf.map(conf=>{
        const rows = found.stations.filter(s=>s.confidence===conf);
        if(!rows.length) return null;
        const cs = CONF_STYLE[conf];
        return (<div key={conf} style={{marginBottom:12}}>
          <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:cs.color,fontWeight:700,
            letterSpacing:".1em",textTransform:"uppercase",marginBottom:6}}>
            {conf==="sure"?"Clearly there":conf==="likely"?"Probably there":"Guesses — ticked only if you say so"}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {rows.map(s=>{
              const on = ticked.has(s.num);
              return (<button key={s.num} onClick={()=>setTicked(x=>{
                  const n = new Set(x); n.has(s.num) ? n.delete(s.num) : n.add(s.num); return n; })}
                style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:11,
                  border:`1px solid ${on?tint(C.green,0x55):C.line}`, background:on?`${tint(C.green,0x0d)}`:C.raised,
                  cursor:"pointer",textAlign:"left",width:"100%"}}>
                <span style={{width:20,height:20,borderRadius:6,flexShrink:0,display:"inline-flex",
                  alignItems:"center",justifyContent:"center",fontSize:"calc(.7rem * var(--ts, 1))",
                  border:`1.5px solid ${on?C.green:C.line}`,background:on?C.green:"transparent",
                  color:C.onGreen,fontWeight:900}}>{on?"✓":""}</span>
                <span style={{flex:1,minWidth:0}}>
                  <span style={{display:"block",fontSize:"calc(.78rem * var(--ts, 1))",
                    color:on?C.text:C.dim,fontWeight:on?600:400}}>{s.name}</span>
                  {s.seen && <span style={{display:"block",fontSize:"calc(.6rem * var(--ts, 1))",
                    color:C.ghost,marginTop:2}}>saw: {s.seen}</span>}
                </span>
              </button>);
            })}
          </div>
        </div>);
      })}

      {!!found.extras.length && (<div style={{marginBottom:12}}>
        <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.faint,fontWeight:700,
          letterSpacing:".1em",textTransform:"uppercase",marginBottom:6}}>Also spotted</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {found.extras.map((x,i)=><Chip key={i} color={C.faint}>{x.name}</Chip>)}
        </div>
        <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.ghost,marginTop:6,lineHeight:1.5}}>
          Not in the exercise catalogue, so nothing gets programmed on them — but your coach knows they're there if you ask.
        </div>
      </div>)}

      <Field label="Call this place">
        <Input value={name} onChange={e=>setName(e.target.value)} placeholder="Hotel gym"/>
      </Field>

      <Field label="Heaviest dumbbell" hint={found.dumbbellMax
          ? "Read off your photo. Correct it if that's wrong — the coach won't prescribe above it."
          : "Couldn't read the numbers off the photo. Worth filling in: nothing will be prescribed above it."}>
        <Input value={dbMax} onChange={e=>setDbMax(e.target.value)} inputMode="decimal" placeholder="e.g. 20"/>
      </Field>

      <CoverageNote cov={cov}/>

      <Btn size="lg" full disabled={!ticked.size}
        onClick={()=>applyNow({stations:ticked, label:name, source:"photo",
          dumbbellMax:typedMax(), note:found.note})}>
        TRAIN HERE TODAY →</Btn>
      <div style={{display:"flex",gap:8,marginTop:10}}>
        <Btn kind="solid" full onClick={()=>{setFound(null);setPhotos([]);setMode("photo");}}>Retake photos</Btn>
        <Btn kind="ghost" full onClick={()=>setMode("manual")}>Pick by hand</Btn>
      </div>
      {err && <ErrLine text={err}/>}
    </Sheet>);
  }

  /* ── the photo step ──────────────────────────────────────────────────── */
  if(mode==="photo"){
    return (<Sheet onClose={onClose} title="PHOTOGRAPH THE GYM"
      sub={`Up to ${PHOTO_MAX} photos. Wide shots of the walls beat close-ups of one machine.`}>

      <input ref={fileRef} type="file" accept="image/*" capture="environment" multiple
        onChange={addPhotos} style={{display:"none"}}/>

      {!!photos.length && (<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
        {photos.map((p,i)=>(<div key={i} style={{position:"relative",aspectRatio:"1",borderRadius:11,
          overflow:"hidden",border:`1px solid ${C.line}`}}>
          <img src={p.preview} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
          <button onClick={()=>setPhotos(x=>x.filter((_,j)=>j!==i))} style={{position:"absolute",top:4,right:4,
            width:24,height:24,borderRadius:12,border:"none",background:"rgba(0,0,0,.75)",color:"#fff",
            cursor:"pointer",fontSize:"calc(.66rem * var(--ts, 1))"}}>✕</button>
        </div>))}
      </div>)}

      {photos.length < PHOTO_MAX && (
        <Btn kind="solid" full onClick={()=>fileRef.current?.click()} disabled={busy}>
          {busy ? <><Spinner/> PREPARING</> : photos.length ? "＋ ANOTHER PHOTO" : "📷 TAKE OR CHOOSE PHOTOS"}
        </Btn>)}

      <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.ghost,margin:"10px 0 14px",lineHeight:1.6}}>
        Photos are resized on your phone and sent straight to Anthropic to be read, exactly like
        everything else the coach does. They aren't stored anywhere — not on a server, not in the app.
        Once you've confirmed the equipment list, the photos are gone.
      </div>

      <Btn size="lg" full onClick={runScan} disabled={busy || !photos.length}>
        {busy ? <><Spinner color="#fff"/> READING THE ROOM</> : "READ THE EQUIPMENT →"}
      </Btn>
      <Btn kind="ghost" full style={{marginTop:10}} onClick={()=>setMode("menu")}>Back</Btn>
      {err && <ErrLine text={err}/>}
    </Sheet>);
  }

  /* ── the by-hand step ────────────────────────────────────────────────── */
  if(mode==="manual"){
    const cov = coverage([...ticked]);
    return (<Sheet onClose={onClose} title="WHAT'S IN THERE?"
      sub="Start from a preset, then tick and untick. No key or signal needed.">

      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
        {VENUE_PRESETS.map(p=>(
          <button key={p.id} onClick={()=>{setTicked(new Set(p.stations)); if(!name) setName(p.label);}}
            style={{padding:"11px 13px",borderRadius:11,border:`1px solid ${C.line}`,background:C.raised,
              cursor:"pointer",textAlign:"left",width:"100%"}}>
            <div style={{fontSize:"calc(.78rem * var(--ts, 1))",color:C.text,fontWeight:600}}>{p.label}</div>
            <div style={{fontSize:"calc(.62rem * var(--ts, 1))",color:C.faint,marginTop:2}}>{p.sub}</div>
          </button>))}
      </div>

      <div style={{fontSize:"calc(.58rem * var(--ts, 1))",color:C.dim,fontWeight:700,letterSpacing:".1em",
        textTransform:"uppercase",marginBottom:8}}>Everything · {ticked.size} ticked</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:14}}>
        {SEED_STATIONS.map(s=>{
          const on = ticked.has(s.num);
          return (<button key={s.num} onClick={()=>setTicked(x=>{
              const n = new Set(x); n.has(s.num) ? n.delete(s.num) : n.add(s.num); return n; })}
            style={{padding:"9px 10px",borderRadius:10,cursor:"pointer",textAlign:"left",
              border:`1px solid ${on?tint(C.green,0x55):C.line}`, background:on?`${tint(C.green,0x0d)}`:C.raised,
              color:on?C.text:C.ghost, fontSize:"calc(.68rem * var(--ts, 1))", fontWeight:on?600:400}}>
            {on?"✓ ":""}{s.name}
          </button>);
        })}
      </div>

      <Field label="Call this place">
        <Input value={name} onChange={e=>setName(e.target.value)} placeholder="Hotel gym"/>
      </Field>
      <Field label="Heaviest dumbbell" hint="Optional, and worth it — nothing gets prescribed above it.">
        <Input value={dbMax} onChange={e=>setDbMax(e.target.value)} inputMode="decimal" placeholder="e.g. 20"/>
      </Field>

      <CoverageNote cov={cov}/>

      <Btn size="lg" full disabled={!ticked.size}
        onClick={()=>applyNow({stations:ticked, label:name, source:"manual", dumbbellMax:typedMax()})}>
        TRAIN HERE TODAY →</Btn>
      <Btn kind="ghost" full style={{marginTop:10}} onClick={()=>setMode("menu")}>Back</Btn>
      {err && <ErrLine text={err}/>}
    </Sheet>);
  }

  /* ── the menu ────────────────────────────────────────────────────────── */
  return (<Sheet onClose={onClose} title="WHERE ARE YOU TRAINING?"
    sub={travelOn(state) ? `Currently set to ${t.name}.` : "Your usual gym, unless you say otherwise."}>

    {travelOn(state) && (<Card accent={C.orange} style={{marginBottom:12}}>
      <div style={{fontSize:"calc(.8rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:4}}>
        📍 {t.name}</div>
      <div style={{fontSize:"calc(.68rem * var(--ts, 1))",color:C.faint,lineHeight:1.6,marginBottom:10}}>
        {t.stations.length} stations{t.dumbbellMax?` · dumbbells to ${t.dumbbellMax}kg`:""}.
        Switches off by itself tomorrow, so you can't accidentally train a hotel session at home.
      </div>
      <Btn kind="solid" full onClick={onClear}>BACK TO MY USUAL GYM</Btn>
    </Card>)}

    <button onClick={()=>setMode("photo")} disabled={!apiKey}
      style={{width:"100%",padding:"15px 15px",borderRadius:14,textAlign:"left",marginBottom:8,
        border:`1px solid ${apiKey?tint(C.red,0x55):C.line}`, background:apiKey?`${tint(C.red,0x0d)}`:C.raised,
        cursor:apiKey?"pointer":"not-allowed", opacity:apiKey?1:.55}}>
      <div style={{fontSize:"calc(.86rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:3}}>
        📷 Photograph it</div>
      <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.faint,lineHeight:1.55}}>
        {apiKey
          ? "Your coach reads the equipment off the photos. You confirm the list before anything changes."
          : "Needs an API key — there's no way to read a photo offline. Pick by hand instead, it works the same."}
      </div>
    </button>

    <button onClick={()=>{setTicked(new Set()); setMode("manual");}}
      style={{width:"100%",padding:"15px 15px",borderRadius:14,textAlign:"left",
        border:`1px solid ${C.line}`, background:C.raised, cursor:"pointer"}}>
      <div style={{fontSize:"calc(.86rem * var(--ts, 1))",color:C.text,fontWeight:700,marginBottom:3}}>
        ✋ Pick by hand</div>
      <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.faint,lineHeight:1.55}}>
        Presets for the usual hotel setups, then tick what's actually there. Works with no key and no signal.
      </div>
    </button>

    <div style={{fontSize:"calc(.64rem * var(--ts, 1))",color:C.ghost,marginTop:14,lineHeight:1.65}}>
      Either way your real gym is left exactly as it is — an away gym only applies to today, and your
      block, history and working weights carry straight on.
    </div>
  </Sheet>);
}

function CoverageNote({cov}){
  const enough = cov.missing.length <= 2 && cov.count >= 4;
  const col = cov.count < 4 ? C.orange : enough ? C.green : C.yellow;
  return (<Card accent={col} style={{marginBottom:12,padding:13}}>
    <div style={{fontSize:"calc(.74rem * var(--ts, 1))",color:C.text,fontWeight:600,marginBottom:4}}>
      {cov.count} exercises available here
    </div>
    <div style={{fontSize:"calc(.66rem * var(--ts, 1))",color:C.faint,lineHeight:1.6}}>
      {cov.count < 4
        ? "That's not really enough to build a session from. Tick a few more things — dumbbells and a bench alone will do it."
        : cov.missing.length
          ? `Covers ${cov.covered.length} of 6 main movement patterns. Missing: ${cov.missing.map(p=>PATTERN_LABEL[p].toLowerCase()).join(", ")}. Those get left out rather than faked.`
          : "Every main movement pattern is covered. This is a full session, just with different exercises."}
    </div>
  </Card>);
}
